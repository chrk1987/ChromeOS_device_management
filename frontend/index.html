<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ChromeOS connector - MDM admin portal</title>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root {
    --bg: #f4f3ef;
    --surface: #ffffff;
    --border: #e3e1d8;
    --text: #2c2c2a;
    --text-muted: #5f5e5a;
    --text-faint: #888780;
    --hover-bg: #f1efe8;
    --tile-bg: #f8f7f3;
    --code-bg: #f1efe8;
    --input-border: #b4b2a9;
    --count-bg: #ece9e2;
    --primary: #0c447c;
    --primary-hover: #0a3862;
    --primary-text: #ffffff;
    --active-bg: #eaf3de; --active-text: #27500a;
    --syncing-bg: #e6f1fb; --syncing-text: #0c447c;
    --pending-bg: #faeeda; --pending-text: #633806;
    --disconnected-bg: #f1efe8; --disconnected-text: #5f5e5a;
    --critical-bg: #fbe3e0; --critical-text: #7a1f12;
    --danger-border: #e3a99a;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #181815;
      --surface: #221f1b;
      --border: #3c3934;
      --text: #ece9e2;
      --text-muted: #b3b0a6;
      --text-faint: #8f8c83;
      --hover-bg: #2c2924;
      --tile-bg: #2a2722;
      --code-bg: #2c2924;
      --input-border: #57534a;
      --count-bg: #35322b;
      --primary: #4a9be8;
      --primary-hover: #6cb0ee;
      --primary-text: #0d1b2a;
      --active-bg: #1f3512; --active-text: #a8d98a;
      --syncing-bg: #17324d; --syncing-text: #9ecaf0;
      --pending-bg: #493414; --pending-text: #f0c98c;
      --disconnected-bg: #2c2924; --disconnected-text: #b3b0a6;
      --critical-bg: #482017; --critical-text: #f0aa9a;
      --danger-border: #8a4c3c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #181815;
    --surface: #221f1b;
    --border: #3c3934;
    --text: #ece9e2;
    --text-muted: #b3b0a6;
    --text-faint: #8f8c83;
    --hover-bg: #2c2924;
    --tile-bg: #2a2722;
    --code-bg: #2c2924;
    --input-border: #57534a;
    --count-bg: #35322b;
    --primary: #4a9be8;
    --primary-hover: #6cb0ee;
    --primary-text: #0d1b2a;
    --active-bg: #1f3512; --active-text: #a8d98a;
    --syncing-bg: #17324d; --syncing-text: #9ecaf0;
    --pending-bg: #493414; --pending-text: #f0c98c;
    --disconnected-bg: #2c2924; --disconnected-text: #b3b0a6;
    --critical-bg: #482017; --critical-text: #f0aa9a;
    --danger-border: #8a4c3c;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
  .skeleton { background: linear-gradient(90deg, var(--tile-bg) 25%, var(--hover-bg) 50%, var(--tile-bg) 75%); background-size: 400px 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: 8px; }
  @keyframes chartPulse { 0% { filter: brightness(1); } 35% { filter: brightness(1.45); } 100% { filter: brightness(1); } }
  .chart-pulse { animation: chartPulse 0.5s ease; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); margin: 0; padding: 2rem; color: var(--text); }
  #root { max-width: 1200px; margin: 0 auto; }
  .theme-toggle { border: 1px solid var(--input-border); background: var(--surface); color: var(--text); border-radius: 6px; padding: 4px 8px; font-size: 12px; }
  .tab-bar { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
  .tab-button { border: none; background: none; padding: 8px 14px; font-size: 13px; color: var(--text-muted); border-radius: 0; border-bottom: 2px solid transparent; cursor: pointer; }
  .tab-button:hover { background: var(--hover-bg); }
  .tab-button.active { color: var(--text); font-weight: 600; border-bottom-color: var(--primary); }
  .insight-group-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); margin: 0 0 12px; }
  .insight-group-title:not(:first-child) { margin-top: 26px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; animation: cardIn 0.35s ease both; }
  button { border: 1px solid var(--input-border); background: var(--surface); color: var(--text); border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer; transition: background-color 0.15s ease, transform 0.1s ease; }
  button:hover { background: var(--hover-bg); }
  button:active { transform: scale(0.97); }
  input, select { background: var(--surface); color: var(--text); border: 1px solid var(--input-border); }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 5px; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .badge.active { background: var(--active-bg); color: var(--active-text); }
  .badge.syncing { background: var(--syncing-bg); color: var(--syncing-text); }
  .badge.pending, .badge.authorized { background: var(--pending-bg); color: var(--pending-text); }
  .badge.disconnected { background: var(--disconnected-bg); color: var(--disconnected-text); }
  .badge.warning { background: var(--pending-bg); color: var(--pending-text); }
  .badge.critical, .badge.error { background: var(--critical-bg); color: var(--critical-text); }
  .role-chip { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; padding: 3px 9px; border-radius: 6px; }
  .role-chip.admin { background: var(--syncing-bg); color: var(--syncing-text); }
  .role-chip.operator { background: var(--active-bg); color: var(--active-text); }
  .role-chip.viewer { background: var(--disconnected-bg); color: var(--disconnected-text); }
  .btn-danger { border-color: var(--danger-border); color: var(--critical-text); }
  .btn-danger:hover { background: var(--critical-bg); }
  .btn-primary { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary:disabled, .btn-danger:disabled { background: var(--surface); color: inherit; border-color: var(--input-border); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  /* Tighter button padding/gap specifically for the devices table's Actions
     cell - several buttons now share that one cell (icon-only Restart/Lock-
     bell/Details plus text Reset/Deprovision), so the default 6px/14px
     button padding was enough by itself to force the whole table into
     horizontal scroll even on an ordinary laptop width. */
  .actions-cell { display: flex; gap: 4px; align-items: center; flex-wrap: nowrap; position: relative; }
  .actions-cell button { padding: 5px 8px; }
  code { background: var(--code-bg); color: var(--text); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  h3.card-title { font-size: 13px; font-weight: 600; margin: 0 0 12px; color: var(--text); }
  .stat-row { display: flex; gap: 12px; margin-bottom: 4px; }
  .stat-tile { flex: 1; background: var(--tile-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; min-width: 120px; animation: cardIn 0.35s ease both; transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .stat-tile:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
  .stat-tile .stat-value { font-size: 22px; font-weight: 600; line-height: 1.2; }
  .stat-tile .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .aue-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .aue-row:last-child { border-bottom: none; }
  .empty-note { font-size: 12px; color: var(--text-faint); }
  /* 3 columns, not enough to fit all 5 tiles per row at this container's
     ~1160px width without cramping the legend text (tried minmax:210, the
     legend wrapped mid-word). 3 columns gives each tile enough width for
     its longest legend line and lands on a balanced 3+2 split for 5 items,
     instead of the lonely 4+1 the original wider minmax produced. */
  .donut-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; margin-bottom: 4px; }
  .donut-tile { display: flex; align-items: center; gap: 14px; background: var(--tile-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; animation: cardIn 0.35s ease both; transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .donut-tile:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
  .donut-tile svg { flex-shrink: 0; }
  .donut-arc { transition: stroke-dasharray 0.7s ease, stroke-dashoffset 0.7s ease, filter 0.15s ease; cursor: pointer; }
  .donut-arc:hover { filter: brightness(1.25) drop-shadow(0 0 3px rgba(0,0,0,0.25)); }
  .donut-tile svg { transition: transform 0.2s ease; }
  .donut-tile:hover svg { transform: scale(1.06); }
  .donut-legend-title { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
  .donut-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 4px; }
  .swatch { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  /* Plain grid, not a CSS-column masonry hack - multi-column layout turned
     out to genuinely overlap cards in this app once content heights varied
     (same failure seen on the device-detail cards), which is worse than the
     row-alignment whitespace a normal grid can leave. Uneven whitespace is
     an acceptable trade for content that never visually corrupts. */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; align-items: start; }
  .metric-card { background: var(--tile-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; animation: cardIn 0.35s ease both; transition: transform 0.15s ease, box-shadow 0.15s ease; height: 160px; display: flex; flex-direction: column; overflow: hidden; }
  .metric-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
  .metric-card-content { flex: 1; overflow: hidden; }
  .view-all-btn { margin-top: auto; padding: 6px; background: transparent; border: 1px solid var(--border); color: var(--text-muted); border-radius: 6px; font-size: 11px; cursor: pointer; transition: background 0.15s ease; flex-shrink: 0; }
  .view-all-btn:hover { background: var(--hover-bg); }
  .metric-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .metric-card-title { font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .metric-count { font-size: 11px; font-weight: 600; color: var(--text-faint); background: var(--count-bg); border-radius: 10px; padding: 1px 7px; }
  .metric-count.nonzero { color: var(--critical-text); background: var(--critical-bg); }
  .metric-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; padding: 5px 0; border-top: 1px solid var(--border); }
  .metric-item:first-of-type { border-top: none; }
  .metric-item-name { flex: 0 1 45%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .metric-item-value { flex: 1 1 auto; min-width: 0; font-size: 11px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
  .segbar { display: flex; height: 14px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .segbar > div { transition: width 0.6s ease, filter 0.15s ease; cursor: pointer; }
  .segbar > div:hover { filter: brightness(1.2); }
  .trend-bar { transition: transform 0.15s ease, filter 0.15s ease; transform-origin: bottom; cursor: default; }
  .trend-bar:hover { transform: scaleY(1.06); filter: brightness(1.15); }
  .segbar-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .segbar-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
  .swatch-sq { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex-shrink: 0; }
  .device-detail { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px 24px; padding: 4px; font-size: 13px; line-height: 1.4; }
  .device-detail-label { display: block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); margin-bottom: 4px; }
  .report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
  .report-card { border: 1px solid var(--border); border-radius: 10px; padding: 16px; background: var(--surface); display: flex; flex-direction: column; min-height: 150px; }
  .report-card.locked { background: var(--tile-bg); }
  .report-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .report-card-head h4 { font-size: 15px; margin: 0; color: var(--text); }
  .report-card.locked .report-card-head h4 { color: var(--text-faint); }
  .report-card-icon { color: var(--primary); flex-shrink: 0; }
  .report-card.locked .report-card-icon { color: var(--input-border); }
  .report-card-desc { font-size: 12px; color: var(--text-muted); margin: 0 0 12px; flex: 1; }
  .report-card-foot { margin-top: auto; }
  .lock-note { font-size: 11px; color: var(--text-faint); display: flex; align-items: center; gap: 5px; }
  .subtab-bar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .subtab-button { border: 1px solid var(--border); background: var(--tile-bg); border-radius: 20px; padding: 5px 14px; font-size: 12px; color: var(--text-muted); cursor: pointer; }
  .subtab-button:hover { background: var(--hover-bg); }
  .subtab-button.active { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }
  .subtab-count { font-size: 10px; opacity: 0.8; margin-left: 4px; }
  .scroll-list { max-height: 420px; overflow-y: auto; }
  .card-footnote { font-size: 10.5px; color: var(--text-faint); margin: 8px 0 0; padding-top: 8px; border-top: 1px solid var(--border); line-height: 1.4; }
  .info-dot { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 50%; background: var(--border); color: var(--text-muted); font-size: 10px; font-style: italic; font-family: Georgia, serif; cursor: help; flex-shrink: 0; }
  /* Device detail sections are shown one at a time via subtab-bar instead of
     tiled side by side - a multi-column/grid layout of independently-sized
     cards (Hardware vs. a sparse Network card) turned out to genuinely
     overlap in Chrome once one section's content grew tall, not just leave
     whitespace, so a single full-width panel avoids that class of bug
     entirely rather than trying to tune the alignment further. */
  .detail-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); animation: cardIn 0.3s ease both; }
  .detail-card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); margin: 0 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
  .action-group-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-faint); margin: 12px 0 6px; }
  .action-group-label:first-of-type { margin-top: 0; }
  .action-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .app-usage-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; padding: 4px 0; border-top: 1px solid var(--border); }
  .app-usage-row:first-of-type { border-top: none; }
  .app-usage-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .app-usage-time { flex-shrink: 0; color: var(--text-faint); font-size: 11px; }
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const API = "http://localhost:8080/api/chromeos";
const AUTH_API = "http://localhost:8080/api/auth";
const TOKEN_KEY = "cc_token";

function authHeaders() {
  const token = localStorage.getItem(TOKEN_KEY);
  return token ? { Authorization: `Bearer ${token}` } : {};
}

// Every /api/chromeos call needs the session's bearer token attached - this
// wraps fetch once instead of threading the header through every call site.
function apiFetch(url, opts = {}) {
  return fetch(url, { ...opts, headers: { ...(opts.headers || {}), ...authHeaders() } });
}

// Polling is gated on `enabled` (true once logged in) so the dashboard
// doesn't hammer /status with an unauthenticated request before login.
function useConnectionStatus(enabled) {
  const [status, setStatus] = useState(null);
  const poll = () => apiFetch(`${API}/status`).then(r => r.json()).then(setStatus);
  useEffect(() => {
    if (!enabled) return;
    poll();
    const t = setInterval(poll, 2000);
    return () => clearInterval(t);
  }, [enabled]);
  return [status, poll];
}

// THEME_TEMPLATES: 5 selectable color skins, each independent of the
// light/dark mode toggle (every template has its own light AND dark
// variant). "default" is null on purpose - it means "don't override
// anything," so the plain :root/dark CSS below keeps governing exactly as
// it did before templates existed, with zero regression risk for the
// existing look. The other 4 are applied by setting CSS custom properties
// directly on the root element in useThemeTemplate below.
const THEME_TEMPLATES = [
  { key: "default", name: "Warm Neutral (default)", vars: null },
  {
    key: "bw", name: "Black & White",
    vars: {
      light: { bg:"#ffffff", surface:"#ffffff", border:"#d4d4d4", text:"#111111", "text-muted":"#555555", "text-faint":"#8a8a8a", "hover-bg":"#f2f2f2", "tile-bg":"#f7f7f7", "code-bg":"#f2f2f2", "input-border":"#a3a3a3", "count-bg":"#e8e8e8", primary:"#111111", "primary-hover":"#333333", "primary-text":"#ffffff", "active-bg":"#eeeeee", "active-text":"#2f6b1c", "syncing-bg":"#eeeeee", "syncing-text":"#333333", "pending-bg":"#eeeeee", "pending-text":"#8a5a12", "disconnected-bg":"#eeeeee", "disconnected-text":"#555555", "critical-bg":"#eeeeee", "critical-text":"#a33124", "danger-border":"#bdbdbd" },
      dark: { bg:"#0a0a0a", surface:"#161616", border:"#333333", text:"#f2f2f2", "text-muted":"#b0b0b0", "text-faint":"#808080", "hover-bg":"#222222", "tile-bg":"#1c1c1c", "code-bg":"#222222", "input-border":"#4d4d4d", "count-bg":"#262626", primary:"#f2f2f2", "primary-hover":"#ffffff", "primary-text":"#111111", "active-bg":"#1c1c1c", "active-text":"#8fd97a", "syncing-bg":"#1c1c1c", "syncing-text":"#cfcfcf", "pending-bg":"#1c1c1c", "pending-text":"#e0b56a", "disconnected-bg":"#1c1c1c", "disconnected-text":"#b0b0b0", "critical-bg":"#1c1c1c", "critical-text":"#e8938a", "danger-border":"#4d4d4d" },
    },
  },
  {
    key: "blue", name: "Blue & White",
    vars: {
      light: { bg:"#f5f8fc", surface:"#ffffff", border:"#dbe6f3", text:"#1a2b3c", "text-muted":"#5b7086", "text-faint":"#8a9bab", "hover-bg":"#eaf1fa", "tile-bg":"#eff5fb", "code-bg":"#eaf1fa", "input-border":"#a9c2da", "count-bg":"#e1ebf7", primary:"#1d6fd6", "primary-hover":"#155bb5", "primary-text":"#ffffff", "active-bg":"#e3f3e6", "active-text":"#1c6b2e", "syncing-bg":"#e1ecfa", "syncing-text":"#1d6fd6", "pending-bg":"#fdf1dc", "pending-text":"#8a5a12", "disconnected-bg":"#eaf1fa", "disconnected-text":"#5b7086", "critical-bg":"#fbe4e2", "critical-text":"#a3372a", "danger-border":"#e0a8a0" },
      dark: { bg:"#0d1620", surface:"#132133", border:"#24374d", text:"#e6edf5", "text-muted":"#a8bad0", "text-faint":"#7e91a8", "hover-bg":"#1a2c40", "tile-bg":"#182838", "code-bg":"#1a2c40", "input-border":"#3a5470", "count-bg":"#1f3348", primary:"#5b9df0", "primary-hover":"#7fb3f5", "primary-text":"#0d1620", "active-bg":"#173420", "active-text":"#8fd9a0", "syncing-bg":"#1a2c40", "syncing-text":"#7fb3f5", "pending-bg":"#3d2e12", "pending-text":"#f0c98c", "disconnected-bg":"#1a2c40", "disconnected-text":"#a8bad0", "critical-bg":"#3a1a16", "critical-text":"#f0a89a", "danger-border":"#8a4c3c" },
    },
  },
  {

const THEME_TEMPLATE_KEY = "cc_theme_template";

// Applies the chosen template's variables as inline styles on <html>,
// which take priority over the plain CSS below - resolves "system" against
// the OS preference and re-applies live if the OS preference changes while
// a non-default template is active (matching what the plain CSS's
// prefers-color-scheme media query already does for the default template).
function useThemeTemplate(mode) {
  const [templateKey, setTemplateKey] = useState(() => localStorage.getItem(THEME_TEMPLATE_KEY) || "default");

  useEffect(() => {
    const template = THEME_TEMPLATES.find(t => t.key === templateKey);
    const root = document.documentElement;
    const allVarNames = new Set(THEME_TEMPLATES.flatMap(t => t.vars ? [...Object.keys(t.vars.light)] : []));

    const apply = () => {
      if (!template || !template.vars) {
        allVarNames.forEach(name => root.style.removeProperty(`--${name}`));
        return;
      }
      const resolvedMode = mode === "system"
        ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : mode;
      const palette = template.vars[resolvedMode];
      Object.entries(palette).forEach(([name, value]) => root.style.setProperty(`--${name}`, value));
    };

    apply();
    localStorage.setItem(THEME_TEMPLATE_KEY, templateKey);

    if (mode !== "system") return;
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    mq.addEventListener("change", apply);
    return () => mq.removeEventListener("change", apply);
  }, [templateKey, mode]);

  return [templateKey, setTemplateKey];
}

const THEME_KEY = "cc_theme";

// "system" leaves data-theme unset so the :root:not([data-theme="light"])
// media-query block decides via prefers-color-scheme; "light"/"dark" pin it
// regardless of OS setting via the :root[data-theme="..."] override block.
function useTheme() {
  const [theme, setTheme] = useState(() => localStorage.getItem(THEME_KEY) || "system");
  useEffect(() => {
    if (theme === "system") {
      document.documentElement.removeAttribute("data-theme");
    } else {
      document.documentElement.setAttribute("data-theme", theme);
    }
    localStorage.setItem(THEME_KEY, theme);
  }, [theme]);
  return [theme, setTheme];
}

// Restores a session after a page reload by validating the stored token
// against GET /auth/me, rather than forcing a fresh login every time.
function useAuth() {
  const [auth, setAuth] = useState(undefined); // undefined = checking, null = logged out
  useEffect(() => {
    if (!localStorage.getItem(TOKEN_KEY)) { setAuth(null); return; }
    apiFetch(`${AUTH_API}/me`)
      .then(r => { if (!r.ok) throw new Error("invalid session"); return r.json(); })
      .then(d => setAuth({ username: d.username, role: d.role }))
      .catch(() => { localStorage.removeItem(TOKEN_KEY); setAuth(null); });
  }, []);
  return [auth, setAuth];
}

function LoginScreen({ onLoggedIn, theme, setTheme, template, setTemplate }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setLoading(true);
    setError(null);
    try {
      const res = await fetch(`${AUTH_API}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      localStorage.setItem(TOKEN_KEY, data.token);
      onLoggedIn({ username: data.username, role: data.role });
    } catch (err) {
      setError(err.message || "Login failed");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="card" style={{maxWidth:340, margin:"72px auto"}}>
      <div style={{display:"flex", justifyContent:"flex-end", marginBottom:8}}>
        <ThemeToggle theme={theme} setTheme={setTheme} template={template} setTemplate={setTemplate} />
      </div>
      <h3 className="card-title" style={{display:"flex", alignItems:"center", gap:8}}>
        <PlatformIcon monochrome={template === "bw"} />
        Sign in
      </h3>
      <form onSubmit={submit}>
        <div style={{marginBottom:10}}>
          <label style={{display:"block", fontSize:12, color:"var(--text-muted)", marginBottom:4}}>Username</label>
          <input value={username} onChange={e => setUsername(e.target.value)} autoFocus
            style={{width:"100%", fontSize:13, padding:"6px 8px", boxSizing:"border-box"}} />
        </div>
        <div style={{marginBottom:14}}>
          <label style={{display:"block", fontSize:12, color:"var(--text-muted)", marginBottom:4}}>Password</label>
          <input type="password" value={password} onChange={e => setPassword(e.target.value)}
            style={{width:"100%", fontSize:13, padding:"6px 8px", boxSizing:"border-box"}} />
        </div>
        {error && <p className="empty-note" style={{color:"var(--critical-text)", marginBottom:10}}>{error}</p>}
        <button type="submit" disabled={loading} style={{width:"100%"}}>{loading ? "Signing in..." : "Sign in"}</button>
      </form>
      <p className="empty-note" style={{marginTop:14}}>Demo accounts: admin/admin123 &bull; operator/operator123 &bull; viewer/viewer123</p>
    </div>
  );
}

function SetupWizard({ onConnected }) {
  const [step, setStep] = useState(0);
  const [creds, setCreds] = useState(null);
  const [busy, setBusy] = useState(false);
  const [keyFile, setKeyFile] = useState(null);
  const [parsedKey, setParsedKey] = useState(null); // { clientId, clientEmail, projectId } read straight out of the file, client-side
  const [parseError, setParseError] = useState(null);
  // Neither of these is a secret (unlike the key file itself) - persisting
  // them means a retry after a failed/interrupted connect attempt doesn't
  // require retyping the same admin email and Customer ID again.
  const [adminEmail, setAdminEmail] = useState(() => localStorage.getItem("cc_last_admin_email") || "");
  const [customerId, setCustomerId] = useState(() => localStorage.getItem("cc_last_customer_id") || "");
  const [uploadError, setUploadError] = useState(null);

  useEffect(() => { if (adminEmail) localStorage.setItem("cc_last_admin_email", adminEmail); }, [adminEmail]);
  useEffect(() => { if (customerId) localStorage.setItem("cc_last_customer_id", customerId); }, [customerId]);

  // Reads the JSON key file in the browser the moment it's chosen - client_id/
  // client_email/project_id are visible in the plaintext key already, so
  // this needs no round-trip to the backend and no extra exposure of the
  // key beyond what selecting the file for upload already implies. Lets the
  // admin start pasting the client ID into Admin console immediately instead
  // of waiting until after typing the admin email + customer ID too.
  const onKeyFileChange = async (file) => {
    setKeyFile(file);
    setParsedKey(null);
    setParseError(null);
    if (!file) return;
    try {
      const text = await file.text();
      const json = JSON.parse(text);
      if (json.type !== "service_account") throw new Error("Not a service account key (missing type: service_account).");
      if (!json.client_id) throw new Error("Key is missing client_id.");
      setParsedKey({ clientId: json.client_id, clientEmail: json.client_email, projectId: json.project_id });
    } catch (err) {
      setParseError(err.message || "Couldn't read this file as a service account JSON key.");
    }
  };

  // Uploads the service account key straight from the browser - it's held
  // in memory for this request only, never written to local disk, and the
  // admin types the account/customer details here instead of an operator
  // pre-setting GOOGLE_SERVICE_ACCOUNT_KEY/GOOGLE_ADMIN_EMAIL/
  // GOOGLE_CUSTOMER_ID env vars before starting the backend. Everything
  // after this (steps 2 and 3) is the same flow either way.
  const submitUpload = async (e) => {
    e.preventDefault();
    setBusy(true);
    setUploadError(null);
    try {
      const form = new FormData();
      form.append("key", keyFile);
      form.append("adminEmail", adminEmail);
      form.append("customerId", customerId);
      const res = await apiFetch(`${API}/connect/upload`, { method: "POST", body: form });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      setCreds(data);
      setStep(1);
    } catch (err) {
      setUploadError(err.message || "Upload failed");
    } finally {
      setBusy(false);
    }
  };

  const waitForAuthorization = async () => {
    setBusy(true);
    // real backend would poll until the admin actually clicks authorize
    // in Google Admin console; this mock auto-authorizes on first check
    let authorized = false;
    while (!authorized) {
      const res = await apiFetch(`${API}/connect/status`);
      const data = await res.json();
      if (data.status === "authorized") authorized = true;
      else await new Promise(r => setTimeout(r, 800));
    }
    setBusy(false);
    setStep(2);
  };

  const finish = async () => {
    setBusy(true);
    await apiFetch(`${API}/connect/finish`, { method: "POST" });
    setBusy(false);
    onConnected();
  };

  return (
    <div className="card">
      <p style={{fontSize:12, color:"var(--text-faint)", margin:"0 0 10px"}}>Connectors / ChromeOS / Connect</p>

      {step === 0 && (
        <form onSubmit={submitUpload}>
          <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, marginBottom:6}}>
            <p style={{fontWeight:500, margin:0}}>Step 1: upload service account key</p>
            <a href="/assets/service-account-key-guide.pdf" download
              style={{display:"flex", alignItems:"center", gap:6, fontSize:12, textDecoration:"none", color:"var(--primary)", border:"1px solid var(--input-border)", borderRadius:6, padding:"5px 10px", flexShrink:0}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <path d="M14 2v6h6" />
                <path d="M9 15h6M9 18h6M9 12h2" />
              </svg>
              Setup guide (PDF)
            </a>
          </div>
          <p style={{fontSize:13, color:"var(--text-muted)", margin:"0 0 10px"}}>
            The key file is only used for this request - it's never written to disk. Calls <code>POST /connect/upload</code>.
          </p>
          <div style={{marginBottom:10}}>
            <label style={{display:"block", fontSize:12, color:"var(--text-muted)", marginBottom:4}}>Service account JSON key</label>
            <input type="file" accept="application/json" required onChange={e => onKeyFileChange(e.target.files[0])} style={{fontSize:12}} />
          </div>

          {parseError && (
            <p className="empty-note" style={{color:"var(--critical-text)", marginBottom:14}}>{parseError}</p>
          )}
          {parsedKey && (
            <div className="detail-card" style={{marginBottom:14, padding:"12px 14px"}}>
              <p className="device-detail-label" style={{marginBottom:8}}>Detected from the key file</p>
              <div className="device-detail" style={{gap:"10px 20px"}}>
                <Detail label="Client ID">{parsedKey.clientId}</Detail>
                <Detail label="Service account email">{parsedKey.clientEmail}</Detail>
                <Detail label="Project ID">{parsedKey.projectId}</Detail>
              </div>
              <p className="empty-note" style={{marginTop:8}}>You'll paste the Client ID into Admin console in the next step - fill in the two fields below to continue.</p>
            </div>
          )}

          <div style={{marginBottom:10}}>
            <label style={{display:"block", fontSize:12, color:"var(--text-muted)", marginBottom:4}}>Admin account (impersonated for domain-wide delegation)</label>
            <input type="email" name="admin-email" autoComplete="email" required value={adminEmail} onChange={e => setAdminEmail(e.target.value)}
              placeholder="admin@yourdomain.com" style={{width:280, fontSize:13, padding:"6px 8px"}} />
          </div>
          <div style={{marginBottom:14}}>
            <label style={{display:"block", fontSize:12, color:"var(--text-muted)", marginBottom:4}}>Customer ID</label>
            <input name="customer-id" autoComplete="on" required value={customerId} onChange={e => setCustomerId(e.target.value)}
              placeholder="C0xxxxxxx" style={{width:280, fontSize:13, padding:"6px 8px"}} />
          </div>
          {uploadError && <p className="empty-note" style={{color:"var(--critical-text)", marginBottom:10}}>{uploadError}</p>}
          <button type="submit" disabled={busy || !parsedKey}>{busy ? "Uploading..." : "Upload & continue"}</button>
        </form>
      )}

      {step === 1 && creds && (
        <div>
          <p style={{fontWeight:500, margin:"0 0 6px"}}>Step 2: authorize in Google Admin console</p>
          <p style={{fontSize:13, color:"var(--text-muted)", margin:"0 0 10px"}}>
            Paste this client ID and these scopes into{" "}
            {creds.authorizationUrl
              ? <a href={creds.authorizationUrl} target="_blank" rel="noreferrer">Security &rsaquo; API controls &rsaquo; domain-wide delegation</a>
              : "Security › API controls › domain-wide delegation"}, then click authorize there. This is the one manual step Google requires.
          </p>
          <p style={{fontSize:12}}><code>{creds.clientId}</code></p>
          <ul style={{fontSize:12, color:"var(--text-muted)"}}>
            {creds.scopes.map(s => <li key={s}><code>{s}</code></li>)}
          </ul>
          <button disabled={busy} onClick={waitForAuthorization}>{busy ? "Waiting for authorization..." : "I've authorized it"}</button>
        </div>
      )}

      {step === 2 && (
        <div>
          <p style={{fontWeight:500, margin:"0 0 6px"}}>Step 3: connect and start syncing</p>
          <p style={{fontSize:13, color:"var(--text-muted)"}}>Calls <code>POST /connect/finish</code> - starts the background sync worker.</p>
          <button disabled={busy} onClick={finish}>{busy ? "Connecting..." : "Connect"}</button>
        </div>
      )}
    </div>
  );
}

const SYNC_PRESETS = [5, 15, 30, 60];

// Badge CSS classes are lowercase status keys (active/pending/...), but the
// visible label should read as a proper word - this only touches display
// text, never the className used for coloring.
function titleCase(s) {
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
}

// actionDisplayName: the backend command verb doesn't always match what
// this UI now calls the action - "wipe" is Google's WIPE_USERS command,
// shown everywhere in this UI as "Lock" since that's what it actually does
// (forces re-login, clears local user data - not a full factory reset) and
// matches the Lock button's own label. Anywhere an action name is shown to
// a user (status messages, activity history) should go through this
// instead of the raw backend verb.
const ACTION_DISPLAY_NAMES = { wipe: "lock" };
function actionDisplayName(action) {
  return ACTION_DISPLAY_NAMES[action] || action;
}

// groupBy: preserves first-seen key order (unlike a plain object keyed by
// insertion in some engines) so categories render in the order the backend
// returned them, not alphabetically re-sorted.
function groupBy(items, keyFn) {
  const map = new Map();
  for (const item of items) {
    const key = keyFn(item);
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(item);
  }
  return [...map.entries()];
}

// AppTypeIcon: a generic, type-based glyph (extension/app/theme/Android/web) -
// not a fetch of the app's actual logo. Google's own Admin console shows
// real per-app icons there, but no public Chrome Management API endpoint
// returns an icon image or URL for an installed app - Admin console is
// pulling those from an internal surface, not one available to third-party
// integrations. Rather than fabricate a fake "official-looking" icon per
// app, this shows what's honestly available: what kind of app it is.
function AppTypeIcon({ appType }) {
  const common = { width: 16, height: 16, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 1.8, strokeLinecap: "round", strokeLinejoin: "round" };
  const wrap = (child, bg) => (
    <span style={{display:"inline-flex", alignItems:"center", justifyContent:"center", width:22, height:22, borderRadius:6, background:bg, color:"var(--text-muted)", flexShrink:0}}>
      {child}
    </span>
  );
  if (appType === "EXTENSION") return wrap(<svg {...common} role="img" aria-label="Extension"><path d="M12 3v3M9 6h6v3h2a2 2 0 1 1 0 4h-2v3H9v-3H7a2 2 0 1 1 0-4h2z" /></svg>, "var(--hover-bg)");
  if (appType === "ANDROID_APP" || appType === "ARC") return wrap(<svg {...common} role="img" aria-label="Android app"><rect x="7" y="3" width="10" height="18" rx="2" /><path d="M11 18h2" /></svg>, "var(--hover-bg)");
  if (appType === "THEME") return wrap(<svg {...common} role="img" aria-label="Theme"><circle cx="12" cy="12" r="8" /><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none" /></svg>, "var(--hover-bg)");
  if (appType === "APP" || appType === "HOSTED_APP" || appType === "CHROME_APP" || appType === "BUILT_IN" || appType === "SYSTEM_WEB") return wrap(<svg {...common} role="img" aria-label="App"><rect x="4" y="4" width="16" height="16" rx="2" /><path d="M4 9h16" /></svg>, "var(--hover-bg)");
  return wrap(<svg {...common} role="img" aria-label="Web"><circle cx="12" cy="12" r="8" /><path d="M4 12h16M12 4a11 11 0 0 1 0 16 11 11 0 0 1 0-16z" /></svg>, "var(--hover-bg)");
}

// KNOWN_APP_DOMAINS: a small hardcoded map for the handful of Google apps
// that show up in almost every fleet's usage report under a bare name
// ("Chrome", "Gmail") rather than a URL - there's nothing to extract a
// domain from in those cases, so this fills in the domain by hand for
// exactly these well-known ones. Everything else is resolved generically
// below, not hardcoded.
const KNOWN_APP_DOMAINS = {
  chrome: "google.com", gmail: "mail.google.com", "google calendar": "calendar.google.com",
  "google docs": "docs.google.com", "google docs offline": "docs.google.com",
  "google drive": "drive.google.com", "google sheets": "sheets.google.com", "google slides": "slides.google.com",
  "google meet": "meet.google.com", "google chat": "chat.google.com", "google keep": "keep.google.com",
};

// faviconDomainFor: finds a REAL domain to fetch a REAL favicon for -
// either a hardcoded well-known app, or extracted straight out of the
// app's own URL (its appId, if it looks like one, or its catalog
// homepageUri). Deliberately returns null rather than a guess for
// chrome:// internal pages and bare 32-char extension IDs, which don't
// have a real domain at all - those keep the generic type icon instead of
// a fabricated one.
function faviconDomainFor(appId, displayName, homepageUri) {
  const known = KNOWN_APP_DOMAINS[(displayName || appId || "").toLowerCase()];
  if (known) return known;
  for (const candidate of [appId, homepageUri]) {
    if (candidate && /^https?:\/\//i.test(candidate)) {
      try { return new URL(candidate).hostname; } catch (e) { /* fall through */ }
    }
  }
  return null;
}

// AppIcon: tries a real favicon (via Google's public favicon service - an
// actual fetch of the app's actual site icon, not a fabricated logo) when a
// real domain is resolvable; falls back to the generic AppTypeIcon glyph
// on load failure or when no domain applies at all.
function AppIcon({ appId, displayName, homepageUri, appType }) {
  const domain = faviconDomainFor(appId, displayName, homepageUri);
  const [failed, setFailed] = useState(false);
  if (!domain || failed) return <AppTypeIcon appType={appType} />;
  return (
    <img src={`https://www.google.com/s2/favicons?sz=32&domain=${encodeURIComponent(domain)}`}
      alt="" width={22} height={22} style={{borderRadius:6, flexShrink:0}}
      onError={() => setFailed(true)} />
  );
}

// ActionButton: thin wrapper around a plain <button> - keeps every existing
// call site's disabled/title/onClick/className logic untouched (title still
// carries the "Requires operator/admin role" message when disabled) and just
// adds the icon + label layout inside.
// ActionButton: icon required, label (children) optional - omit children
// entirely for an icon-only button (e.g. Restart/Wipe/Details in the
// devices table, where the icon alone is already unambiguous and every
// extra label just widens a row that already has several actions on it).
// The tooltip (passed as `title` by every call site) still carries the full
// text either way, so nothing is lost for screen readers/hover.
function ActionButton({ icon, children, ...rest }) {

// catalogAppTypeLabel: the fleet-wide installed-apps report (InstalledAppCount)
// uses a different, unprefixed enum (EXTENSION/APP/THEME/HOSTED_APP/ANDROID_APP)
// than the per-device telemetry appsUsage's APPLICATION_TYPE_* enum below -
// two distinct Chrome Management API responses, not a typo.
function catalogAppTypeLabel(appType) {
  const labels = { EXTENSION: "Extension", APP: "Chrome app", THEME: "Theme", HOSTED_APP: "Hosted app", ANDROID_APP: "Android app" };
  return labels[appType] || titleCase((appType || "").toLowerCase().replace(/_/g, " ")) || null;
}
function appTypeLabel(appType) {
  const labels = {
    APPLICATION_TYPE_ARC: "Android app", APPLICATION_TYPE_WEB: "Web",
    APPLICATION_TYPE_CHROME_APP: "Chrome app", APPLICATION_TYPE_EXTENSION: "Extension",
    APPLICATION_TYPE_BUILT_IN: "Built-in", APPLICATION_TYPE_CROSTINI: "Linux",
    APPLICATION_TYPE_SYSTEM_WEB: "System web",
  };
  return labels[appType] || (appType ? titleCase(appType.replace("APPLICATION_TYPE_", "").replace(/_/g, " ").toLowerCase()) : "");
}

// timeAgo: turns a timestamp into "3h 12m ago" - used in the Connection
// column's tooltip so the badge's underlying real data (exactly how long
// since this device's last sync) is one hover away, not hidden behind a
// computed Online/Offline label.
function timeAgo(date) {
  const ms = Date.now() - new Date(date).getTime();
  const mins = Math.floor(ms / 60000);
  if (mins < 1) return "just now";
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return h > 0 ? `${h}h ${m}m ago` : `${m}m ago`;
}

function formatDuration(seconds) {
  if (!seconds) return "0s";
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m`;
  return `${s}s`;
}

// provisionStatusLabel maps the raw Directory API status value to the
// vocabulary Admin console's own Status filter uses (confirmed against its
// filter dialog: All/Provisioned/Pre-provisioned/Deprovisioned/Disabled/
// Suspended) - "Active" is this app's own word for it, not Google's.
// PROVISION_STATUS_META covers every real value Google's ChromeOsDevice.status
// field can return (confirmed against the API reference - previously this
// app only recognized ACTIVE/DISABLED/DEPROVISIONED, silently mis-badging
// the other 7 as "active" and dropping them from the Provisioning status
// donut entirely, since it only ever read those 3 specific keys out of the
// counts map).
const PROVISION_STATUS_META = {
  ACTIVE: { label: "Provisioned", badge: "active", color: "var(--active-text)" },
  DISABLED: { label: "Disabled", badge: "critical", color: "var(--pending-text)" },
  DEPROVISIONED: { label: "Deprovisioned", badge: "disconnected", color: "#a8a6a0" },
  DELINQUENT: { label: "Delinquent (license expired)", badge: "critical", color: "var(--critical-text)" },
  PRE_PROVISIONED: { label: "Pre-provisioned (ZTE)", badge: "syncing", color: "var(--primary)" },
  INACTIVE: { label: "Inactive", badge: "disconnected", color: "#a8a6a0" },
  RETURN_ARRIVED: { label: "Return arrived", badge: "warning", color: "var(--pending-text)" },
  RETURN_REQUESTED: { label: "Return requested", badge: "warning", color: "var(--pending-text)" },
  SHIPPED: { label: "Shipped", badge: "disconnected", color: "#a8a6a0" },
  UNKNOWN: { label: "Unknown", badge: "disconnected", color: "#a8a6a0" },
};
function provisionStatusMeta(status) {
  return PROVISION_STATUS_META[status] || { label: titleCase((status || "unknown").toLowerCase()), badge: "disconnected", color: "#a8a6a0" };
}
function provisionStatusLabel(status) {
  return provisionStatusMeta(status).label;
}

function aueBadge(daysRemaining) {
  return daysRemaining <= 30 ? "critical" : "warning";
}

function storageBadge(percentFree) {
  return percentFree < 5 ? "critical" : "warning";
}

function ramBadge(percentFree) {
  return percentFree < 7.5 ? "critical" : "warning";
}

// Fixed hue order for categorical distributions - never reassigned by rank,
// so the same OS version keeps the same color across refreshes. A 6th+
// category folds into a shared neutral "Other" bucket rather than cycling.
const CATEGORICAL_COLORS = ["var(--primary)", "#6b7b3f", "#8a4f7d", "#b5651d", "#4f7c82"];
const OTHER_COLOR = "#a8a6a0";

function toSegments(distribution) {
  const entries = Object.entries(distribution).sort((a, b) => b[1] - a[1]);
  const top = entries.slice(0, 5).map(([label, value], i) => ({ label, value, color: CATEGORICAL_COLORS[i] }));
  const rest = entries.slice(5);
  if (rest.length) {
    top.push({ label: `Other (${rest.length})`, value: rest.reduce((s, [, v]) => s + v, 0), color: OTHER_COLOR });
  }
  return top;
}

// Donut: a proportion chart for a small, fixed set of whole-fleet states
// (active/offline, reporting/not-reporting) - never used for open-ended
// categorical breakdowns, which use SegmentedBar instead.
function Donut({ segments, size = 72, strokeWidth = 12 }) {
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  const radius = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * radius;
  const [pulseIdx, setPulseIdx] = useState(null);
  let offsetAcc = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} role="img"
      aria-label={segments.map(s => `${s.label}: ${s.value}`).join(", ")}>
      <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke="var(--hover-bg)" strokeWidth={strokeWidth} />
      {segments.map((s, i) => {
        const dash = (s.value / total) * circumference;
        const el = (
          <circle key={i} className={`donut-arc ${pulseIdx === i ? "chart-pulse" : ""}`} cx={size / 2} cy={size / 2} r={radius} fill="none"
            stroke={s.color} strokeWidth={strokeWidth}
            strokeDasharray={`${dash} ${circumference - dash}`}
            strokeDashoffset={-offsetAcc}
            transform={`rotate(-90 ${size / 2} ${size / 2})`}
            onClick={() => setPulseIdx(i)}
            onAnimationEnd={() => setPulseIdx(cur => cur === i ? null : cur)}>
            <title>{s.label}: {s.value}</title>
          </circle>
        );
        offsetAcc += dash;
        return el;
      })}
    </svg>
  );
}

function InfoDot({ text }) {
  if (!text) return null;
  return <span className="info-dot" style={{marginLeft:5}} title={text}>i</span>;
}

function DonutWithLegend({ title, segments, info }) {
  const total = segments.reduce((s, x) => s + x.value, 0);
  return (
    <div className="donut-tile">
      <Donut segments={segments} />
      <div>
        <div className="donut-legend-title" style={{display:"flex", alignItems:"center", gap:5}}>
          {title}
          {info && <span className="info-dot" title={info}>i</span>}
        </div>
        {segments.map(s => (
          <div className="donut-legend-item" key={s.label}>
            <span className="swatch" style={{background:s.color}} />
            <span>{s.label}</span>
            <span style={{color:"var(--text-faint)"}}>{s.value}{total ? ` (${Math.round(s.value / total * 100)}%)` : ""}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function SegmentedBar({ segments }) {
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  const [pulseIdx, setPulseIdx] = useState(null);
  return (
    <div className="segbar">
      {segments.map((s, i) => (
        <div key={i} className={pulseIdx === i ? "chart-pulse" : ""} title={`${s.label}: ${s.value}`}
          style={{width: `${(s.value / total) * 100}%`, background: s.color}}
          onClick={() => setPulseIdx(i)}
          onAnimationEnd={() => setPulseIdx(cur => cur === i ? null : cur)} />
      ))}
    </div>
  );
}

// StorageBar: a used/free proportion bar for one device's disk, styled like
// SegmentedBar (thin, rounded, bordered) rather than a fabricated "empty"
// state - shows nothing but a plain note if the telemetry byte counts
// aren't available, instead of drawing a misleading full/empty bar.
function StorageBar({ usedBytes, totalBytes }) {
  if (!totalBytes || !Number.isFinite(usedBytes)) return <p className="empty-note">Not reported.</p>;
  const usedPercent = Math.round((usedBytes / totalBytes) * 100);
  const gb = 1e9;
  return (
    <div>
      <div className="segbar" style={{marginBottom:4}}>
        <div title={`Used: ${(usedBytes / gb).toFixed(1)} GB`} style={{width: `${usedPercent}%`, background: "var(--primary)"}} />
        <div title={`Free: ${((totalBytes - usedBytes) / gb).toFixed(1)} GB`} style={{width: `${100 - usedPercent}%`, background: "var(--border)"}} />
      </div>
      <span style={{fontSize:11, color:"var(--text-muted)"}}>{usedPercent}% used &bull; {(usedBytes / gb).toFixed(1)} / {(totalBytes / gb).toFixed(1)} GB</span>
    </div>
  );
}

// TrendBars: a small vertical bar chart for month-over-month counts
// (enrollment trend) - simpler than SegmentedBar since bars represent a
// series over time, not a share of one total.
// TrendBars: stacked by ChromeOS type (native ChromeOS vs Flex, on
// repurposed non-Chromebook hardware) so the same chart shows both
// enrollment volume and what kind of hardware it's landing on.
function TrendBars({ points }) {
  const max = Math.max(1, ...points.map(p => p.count));
  const hasFlex = points.some(p => p.flexCount > 0);
  const [pulseMonth, setPulseMonth] = useState(null);
  return (
    <div>
      <div style={{display:"flex", justifyContent:"flex-end", gap:12, marginBottom:6}}>
        <span className="segbar-legend-item"><span className="swatch-sq" style={{background:"var(--primary)"}} />Chrome OS</span>
        <span className="segbar-legend-item"><span className="swatch-sq" style={{background:"#7a4fd8"}} />Chrome OS Flex</span>
      </div>
      <div style={{display:"flex", alignItems:"flex-end", gap:10, height:90, padding:"0 6px", boxSizing:"border-box"}}>
        {points.map(p => (
          <div key={p.month} style={{display:"flex", flexDirection:"column", alignItems:"center", flex:1}}>
            <span style={{fontSize:11, color:"var(--text-muted)", marginBottom:4}}>{p.count}</span>
            <div className={`trend-bar ${pulseMonth === p.month ? "chart-pulse" : ""}`}
              style={{width:"100%", maxWidth:32, display:"flex", flexDirection:"column-reverse", borderRadius:"3px 3px 0 0", overflow:"hidden", height:`${Math.max(4, (p.count / max) * 56)}px`, cursor:"pointer"}}
              onClick={() => setPulseMonth(p.month)}
              onAnimationEnd={() => setPulseMonth(cur => cur === p.month ? null : cur)}>
              {p.chromeOsCount > 0 && <div style={{width:"100%", background:"var(--primary)", flex:p.chromeOsCount}} title={`Chrome OS: ${p.chromeOsCount}`} />}
              {p.flexCount > 0 && <div style={{width:"100%", background:"#7a4fd8", flex:p.flexCount}} title={`Chrome OS Flex: ${p.flexCount}`} />}
              {p.count === 0 && <div style={{width:"100%", background:"var(--border)", flex:1}} />}
            </div>
            <span style={{fontSize:10, color:"var(--text-faint)", marginTop:4}}>{p.month.slice(5)}/{p.month.slice(2,4)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function DistributionCard({ title, distribution, info, exportRows, exportFilename }) {
  const segments = toSegments(distribution);

// MetricCard: the shared shell for every device-list insight (AUE, dev mode,
// extended support, storage/RAM warnings, orphaned devices, etc). Each card
// shows a count badge and up to 4 items so ten warning categories read as a
// scannable grid instead of ten long vertical lists.
function MetricCard({ title, items, emptyText, renderValue, info, onViewAll }) {
  const count = items.length;
  const shown = items.slice(0, 3);
  return (
    <div className="metric-card">
      <div className="metric-card-head">

      </div>

          <>
            {shown.map((item, i) => (
