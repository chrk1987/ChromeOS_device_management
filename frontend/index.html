function PolicyEditRow({ schema, resolved, isAdmin, orgUnits, onChanged, fields, description, category }) {
  const [editing, setEditing] = useState(false);
  const [orgUnitPath, setOrgUnitPath] = useState("/");
  const [valueText, setValueText] = useState("");
  const [confirming, setConfirming] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [done, setDone] = useState(null); // "set" | "clear" | null
  const [showGuide, setShowGuide] = useState(false);
  const [forceRaw, setForceRaw] = useState(false);
  const guide = POLICY_GUIDES[category] || POLICY_GUIDES[schema.displayName];

  const startEditing = (prefill) => {
    setValueText(prefill != null ? prefill : (resolved?.value || ""));
    setError(null);
    setDone(null);
    setEditing(true);
    setShowGuide(false);
    setForceRaw(false);
  };

  // simpleBoolField: when the current value is exactly one boolean field -
  // by far the most common curated-schema shape (guestModeEnabled,
  // devicePowerwashAllowed, audioCaptureAllowed, videoCaptureAllowed, ...) -
  // show a toggle instead of raw JSON. Anything else (enums, arrays, nested
  // objects, multi-field schemas like Blocked URLs) falls back to the JSON
  // textarea: guessing a generic form control for every possible Chrome
  // policy shape without knowing its real proto type risks building
  // something that looks right but silently sends the wrong structure.
  let simpleBoolField = null, simpleBoolValue = null;
  if (!forceRaw) {
    try {
      const parsed = JSON.parse(valueText);
      const keys = Object.keys(parsed);
      if (keys.length === 1 && typeof parsed[keys[0]] === "boolean") {
        simpleBoolField = keys[0];
        simpleBoolValue = parsed[keys[0]];
      }
    } catch (e) { /* not simple JSON yet (e.g. blank, or mid-edit) - stays in raw mode */ }
  }

  const submit = async (kind) => {
    setBusy(true);
    setError(null);
    try {
      if (kind === "set") {
        let parsed;
        try { parsed = JSON.parse(valueText); } catch (e) { throw new Error("Value must be valid JSON, e.g. " + '{"fieldName": true}'); }
        const res = await apiFetch(`${API}/policies/set`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ orgUnitPath, schemaName: schema.schema, value: parsed }),
        });
        if (!res.ok) throw new Error(await res.text());
      } else {
        const res = await apiFetch(`${API}/policies/clear`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ orgUnitPath, schemaName: schema.schema }),
        });
        if (!res.ok) throw new Error(await res.text());
      }
      setDone(kind);
      setConfirming(false);
      if (onChanged) onChanged();
    } catch (e) {
      setError(e.message || "Failed");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="detail-card" style={{marginBottom:8}}>
      <div className="aue-row" style={{border:"none", padding:0}}>
        <span>{schema.displayName}<span style={{marginLeft:6, fontSize:11, color:"var(--text-faint)"}}>{schema.schema}</span></span>
        <span style={{display:"flex", alignItems:"center", gap:8}}>
          <code style={{fontSize:11}}>{resolved?.value || "(not explicitly set - inherited default)"}</code>
          {isAdmin && !editing && <ActionButton icon="edit" onClick={() => startEditing()} title="Edit or clear this policy on an org unit" />}
          {guide && !editing && (
            <ActionButton icon="help" onClick={() => setShowGuide(s => !s)} title="How to use this policy, with a real example" />
          )}
        </span>
      </div>
      {description && <p className="empty-note" style={{margin:"6px 0 0"}}>{description}</p>}

      {showGuide && guide && !editing && (
        <div className="card-footnote" style={{margin:"8px 0 0", padding:8, background:"var(--hover-bg)", borderRadius:6}}>
          <p style={{margin:0}}>{guide.text}</p>
          {guide.example && (
            <p style={{margin:"6px 0 0"}}><code>{guide.example}</code></p>
          )}
          {guide.note && <p style={{margin:"6px 0 0", color:"var(--text-faint)"}}>{guide.note}</p>}
          {isAdmin && guide.example && (
            <button style={{marginTop:8}} onClick={() => startEditing(guide.example)}>Use this example</button>
          )}
        </div>
      )}

      {editing && (
        <div style={{marginTop:10, paddingTop:10, borderTop:"1px solid var(--border)"}}>
          {fields && fields.length > 0 && (
            <div className="card-footnote" style={{margin:"0 0 8px", padding:8, background:"var(--hover-bg)", borderRadius:6}}>
              <b>Real fields for this schema (from Google's own catalog):</b>
              {fields.map(f => (
                <div key={f.name} style={{marginTop:4}}>
                  <code>{f.name}</code>{f.description ? ` - ${f.description}` : ""}
                  {f.knownValues && f.knownValues.length > 0 && (
                    <div style={{color:"var(--text-faint)"}}>Known values: {f.knownValues.join(", ")}</div>
                  )}
                </div>
              ))}
            </div>
          )}
          <div className="action-row" style={{marginBottom:8}}>
            <label style={{fontSize:12, color:"var(--text-muted)"}}>Org unit</label>
            <select value={orgUnitPath} onChange={e => setOrgUnitPath(e.target.value)} style={{fontSize:12, padding:"4px 6px"}}>
              <option value="/">/ (root)</option>
              {(orgUnits || []).filter(ou => ou.path !== "/").map(ou => (
                <option key={ou.path} value={ou.path}>{ou.path}</option>
              ))}
            </select>
          </div>
          {simpleBoolField ? (
            <div className="action-row" style={{marginBottom:6}}>
              <label style={{fontSize:12, color:"var(--text-muted)"}}><code>{simpleBoolField}</code></label>
              <button className={simpleBoolValue ? "btn-primary" : ""} onClick={() => setValueText(JSON.stringify({ [simpleBoolField]: true }))}>On</button>
              <button className={!simpleBoolValue ? "btn-primary" : ""} onClick={() => setValueText(JSON.stringify({ [simpleBoolField]: false }))}>Off</button>
              <button style={{fontSize:11}} onClick={() => setForceRaw(true)} title="Switch to editing the raw JSON value directly">Edit as raw JSON</button>
            </div>
          ) : (
            <textarea value={valueText} onChange={e => setValueText(e.target.value)}
              placeholder={'{"fieldName": true}'}
              style={{width:"100%", minHeight:60, fontFamily:"monospace", fontSize:12, padding:6, boxSizing:"border-box"}} />
          )}
          <p className="card-footnote" style={{margin:"6px 0"}}>
            {simpleBoolField
              ? "This schema resolves to a single true/false field, so it's shown as a toggle - the write underneath is the exact same JSON object either way."
              : "A JSON object - its key(s) must match the field name(s) Google's own resolved value uses for this schema (see the code above, when present; some schemas have more than one field, e.g. Blocked URLs' urlBlocklist + chromeInternalUrlsBlocked - include every field you want set)."}
            {" "}This is a REAL write: it changes what's enforced on every device/user in the org unit you picked, effective next check-in.
          </p>

          {error && <p className="empty-note" style={{color:"var(--critical-text)"}}>{error}</p>}
          {done && <p className="empty-note" style={{color:"var(--active-text)"}}>{done === "set" ? "Policy updated." : "Policy cleared - now inheriting from parent."}</p>}

          {confirming ? (
            <div className="action-row">
              <span className="empty-note" style={{color:"var(--critical-text)", flexBasis:"100%"}}>
                This changes a real, enforced policy on {orgUnitPath} right now. Confirm?
              </span>
              <button disabled={busy} className="btn-danger" onClick={() => submit("set")}>Yes, apply</button>
              <button disabled={busy} onClick={() => setConfirming(false)}>Cancel</button>
            </div>
          ) : (
            <div className="action-row">
              <ActionButton icon="enable" disabled={busy || !valueText.trim()} onClick={() => setConfirming(true)}>Save</ActionButton>
              <ActionButton icon="disable" disabled={busy} className="btn-danger" title="Remove the override on this org unit so it inherits from its parent" onClick={() => submit("clear")}>Clear (inherit)</ActionButton>
              <button disabled={busy} onClick={() => setEditing(false)}>Close</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function SecurityPanel({ isAdmin }) {
  const [subtab, setSubtab] = useState("alerts");
  const [alerts, setAlerts] = useState(null);
  const [alertsError, setAlertsError] = useState(null);
  const [auditLog, setAuditLog] = useState(null);
  const [auditError, setAuditError] = useState(null);
  const [policies, setPolicies] = useState(null);
  const [policiesError, setPoliciesError] = useState(null);
  const [roles, setRoles] = useState(null);
  const [rolesError, setRolesError] = useState(null);
  const [orgUnits, setOrgUnits] = useState(null);
  const [browseQuery, setBrowseQuery] = useState("");
  const [browseResults, setBrowseResults] = useState(null);
  const [browseError, setBrowseError] = useState(null);
  const [browseLoading, setBrowseLoading] = useState(false);
  const [alertBusy, setAlertBusy] = useState({}); // alertId -> action currently running
  const [alertFeedbackGiven, setAlertFeedbackGiven] = useState({}); // alertId -> feedbackType submitted
  const [undoBanner, setUndoBanner] = useState(null); // {id, type} of the alert just deleted, or null

  const reloadAlerts = () => apiFetch(`${API}/security-alerts`)
    .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
    .then(setAlerts).catch(e => setAlertsError(e.message));

  // runAlertAction hits the Alert Center API's real write surface -
  // delete/undelete/feedback are the only real actions available (there's
  // no public API to set an alert's Status/Assignee despite those fields
  // existing in Google's schema). Delete is real and live on Google's side
  // (it disappears from Admin console's own Alert Center too, not just this
  // list), so a delete shows an Undo banner backed by the real Undelete
  // call rather than just a local hide.
  const runAlertAction = async (alert, action, feedbackType) => {
    setAlertBusy(b => ({ ...b, [alert.id]: action }));
    try {
      const res = await apiFetch(`${API}/security-alerts/action`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ alertId: alert.id, action, feedbackType }),
      });
      if (!res.ok) throw new Error(await res.text());
      if (action === "delete") {
        setUndoBanner({ id: alert.id, type: alert.type });
        reloadAlerts();
      } else if (action === "undelete") {
        setUndoBanner(null);
        reloadAlerts();
      } else if (action === "feedback") {
        setAlertFeedbackGiven(f => ({ ...f, [alert.id]: feedbackType }));
      }
    } catch (e) {
      setAlertsError(e.message || "Failed");
    } finally {
      setAlertBusy(b => { const n = { ...b }; delete n[alert.id]; return n; });
    }
  };

  // runBrowseSearch hits the Chrome Policy API's real schema catalog - how
  // app/network/kiosk/print management (and anything else Google exposes as
  // a policy) are reached here, instead of four separate hardcoded
  // integrations. A blank query returns Google's first page of schemas
  // as-is, so "Search" with nothing typed still shows something real.
  const runBrowseSearch = () => {
    setBrowseLoading(true);
    setBrowseError(null);
    apiFetch(`${API}/policies/search?q=${encodeURIComponent(browseQuery)}`)
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
      .then(r => setBrowseResults(r || []))
      .catch(e => setBrowseError(e.message))
      .finally(() => setBrowseLoading(false));
  };

  const reloadPolicies = () => apiFetch(`${API}/policies`)
    .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
    .then(setPolicies).catch(e => setPoliciesError(e.message));

  useEffect(() => {
    apiFetch(`${API}/security-alerts`)
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
      .then(setAlerts).catch(e => setAlertsError(e.message));
    apiFetch(`${API}/audit-log`)
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
      .then(setAuditLog).catch(e => setAuditError(e.message));
    reloadPolicies();
    apiFetch(`${API}/admin-roles`)
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
      .then(setRoles).catch(e => setRolesError(e.message));
    // Org units for the policy editor's target picker - same directory
    // data the Directory tab shows, fetched here too since a policy edit
    // needs the OU list regardless of whether that tab's ever been opened.
    apiFetch(`${API}/directory`)
      .then(r => r.json()).then(d => setOrgUnits(d.orgUnits || []))
      .catch(() => setOrgUnits([]));
  }, []);

  const subtabs = [
    { key: "alerts", label: "Alerts", count: alerts?.length },
    { key: "audit", label: "Audit log", count: auditLog ? auditLog.adminActivity.length + auditLog.loginActivity.length : undefined },
    { key: "policies", label: "Policy compliance", count: policies?.length },
    { key: "browse", label: "Browse policies" },
    { key: "roles", label: "Admin roles", count: roles?.length },
  ];

  return (
    <>
      <div className="subtab-bar">
        {subtabs.map(s => (
          <button key={s.key} className={`subtab-button ${subtab === s.key ? "active" : ""}`} onClick={() => setSubtab(s.key)}>
            {s.label}{s.count != null && <span className="subtab-count">({s.count})</span>}
          </button>
        ))}
      </div>

      {subtab === "alerts" && (
        <div className="card">
          <h3 className="card-title">Security alerts<InfoDot text="Alerts raised by Google's Security Investigation Tool/Alert Center - not generated by this portal." /></h3>
          {alertsError ? (
            <p className="empty-note" style={{color:"var(--critical-text)", maxHeight:90, overflowY:"auto"}} title={alertsError}>Not authorized yet: {alertsError}</p>
          ) : !alerts ? (
            <p className="empty-note">Loading...</p>
          ) : alerts.length === 0 ? (
            <p className="empty-note">No security alerts.</p>
          ) : (
            <div className="scroll-list">
              <DonutWithLegend
                title="By severity"
                segments={[
                  { label: "High", value: alerts.filter(a => a.severity === "HIGH").length, color: "var(--critical-text)" },
                  { label: "Medium", value: alerts.filter(a => a.severity === "MEDIUM").length, color: "var(--pending-text)" },
                  { label: "Low / other", value: alerts.filter(a => a.severity !== "HIGH" && a.severity !== "MEDIUM").length, color: "#a8a6a0" },
                ]}
              />
              <div style={{marginTop:14, paddingTop:10, borderTop:"1px solid var(--border)"}} />
              {undoBanner && (
                <div className="empty-note" style={{display:"flex", alignItems:"center", justifyContent:"space-between", background:"var(--hover-bg)", borderRadius:6, padding:8, marginBottom:8}}>
                  <span>Deleted "{undoBanner.type}" - this is a real, live delete on Google's side (Admin console's Alert Center too).</span>
                  <button onClick={() => runAlertAction({ id: undoBanner.id, type: undoBanner.type }, "undelete")}>Undo</button>
                </div>
              )}
              {alerts.map(a => (
                <div className="aue-row" key={a.id} style={{flexWrap:"nowrap", alignItems:"center"}}>
                  <span style={{flex:1, minWidth:0, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{a.type} &bull; {a.source}</span>
                  <span style={{display:"flex", alignItems:"center", gap:8, flexShrink:0}}>
                    <span style={{fontSize:12, color:"var(--text-muted)", whiteSpace:"nowrap"}}>{a.createTime ? new Date(a.createTime).toLocaleDateString() : "-"}</span>
                    <span className={`badge ${alertSeverityBadge(a.severity)}`}>{a.severity || "unknown"}</span>
                    {isAdmin && (
                      <span style={{display:"flex", alignItems:"center", gap:5, flexShrink:0}}>
                        {alertFeedbackGiven[a.id] ? (
                          <span style={{fontSize:11, color:"var(--text-faint)", whiteSpace:"nowrap"}}>Feedback: {alertFeedbackGiven[a.id]}</span>
                        ) : (
                          <>
                            <span style={{fontSize:11, color:"var(--text-faint)", whiteSpace:"nowrap"}}>Useful?</span>
                            <button disabled={!!alertBusy[a.id]} title="Submit feedback to Google: this alert was very useful" onClick={() => runAlertAction(a, "feedback", "VERY_USEFUL")} style={{padding:"2px 8px", fontSize:12}}>Yes</button>
                            <button disabled={!!alertBusy[a.id]} title="Submit feedback to Google: this alert was not useful" onClick={() => runAlertAction(a, "feedback", "NOT_USEFUL")} style={{padding:"2px 8px", fontSize:12}}>No</button>
                          </>
                        )}
                        <ActionButton icon="wipe" disabled={!!alertBusy[a.id]} className="btn-danger"
                          title="Delete this alert on Google's side (recoverable via Undo)" onClick={() => runAlertAction(a, "delete")}>
                          {alertBusy[a.id] === "delete" ? "Deleting..." : "Delete"}
                        </ActionButton>
                      </span>
                    )}
                  </span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {subtab === "audit" && (
        <div className="card">
          <h3 className="card-title">Audit log<InfoDot text="Google's own admin/login activity reports (reports.audit.readonly) - a record of what happened in the Admin console and directory, not this portal's Recent device actions." /></h3>
          {auditError ? (
            <p className="empty-note" style={{color:"var(--critical-text)", maxHeight:90, overflowY:"auto"}} title={auditError}>Not authorized yet: {auditError}</p>
          ) : !auditLog ? (
            <p className="empty-note">Loading...</p>
          ) : (
            <div className="scroll-list">

// ReportDataCard: the shell for a report backed by a live Google API call
// that might not be authorized yet - shows loading, an auth-needed message
// with the raw error (so it's obvious what to fix), or the data itself.
function ReportDataCard({ title, icon, loading, error, items, renderItem, emptyText, exportFilename }) {
  const shown = items ? items.slice(0, 3) : [];
  return (
    <div className="report-card">
      <div className="report-card-head"><h4>{title}</h4><ReportIcon type={icon} /></div>
      {error ? (
        <p className="report-card-desc" style={{color:"var(--critical-text)", maxHeight:90, overflowY:"auto"}} title={error}>Not authorized yet: {error}</p>
      ) : loading ? (
        <p className="report-card-desc">Loading...</p>
      ) : shown.length === 0 ? (
        <p className="report-card-desc">{emptyText}</p>
      ) : (
        <div style={{flex:1}}>
          {shown.map(renderItem)}
          {items.length > shown.length && <p className="empty-note" style={{marginTop:6}}>+{items.length - shown.length} more</p>}
        </div>
      )}
      {exportFilename && items?.length > 0 && (
        <div className="report-card-foot"><ExportButton rows={items} filename={exportFilename} /></div>
      )}
    </div>
  );
}

// Reports tab. The first three cards are built entirely from data already
// pulled via the Directory API - no new Google access needed. The next
// four call the separate Chrome Management API (chrome.management.reports.readonly)
// - a new scope that needs to be added to domain-wide delegation in Admin
// console before these will return data instead of an auth error. Legacy
// Technology Report has no public API at all, so it stays locked.
// toCSV/downloadCSV: plain client-side export, no backend round-trip -
// every report on this tab is already fetched into the browser's own
// state, so there's no new data to request, just a different serialization
// of what's already here. Values are quoted and internal quotes doubled
// per RFC 4180, so commas/quotes in device names or app titles don't
// corrupt the column structure.
function toCSV(rows) {
  if (!rows || rows.length === 0) return "";
  const headers = Object.keys(rows[0]);
  const escape = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [headers.map(escape).join(",")];
  rows.forEach(row => lines.push(headers.map(h => escape(row[h])).join(",")));
  return lines.join("\r\n");
}
function downloadCSV(filename, rows) {
  const csv = toCSV(rows);
  if (!csv) return;
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function ExportButton({ label, rows, filename }) {
  return (
    <button disabled={!rows || rows.length === 0} title={rows && rows.length > 0 ? "" : "No data to export"}
      style={{fontSize:12, padding:"4px 10px"}} onClick={() => downloadCSV(filename, rows)}>
      {label || "Export CSV"}
    </button>
  );
}

function DeviceDashboard({ status, refreshStatus, role, jumpToTab, onJumpConsumed, onViewActivity, onActionResult }) {
  const canOperate = role === "operator" || role === "admin"; // sync, restart
  const isAdmin = role === "admin"; // wipe, disconnect, settings writes
  const [tab, setTab] = useState("devices");
  // Once a tab has been visited, its panel stays mounted (just hidden via
  // CSS) instead of being unmounted on tab switch - confirmed live that
  // unmounting was destroying each panel's already-fetched data (alerts,
  // audit log, policies, admin roles, etc), forcing a full re-fetch of
  // several slow sequential API calls every time you switched back to a
  // tab you'd already visited. First visit still fetches lazily; every
  // visit after that is instant.
  // Every tab starts "visited" (mounted) as soon as this dashboard itself
  // mounts - which only happens once already connected - instead of only
  // the first tab a user actually clicks. Each panel's own fetch-on-mount
  // effect is untouched; this just means that effect fires right after
  // connecting instead of waiting for a click, so by the time someone
  // switches to e.g. Security the data's likely already loaded instead of
  // showing "Loading..." there for the first time. Panels stay mounted
  // (hidden via CSS) after that exactly as before.
  const [visitedTabs, setVisitedTabs] = useState({
    devices: true, insights: true, activity: true, directory: true,
    reports: true, enrollment: true, security: true, settings: true,
  });
  const goToTab = (t) => { setTab(t); setVisitedTabs(v => v[t] ? v : { ...v, [t]: true }); };

  // jumpToTab: set by the header bell (in App(), outside this component) to
  // request a tab switch from outside - e.g. tapping the bell should land
  // on Activity regardless of whichever tab is currently open here. Consumed
  // once and cleared via onJumpConsumed so it doesn't keep re-firing.
  useEffect(() => {
    if (jumpToTab) {
      goToTab(jumpToTab);
      if (onJumpConsumed) onJumpConsumed();
    }
  }, [jumpToTab]);

  // Tells App() the user is actually looking at Activity right now (not
  // just that it's mounted in the background, which happens for every tab
  // as soon as this dashboard connects) - that's the real "read" signal the
  // header bell's unread count should clear on.
  useEffect(() => {
    if (tab === "activity" && onViewActivity) onViewActivity();
  }, [tab]);
  const [devices, setDevices] = useState([]);
  const [insights, setInsights] = useState(null);
  const [expandedDeviceId, setExpandedDeviceId] = useState(null);
  const [telemetry, setTelemetry] = useState({}); // deviceId -> {data} | {error} | {loading}
  // insightFilter: when set from a MetricCard "View all" click, the Devices
  // table narrows to only the devices in that insight card. Cleared by the
  // banner's "Clear filter" button or by navigating away from Devices tab.
  const [insightFilter, setInsightFilter] = useState(null); // {label, ids: Set}

  // Telemetry is a separate, newer API (Chrome Management Telemetry) from
  // the device list - fetched only once per device, only when its detail
  // panel is actually expanded, not for every row on every load.
  useEffect(() => {
    if (!expandedDeviceId || telemetry[expandedDeviceId]) return;
    setTelemetry(t => ({ ...t, [expandedDeviceId]: { loading: true } }));
    apiFetch(`${API}/devices/telemetry?id=${expandedDeviceId}`)
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
      .then(data => setTelemetry(t => ({ ...t, [expandedDeviceId]: { data } })))
      .catch(e => setTelemetry(t => ({ ...t, [expandedDeviceId]: { error: e.message } })));
  }, [expandedDeviceId]);
  const [actionState, setActionState] = useState({}); // deviceId -> {action, status: pending|complete|error, error}
  const [showConnInfo, setShowConnInfo] = useState(false); // toggles the "Connection details" panel (Client ID, Customer ID, scopes, etc.)
  const [appCatalog, setAppCatalog] = useState({}); // appId -> {displayName, appType, appSource, homepageUri} - see the chrome-reports fetch below

  // Bulk org-unit move: select N devices, move them all in one API call
  // (Chromeosdevices.MoveDevicesToOu) instead of moving each one at a time
  // from its own detail panel - the batch-move endpoint this backs.
  const [selectedIds, setSelectedIds] = useState(() => new Set());
  const [bulkOrgUnit, setBulkOrgUnit] = useState("");
  const [bulkMoveState, setBulkMoveState] = useState(null); // {status: pending|complete|error, error}
  const toggleSelected = (id) => setSelectedIds(prev => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });
  const toggleSelectAll = () => setSelectedIds(prev => prev.size === devices.length ? new Set() : new Set(devices.map(d => d.id)));
  const submitBulkMove = async (e) => {
    e.preventDefault();
    setBulkMoveState({ status: "pending" });
    try {
      const res = await apiFetch(`${API}/devices/batch-move`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ids: [...selectedIds], orgUnit: bulkOrgUnit }),
      });
      if (!res.ok) throw new Error(await res.text());
      setDevices(ds => ds.map(d => selectedIds.has(d.id) ? { ...d, orgUnit: bulkOrgUnit } : d));
      setBulkMoveState({ status: "complete" });
      setSelectedIds(new Set());
      setBulkOrgUnit("");
    } catch (err) {
      setBulkMoveState({ status: "error", error: err.message || "Move failed" });
    }
  };
  const [disconnecting, setDisconnecting] = useState(false);
  const [syncing, setSyncing] = useState(false);
  const [intervalMinutes, setIntervalMinutes] = useState(15);
  const [intervalChoice, setIntervalChoice] = useState(15);
  const [customMinutes, setCustomMinutes] = useState("");

  const disconnect = async () => {
    setDisconnecting(true);
    await apiFetch(`${API}/disconnect`, { method: "POST" });
    setDisconnecting(false);
    refreshStatus();
  };

  const loadDevices = () => apiFetch(`${API}/devices`).then(r => r.json()).then(setDevices);
  const loadInsights = () => apiFetch(`${API}/insights`).then(r => r.json()).then(setInsights);

  const syncNow = async () => {
    setSyncing(true);
    await apiFetch(`${API}/sync`, { method: "POST" });
    await loadDevices();
    await loadInsights();
    refreshStatus();
    setSyncing(false);
  };

  const loadSyncSettings = () =>
    apiFetch(`${API}/sync/settings`).then(r => r.json()).then(s => {
      setIntervalMinutes(s.intervalMinutes);
      setIntervalChoice(SYNC_PRESETS.includes(s.intervalMinutes) ? s.intervalMinutes : "custom");
      if (!SYNC_PRESETS.includes(s.intervalMinutes)) setCustomMinutes(String(s.intervalMinutes));
    });

  const applyInterval = async (minutes) => {
    if (!minutes || minutes <= 0) return;
    await apiFetch(`${API}/sync/settings`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ intervalMinutes: minutes }),
    });
    setIntervalMinutes(minutes);
  };

  const onIntervalChoiceChange = (e) => {
    const value = e.target.value;
    setIntervalChoice(value === "custom" ? "custom" : Number(value));
    if (value !== "custom") applyInterval(Number(value));
  };

  const onCustomMinutesSubmit = (e) => {
    e.preventDefault();
    applyInterval(Number(customMinutes));
  };

  useEffect(() => {
    loadDevices();
    loadInsights();
    loadSyncSettings();
    // Fetched once, shared by every device's Apps tab below - resolves the
    // raw extension-ID/package-name strings device-level telemetry reports
    // (e.g. "mgndgikekgjfcpckkfioiadnlibdjbkf") into the friendly names
    // Admin console shows, by matching against the fleet-wide installed-apps
    // report (chrome.management.reports.readonly), which is the one Chrome
    // Management endpoint that actually carries a name for each app ID.
    apiFetch(`${API}/chrome-reports`).then(r => r.ok ? r.json() : null).then(data => {
      if (!data) return;
      const catalog = {};
      [...(data.installedApps || []), ...(data.androidApps || [])].forEach(a => { catalog[a.appId] = a; });
      setAppCatalog(catalog);
    }).catch(() => {});
    const t = setInterval(loadDevices, 3000);
    const ti = setInterval(loadInsights, 4000);
    return () => { clearInterval(t); clearInterval(ti); };
  }, []);

  // runAction resolves with the action's final {status, error, result} once
  // it completes (not just once the initial POST is accepted) - needed so
  // runDeprovision below can wait for deprovision to actually finish before
  // deciding whether to also fire a factory reset.
  const runAction = (deviceId, action, payload) => {
    setActionState(s => ({ ...s, [deviceId]: { action, status: "pending" } }));
    return (async () => {
      const res = await apiFetch(`${API}/devices/action?id=${deviceId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, payload }),
      });
      if (!res.ok) {
        const errText = await res.text();
        const failed = { action, status: "error", error: errText || "Failed" };
        setActionState(s => ({ ...s, [deviceId]: failed }));
        if (onActionResult) onActionResult();
        return failed;
      }
      const act = await res.json();
      return new Promise(resolve => {
        const check = async () => {
          const r = await apiFetch(`${API}/actions?id=${act.id}`);
          const a = await r.json();
          if (a.status === "complete" || a.status === "error") {
            const done = { action, status: a.status, error: a.error, result: a.result };
            setActionState(s => ({ ...s, [deviceId]: done }));
            if (onActionResult) onActionResult();
            resolve(done);
          } else {
            setTimeout(check, 500);
          }
        };
        check();
      });
    })();
  };

  const runDeployTracker = async (deviceId, orgUnitPath) => {
    setActionState(s => ({ ...s, [deviceId]: { action: "deploy_tracker", status: "pending" } }));
    const payload = {
      orgUnitPath: orgUnitPath || "/",
      schemaName: "chrome.users.appsAndExtensions",
      value: {
        "appsAndExtensions": {
          "your_location_extension_id": {
            "installationType": "FORCE_INSTALLED",
            "updateUrl": "https://clients2.google.com/service/update2/crx"
          }
        }
      }
    };
    const res = await apiFetch(`${API}/policies/set`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const errText = await res.text();
      const failed = { action: "deploy_tracker", status: "error", error: errText || "Failed" };
      setActionState(s => ({ ...s, [deviceId]: failed }));
      return failed;
    }
    const done = { action: "deploy_tracker", status: "complete", result: "Extension force-installed to " + (orgUnitPath || "/") };
    setActionState(s => ({ ...s, [deviceId]: done }));
    if (onActionResult) onActionResult();
    return done;
  };

  // runDeprovision matches Admin console's own deprovision dialog, which
  // defaults to bundling a factory reset with the deprovision (confirmed
  // against the real dialog - "Yes, Factory Reset" is its pre-selected
  // option) - our two actions already exist separately (deprovision via
  // BatchChangeStatus, powerwash via issueCommand), so this just sequences
  // them the same way instead of leaving deprovision as status-only, which
  // looked like "nothing happened" on the device itself even though the
  // server-side status genuinely had changed.
  const runDeprovision = async (deviceId, alsoFactoryReset) => {
    const result = await runAction(deviceId, "deprovision");
    if (alsoFactoryReset && result.status !== "error") {
      await runAction(deviceId, "powerwash");
    }
  };

  // runDisable matches Admin console's own Disable dialog, which offers the
  // same choice: "Disable With Lock Screen" (device stays enrolled, just
  // locked - the default) or "Disable With Factory Reset" (also wipes it).
  // Disable itself is always the same BatchChangeStatus call either way;
  // the factory-reset option just additionally sequences a powerwash after,
  // same pattern as runDeprovision above.
  const runDisable = async (deviceId, alsoFactoryReset) => {
    const result = await runAction(deviceId, "disable");
    if (alsoFactoryReset && result.status !== "error") {
      await runAction(deviceId, "powerwash");
    }
  };

  return (
    <div>
      <div className="card" style={{display:"flex", alignItems:"center", gap:12}}>
        <div style={{flex:1}}>
          <p style={{fontWeight:500, margin:"0 0 2px", display:"flex", alignItems:"center", gap:6}}>
            ChromeOS connector
            <button onClick={() => setShowConnInfo(v => !v)} title="Connection details"
              style={{display:"inline-flex", alignItems:"center", justifyContent:"center", width:16, height:16, borderRadius:"50%", padding:0, border:"none", background:"var(--border)", color:"var(--text-muted)", fontSize:10, fontStyle:"italic", fontFamily:"Georgia, serif", cursor:"pointer"}}>i</button>
          </p>
          <p style={{fontSize:12, color:"var(--text-muted)", margin:0}}>{status.connectedAccount || "-"} &bull; {status.deviceCount} devices &bull; last sync {status.lastSync ? new Date(status.lastSync).toLocaleTimeString() : "-"}</p>
        </div>
        <span className={`badge ${status.status}`}>{titleCase(status.status)}</span>
        <span style={{fontSize:11, color:"var(--text-faint)"}}>Auto-sync every {intervalMinutes} min</span>

        <ActionButton icon="sync" className="btn-primary" disabled={syncing || !canOperate} title={canOperate ? "Refresh the device list from Google now" : "Requires operator or admin role"} onClick={syncNow}>{syncing ? "Syncing..." : "Sync now"}</ActionButton>
        <ActionButton icon="disconnect" className="btn-danger" disabled={disconnecting || !isAdmin} title={isAdmin ? "Disconnect this portal from Google Workspace" : "Requires admin role"} onClick={disconnect}>{disconnecting ? "Disconnecting..." : "Disconnect"}</ActionButton>
      </div>

      {showConnInfo && (
        <div className="card" style={{marginTop:-4}}>
          <p className="detail-card-title" style={{marginBottom:12}}>Connection details</p>
          <div className="device-detail">
            <Detail label="Client ID">{status.clientId}</Detail>
            <Detail label="Customer ID">{status.customerId}</Detail>
            <Detail label="Connected account">{status.connectedAccount}</Detail>
            <Detail label="Authorized">{status.authorizedAt ? new Date(status.authorizedAt).toLocaleString() : null}</Detail>
            <Detail label="Auto-sync interval">{`${intervalMinutes} min`}</Detail>
            <Detail label="Last sync">{status.lastSync ? new Date(status.lastSync).toLocaleString() : null}</Detail>
          </div>
          {status.scopes?.length > 0 && (
            <>
              <p className="device-detail-label" style={{marginTop:14, marginBottom:6}}>Authorized scopes ({status.scopes.length})</p>
              <p style={{fontSize:11.5, color:"var(--text-muted)", lineHeight:1.6, wordBreak:"break-all", margin:0}}>{status.scopes.join(", ")}</p>
            </>
          )}
          {status.authorizationUrl && (
            <p style={{marginTop:12}}>
              <a href={status.authorizationUrl} target="_blank" rel="noreferrer">Open domain-wide delegation settings in Admin console &rarr;</a>
            </p>
          )}
          <p className="device-detail-label" style={{marginTop:16, marginBottom:6, color:"var(--critical-text)"}}>If you disconnect</p>
          <ul style={{fontSize:12.5, color:"var(--text-muted)", lineHeight:1.7, margin:0, paddingLeft:18}}>
            <li>The portal immediately drops back to the Setup wizard - you lose access to Devices, Fleet insights, Activity, everything, until you reconnect. It doesn't keep showing your last-synced view.</li>
            <li>Every previously-synced device is cleared from this portal's memory right away, not just hidden - that's the first thing disconnecting does.</li>
            <li>Auto-sync stops immediately, and every action that calls Google (Restart, Wipe, Disable, Move, Remote desktop, etc.) becomes unreachable since the dashboard itself is gone.</li>
            <li>Reconnecting requires the full Setup wizard again (re-upload the key, re-authorize in Admin console) - there's no "resume" shortcut, and you'll see an empty device list until the first post-reconnect sync completes.</li>
            <li>Nothing changes on the Google side - devices, policies, and enrollment are untouched. Disconnecting only removes this portal's own view into them, not any real state on your devices.</li>
          </ul>
        </div>
      )}

      <div className="tab-bar">
        <button className={`tab-button ${tab === "devices" ? "active" : ""}`} onClick={() => goToTab("devices")}>Devices</button>
        <button className={`tab-button ${tab === "insights" ? "active" : ""}`} onClick={() => goToTab("insights")}>Fleet insights</button>
        <button className={`tab-button ${tab === "activity" ? "active" : ""}`} onClick={() => goToTab("activity")}>Activity</button>
        <button className={`tab-button ${tab === "directory" ? "active" : ""}`} onClick={() => goToTab("directory")}>Directory</button>
        <button className={`tab-button ${tab === "reports" ? "active" : ""}`} onClick={() => goToTab("reports")}>Reports</button>
        <button className={`tab-button ${tab === "enrollment" ? "active" : ""}`} onClick={() => goToTab("enrollment")}>Enrollment</button>
        <button className={`tab-button ${tab === "security" ? "active" : ""}`} onClick={() => goToTab("security")}>Security</button>
        <button className={`tab-button ${tab === "settings" ? "active" : ""}`} onClick={() => goToTab("settings")}>Settings</button>
      </div>

      {visitedTabs.devices && (
      <div style={{display: tab === "devices" ? "block" : "none"}}>
        {insightFilter && (
          <div style={{display:"flex", alignItems:"center", gap:10, background:"var(--tile-bg)", border:"1px solid var(--primary)", borderRadius:8, padding:"8px 14px", marginBottom:10, fontSize:13}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" strokeWidth="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
            <span style={{flex:1, color:"var(--text)"}}>
              Showing <strong style={{color:"var(--primary)"}}>{insightFilter.ids.size}</strong> device{insightFilter.ids.size === 1 ? "" : "s"} from: <em>{insightFilter.label}</em>
            </span>
            <button onClick={() => setInsightFilter(null)} style={{fontSize:11, padding:"3px 10px", border:"1px solid var(--border)", borderRadius:6, background:"transparent", cursor:"pointer", color:"var(--text-muted)"}}>
              ✕ Clear filter
            </button>
          </div>
        )}
        <div className="card">
          <h3 className="card-title">
            Devices
            <InfoDot text="Status is Google's provisioning state (Active/Disabled/Deprovisioned); Sync status reflects the longer-horizon stale-after threshold (Settings); Connection is the shorter online-after threshold - both are real, just bucketed at different granularities, since Google's API has no live connectivity ping." />
          </h3>

          {isAdmin && selectedIds.size > 0 && (
            <form onSubmit={submitBulkMove} className="detail-card" style={{marginBottom:14, display:"flex", flexWrap:"wrap", alignItems:"center", gap:8}}>
              <span style={{fontSize:13, fontWeight:500}}>{selectedIds.size} device{selectedIds.size === 1 ? "" : "s"} selected</span>
              <input required value={bulkOrgUnit} onChange={e => setBulkOrgUnit(e.target.value)}
                placeholder="/Target org unit" style={{flex:1, minWidth:160, fontSize:12, padding:"5px 8px"}} />
              <ActionButton icon="move" type="submit" className="btn-primary" disabled={bulkMoveState?.status === "pending"} title="Move all selected devices to this organizational unit">
                {bulkMoveState?.status === "pending" ? "Moving..." : "Move selected"}
              </ActionButton>
              <button type="button" onClick={() => { setSelectedIds(new Set()); setBulkMoveState(null); }}>Clear selection</button>
              {bulkMoveState?.status === "error" && (
                <span className="empty-note" style={{color:"var(--critical-text)", flexBasis:"100%"}}>{bulkMoveState.error}</span>
              )}
            </form>
          )}
          {isAdmin && bulkMoveState?.status === "complete" && selectedIds.size === 0 && (
            <p className="empty-note" style={{color:"var(--active-text)", marginBottom:10}}>Moved successfully.</p>
          )}

          <div style={{overflowX:"auto"}}>
          <table>
            <thead>
              <tr>
                {isAdmin && <th><input type="checkbox" checked={devices.length > 0 && selectedIds.size === devices.length} onChange={toggleSelectAll} title="Select all" /></th>}
                <th>Device</th><th>User</th><th>Org unit</th><th>Status</th><th>Sync status</th><th>Connection</th><th>Last seen</th><th>Actions</th><th></th>
              </tr>
            </thead>
            <tbody>
              {(insightFilter ? devices.filter(d => insightFilter.ids.has(d.id)) : devices).map(d => (
                <React.Fragment key={d.id}>
                  <tr>
                    {isAdmin && <td><input type="checkbox" checked={selectedIds.has(d.id)} onChange={() => toggleSelected(d.id)} /></td>}
                    <td>{d.name}</td>
                    <td>{d.user}</td>
                    <td style={{whiteSpace:"nowrap"}}>{d.orgUnit}</td>
                    <td title="Google's own provisioning state - independent of whether the device has synced recently.">
                      <span className={`badge ${provisionStatusMeta(d.provisionStatus).badge}`}>{provisionStatusLabel(d.provisionStatus)}</span>
                    </td>
                    <td title="Derived from Last seen vs. the stale-after threshold in Settings - not real-time connectivity.">
                      {d.stale ? (
                        <span className="badge warning">Stale</span>
                      ) : (
                        <span className="badge active">Active</span>
                      )}
                    </td>
                    <td title={`Last synced ${timeAgo(d.lastSeen)}, against the online-after threshold in Settings - Google's API has no live connectivity ping, so this is the most real signal available.${d.connectionState ? ` Last reported network state (may be stale if currently offline): ${d.connectionState}.` : ""}`}>
                      {d.online ? (
                        <span className="badge active">Online</span>
                      ) : (
                        <span className="badge disconnected">Offline</span>
                      )}
                    </td>
                    <td style={{whiteSpace:"nowrap"}}>{new Date(d.lastSeen).toLocaleString()}</td>
                    <td style={{whiteSpace:"nowrap"}}>
                      {actionState[d.id]?.status === "pending" ? (
                        <span style={{fontSize:12, color:"var(--primary)"}}>{actionDisplayName(actionState[d.id].action)}ing...</span>
                      ) : (
                        <div className="actions-cell">
                          <ActionButton icon="restart" disabled={!canOperate} title={canOperate ? "Restart this device" : "Requires operator or admin role"} onClick={() => runAction(d.id, "restart")} />
                          <ActionButton icon="lock" disabled={!isAdmin} title={isAdmin ? "Force this device to log out and require re-login (clears local user data - not a full factory reset)" : "Requires admin role"} onClick={() => runAction(d.id, "wipe")} />
                          {d.provisionStatus === "DISABLED" ? (
                            <ActionButton icon="enable" disabled={!isAdmin} title={isAdmin ? "Restore this device to active management" : "Requires admin role"} onClick={() => runAction(d.id, "enable")} />
                          ) : (
                            <ActionButton icon="disable" disabled={!isAdmin} title={isAdmin ? "Temporarily block this device from checking in" : "Requires admin role"} onClick={() => runAction(d.id, "disable")} />
                          )}
                          <ActionButton
                             icon="location"
                             title={d.trackedLocationLat ? "View live location for this device" : "No location reported yet - click to open Location tab"}
                             onClick={() => { setExpandedDeviceId(d.id); setTimeout(() => { document.querySelectorAll('.subtab-button').forEach(b => { if (b.textContent === 'Location') b.click(); }); }, 100); }}
                           />
                        </div>
                      )}
                    </td>
                    <td>
                      <ActionButton icon={expandedDeviceId === d.id ? "hide" : "details"} title={expandedDeviceId === d.id ? "Collapse device details" : "View full device details"} onClick={() => setExpandedDeviceId(expandedDeviceId === d.id ? null : d.id)} />
                    </td>
                  </tr>
                  {expandedDeviceId === d.id && (() => {
                    const tele = telemetry[d.id] || {};
                    // Prefer live telemetry byte counts (Chrome Management Telemetry API -
                    // confirmed live to be the reliable source; the Directory API's own
                    // DiskVolumeReports frequently comes back empty for the same device)
                    // and fall back to the Directory-API-sourced fields only if telemetry
                    // itself has nothing.
                    const storageTotal = tele.data?.storageTotalBytes || d.storageTotalBytes;
                    const storageUsed = tele.data?.storageTotalBytes
                      ? tele.data.storageTotalBytes - tele.data.storageAvailableBytes
                      : (d.storageTotalBytes ? d.storageTotalBytes - d.storageFreeBytes : 0);
                    const memTotal = tele.data?.memoryTotalBytes || d.ramTotalBytes;
                    const memUsed = tele.data?.memoryTotalBytes
                      ? tele.data.memoryTotalBytes - tele.data.memoryAvailableBytes
                      : (d.ramTotalBytes ? d.ramTotalBytes - d.ramFreeBytes : 0);
                    return (
                    <tr>
                      <td colSpan={isAdmin ? 10 : 9} style={{background:"var(--tile-bg)"}}>
                        <div style={{padding:"8px 4px"}}>
                          <DeviceDetailTabs
                            device={d} tele={tele}
                            storageTotal={storageTotal} storageUsed={storageUsed}
                            memTotal={memTotal} memUsed={memUsed}
                            canOperate={canOperate} isAdmin={isAdmin} runAction={runAction} runDeprovision={runDeprovision} runDisable={runDisable} runDeployTracker={runDeployTracker} actionState={actionState}
                            appCatalog={appCatalog}
                            refreshDevices={loadDevices}
                          />
                        </div>
                      </td>
                    </tr>
                    );
                  })()}
                </React.Fragment>
              ))}
            </tbody>
          </table>
          </div>
        </div>
        <MobileDevicesPanel />
      </div>
      )}

      {visitedTabs.insights && (
        <div style={{display: tab === "insights" ? "block" : "none"}}>
          {insights ? <FleetHealthPanel insights={insights} devices={devices} onViewAll={(label, items) => {
            setInsightFilter({ label, ids: new Set(items.map(d => d.id)) });
            goToTab("devices");
          }} /> : <InsightsSkeleton />}
        </div>
      )}
      {visitedTabs.activity && insights && (
        <div style={{display: tab === "activity" ? "block" : "none"}}>
          <ActivityPanel insights={insights} />
          <DeviceEventsCard />
        </div>
      )}
      {visitedTabs.directory && (
        <div style={{display: tab === "directory" ? "block" : "none"}}>
          <DirectoryPanel />
        </div>
      )}
      {visitedTabs.reports && insights && (
        <div style={{display: tab === "reports" ? "block" : "none"}}>
          <ReportsPanel insights={insights} devices={devices} setTab={goToTab} />
        </div>
      )}
      {visitedTabs.enrollment && (
        <div style={{display: tab === "enrollment" ? "block" : "none"}}>
          <EnrollmentPanel />
        </div>
      )}
      {visitedTabs.security && (
        <div style={{display: tab === "security" ? "block" : "none"}}>
          <SecurityPanel isAdmin={isAdmin} />
        </div>
      )}
      {visitedTabs.settings && (
        <div style={{display: tab === "settings" ? "block" : "none"}}>
          <SettingsPanel
            intervalMinutes={intervalMinutes}
            intervalChoice={intervalChoice}
            customMinutes={customMinutes}
            onIntervalChoiceChange={onIntervalChoiceChange}
            onCustomMinutesSubmit={onCustomMinutesSubmit}
            setCustomMinutes={setCustomMinutes}
            isAdmin={isAdmin}
          />
        </div>
      )}
    </div>
  );
}

function App() {
  const [theme, setTheme] = useTheme();
  const [template, setTemplate] = useThemeTemplate(theme);
  const [auth, setAuth] = useAuth();
  const [status, refreshStatus] = useConnectionStatus(!!auth);
  // jumpToTab: how the header bell tells DeviceDashboard (a sibling, not a
  // parent/child of this button) to switch to the Activity tab - see the
  // matching effect inside DeviceDashboard that consumes and clears this.
  const [jumpToTab, setJumpToTab] = useState(null);
  // activityCount: an unread-style badge count, not a running total - only
  // events reported AFTER the last time the Activity tab was actually
  // viewed count (persisted in localStorage so it survives a reload).
  // Reuses the same GET /device-events endpoint the Activity tab itself
  // calls (not a new backend endpoint) - last 24h, polled every minute
  // while connected.
  const [lastViewedActivityAt, setLastViewedActivityAt] = useState(() => Number(localStorage.getItem("lastViewedActivityAt") || 0));
  const [activityCount, setActivityCount] = useState(0);
  useEffect(() => {
    if (!auth || status?.status !== "active") return;
    const load = () => apiFetch(`${API}/device-events?hours=24`)
      .then(r => r.ok ? r.json() : [])
      .then(evts => {
        const unseen = (evts || []).filter(e => new Date(e.reportTime).getTime() > lastViewedActivityAt);
        setActivityCount(unseen.length);
      })
      .catch(() => {});
    load();
    const t = setInterval(load, 60000);
    return () => clearInterval(t);
  }, [auth, status?.status, lastViewedActivityAt]);

  // bumpActivity is called by DeviceDashboard the moment a device action
  // (restart/lock/disable/etc) finishes, success or failure - device
  // actions are a separate feed (DeviceAction history) from the telemetry
  // events device-events polls, so they wouldn't otherwise show up here.
  // This is also why the real "commands still pending" error from a
  // stuck-earlier-command device now surfaces via the bell/Activity tab
  // instead of as long inline text that was forcing the devices table into
  // horizontal scroll.
  const bumpActivity = () => setActivityCount(c => c + 1);

  // markActivityViewed is called by DeviceDashboard the moment the user is
  // actually looking at the Activity tab (not just because every tab is
  // pre-mounted in the background) - see the matching effect there.
  const markActivityViewed = () => {
    const now = Date.now();
    localStorage.setItem("lastViewedActivityAt", String(now));
    setLastViewedActivityAt(now);
    setActivityCount(0);
  };

  if (auth === undefined) return <p>Loading...</p>;
  if (!auth) return <LoginScreen onLoggedIn={setAuth} theme={theme} setTheme={setTheme} template={template} setTemplate={setTemplate} />;
  if (!status) return <p>Loading...</p>;

  const logout = async () => {
    await apiFetch(`${AUTH_API}/logout`, { method: "POST" });
    localStorage.removeItem(TOKEN_KEY);
    setAuth(null);
  };

  return (
    <div>
      <div style={{display:"flex", alignItems:"baseline", justifyContent:"space-between"}}>
        <h2 style={{fontWeight:500, display:"flex", alignItems:"center", gap:10}}>
          <PlatformIcon monochrome={template === "bw"} />
          ChromeOS device management
        </h2>
        <div style={{display:"flex", alignItems:"center", gap:10, fontSize:12, color:"var(--text-muted)"}}>
          <ThemeToggle theme={theme} setTheme={setTheme} template={template} setTemplate={setTemplate} />
          {status.status === "active" && (
            <button onClick={() => setJumpToTab("activity")} title={`${activityCount} recent device event${activityCount === 1 ? "" : "s"} - view Activity`}
              style={{position:"relative", display:"inline-flex", alignItems:"center", padding:"4px 8px"}}>
              <ActionIcon name="bell" />
              {activityCount > 0 && (
                <span style={{position:"absolute", top:-4, right:-4, background:"var(--critical-text)", color:"#fff", borderRadius:"50%", fontSize:10, lineHeight:1, minWidth:16, height:16, display:"flex", alignItems:"center", justifyContent:"center", padding:"0 3px"}}>
                  {activityCount > 99 ? "99+" : activityCount}
                </span>
              )}
            </button>
          )}
          <span>Signed in as <span className={`role-chip ${auth.role}`} title={`Role: ${auth.role}`}>{auth.username}</span></span>
          <button onClick={logout} style={{fontSize:12, padding:"4px 10px"}}>Log out</button>
        </div>
      </div>
      {(status.status === "disconnected" || status.status === "pending" || status.status === "authorized")
        ? (auth.role === "admin"
            ? <SetupWizard onConnected={refreshStatus} />
            : <p className="card empty-note">This portal isn't connected to Google Workspace yet - ask an admin to run the connect wizard.</p>)
        : <DeviceDashboard status={status} refreshStatus={refreshStatus} role={auth.role} jumpToTab={jumpToTab} onJumpConsumed={() => setJumpToTab(null)} onViewActivity={markActivityViewed} onActionResult={bumpActivity} />
      }
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
