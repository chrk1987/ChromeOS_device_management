// ActionButton: thin wrapper around a plain <button> - keeps every existing
// call site's disabled/title/onClick/className logic untouched (title still
// carries the "Requires operator/admin role" message when disabled) and just
// adds the icon + label layout inside.
// ActionButton: icon required, label (children) optional - omit children
// entirely for an icon-only button (e.g. Restart/Wipe/Details in the
// devices table, where the icon alone is already unambiguous and every
// extra label just widens a row that already has several actions on it).
// The tooltip (passed as `title` by every call site) still carries the full
// text either way, so nothing is lost for screen readers/hover.
function ActionButton({ icon, children, ...rest }) {
  return (
    <button {...rest}>
      <span style={{display:"inline-flex", alignItems:"center", gap: children ? 6 : 0}}>
        <ActionIcon name={icon} />
        {children && <span>{children}</span>}
      </span>
    </button>
  );
}

// catalogAppTypeLabel: the fleet-wide installed-apps report (InstalledAppCount)
// uses a different, unprefixed enum (EXTENSION/APP/THEME/HOSTED_APP/ANDROID_APP)
// than the per-device telemetry appsUsage's APPLICATION_TYPE_* enum below -
// two distinct Chrome Management API responses, not a typo.
function catalogAppTypeLabel(appType) {
  const labels = { EXTENSION: "Extension", APP: "Chrome app", THEME: "Theme", HOSTED_APP: "Hosted app", ANDROID_APP: "Android app" };
  return labels[appType] || titleCase((appType || "").toLowerCase().replace(/_/g, " ")) || null;
}
function appTypeLabel(appType) {
  const labels = {
    APPLICATION_TYPE_ARC: "Android app", APPLICATION_TYPE_WEB: "Web",
    APPLICATION_TYPE_CHROME_APP: "Chrome app", APPLICATION_TYPE_EXTENSION: "Extension",
    APPLICATION_TYPE_BUILT_IN: "Built-in", APPLICATION_TYPE_CROSTINI: "Linux",
    APPLICATION_TYPE_SYSTEM_WEB: "System web",
  };
  return labels[appType] || (appType ? titleCase(appType.replace("APPLICATION_TYPE_", "").replace(/_/g, " ").toLowerCase()) : "");
}

// timeAgo: turns a timestamp into "3h 12m ago" - used in the Connection
// column's tooltip so the badge's underlying real data (exactly how long
// since this device's last sync) is one hover away, not hidden behind a
// computed Online/Offline label.
function timeAgo(date) {
  const ms = Date.now() - new Date(date).getTime();
  const mins = Math.floor(ms / 60000);
  if (mins < 1) return "just now";
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return h > 0 ? `${h}h ${m}m ago` : `${m}m ago`;
}

function formatDuration(seconds) {
  if (!seconds) return "0s";
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m`;
  return `${s}s`;
}

// provisionStatusLabel maps the raw Directory API status value to the
// vocabulary Admin console's own Status filter uses (confirmed against its
// filter dialog: All/Provisioned/Pre-provisioned/Deprovisioned/Disabled/
// Suspended) - "Active" is this app's own word for it, not Google's.
// PROVISION_STATUS_META covers every real value Google's ChromeOsDevice.status
// field can return (confirmed against the API reference - previously this
// app only recognized ACTIVE/DISABLED/DEPROVISIONED, silently mis-badging
// the other 7 as "active" and dropping them from the Provisioning status
// donut entirely, since it only ever read those 3 specific keys out of the
// counts map).
const PROVISION_STATUS_META = {
  ACTIVE: { label: "Provisioned", badge: "active", color: "var(--active-text)" },
  DISABLED: { label: "Disabled", badge: "critical", color: "var(--pending-text)" },
  DEPROVISIONED: { label: "Deprovisioned", badge: "disconnected", color: "#a8a6a0" },
  DELINQUENT: { label: "Delinquent (license expired)", badge: "critical", color: "var(--critical-text)" },
  PRE_PROVISIONED: { label: "Pre-provisioned (ZTE)", badge: "syncing", color: "var(--primary)" },
  INACTIVE: { label: "Inactive", badge: "disconnected", color: "#a8a6a0" },
  RETURN_ARRIVED: { label: "Return arrived", badge: "warning", color: "var(--pending-text)" },
  RETURN_REQUESTED: { label: "Return requested", badge: "warning", color: "var(--pending-text)" },
  SHIPPED: { label: "Shipped", badge: "disconnected", color: "#a8a6a0" },
  UNKNOWN: { label: "Unknown", badge: "disconnected", color: "#a8a6a0" },
};
function provisionStatusMeta(status) {
  return PROVISION_STATUS_META[status] || { label: titleCase((status || "unknown").toLowerCase()), badge: "disconnected", color: "#a8a6a0" };
}
function provisionStatusLabel(status) {
  return provisionStatusMeta(status).label;
}

function aueBadge(daysRemaining) {
  return daysRemaining <= 30 ? "critical" : "warning";
}

function storageBadge(percentFree) {
  return percentFree < 5 ? "critical" : "warning";
}

function ramBadge(percentFree) {
  return percentFree < 7.5 ? "critical" : "warning";
}

// Fixed hue order for categorical distributions - never reassigned by rank,
// so the same OS version keeps the same color across refreshes. A 6th+
// category folds into a shared neutral "Other" bucket rather than cycling.
const CATEGORICAL_COLORS = ["var(--primary)", "#6b7b3f", "#8a4f7d", "#b5651d", "#4f7c82"];
const OTHER_COLOR = "#a8a6a0";

function toSegments(distribution) {
  const entries = Object.entries(distribution).sort((a, b) => b[1] - a[1]);
  const top = entries.slice(0, 5).map(([label, value], i) => ({ label, value, color: CATEGORICAL_COLORS[i] }));
  const rest = entries.slice(5);
  if (rest.length) {
    top.push({ label: `Other (${rest.length})`, value: rest.reduce((s, [, v]) => s + v, 0), color: OTHER_COLOR });
  }
  return top;
}

// Donut: a proportion chart for a small, fixed set of whole-fleet states
// (active/offline, reporting/not-reporting) - never used for open-ended
// categorical breakdowns, which use SegmentedBar instead.
function Donut({ segments, size = 72, strokeWidth = 12 }) {
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  const radius = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * radius;
  const [pulseIdx, setPulseIdx] = useState(null);
  let offsetAcc = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} role="img"
      aria-label={segments.map(s => `${s.label}: ${s.value}`).join(", ")}>
      <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke="var(--hover-bg)" strokeWidth={strokeWidth} />
      {segments.map((s, i) => {
        const dash = (s.value / total) * circumference;
        const el = (
          <circle key={i} className={`donut-arc ${pulseIdx === i ? "chart-pulse" : ""}`} cx={size / 2} cy={size / 2} r={radius} fill="none"
            stroke={s.color} strokeWidth={strokeWidth}
            strokeDasharray={`${dash} ${circumference - dash}`}
            strokeDashoffset={-offsetAcc}
            transform={`rotate(-90 ${size / 2} ${size / 2})`}
            onClick={() => setPulseIdx(i)}
            onAnimationEnd={() => setPulseIdx(cur => cur === i ? null : cur)}>
            <title>{s.label}: {s.value}</title>
          </circle>
        );
        offsetAcc += dash;
        return el;
      })}
    </svg>
  );
}

// FunLoader: a small bouncing/blinking mascot for the handful of spots that
// genuinely make someone wait (connect wizard upload/authorize/finish, first
// app load) - meant to make an unavoidable wait feel less like a stall.
// Deliberately NOT used for the many sub-second per-tab "Loading..." spots
// elsewhere - a bouncing character on every tab click would be noise, not
// delight. Pass a fixed `label` for a step where the exact wording matters
// (e.g. mid credentials upload); omit it to cycle the built-in one-liners.
const FUN_LOADER_MESSAGES = [
  "Waking up the fleet...", "Untangling cables...", "Counting Chromebooks...",
  "Polishing pixels...", "Convincing Google to talk to us...", "Herding devices into a row...",
  "Reticulating splines...", "Feeding the sync hamster...", "Buffing the bezels...",
  "Asking nicely for permission...",
];
// Boot-loading tips - only shown via showTip (the two full-page load
// screens, the only waits long enough to actually read one). Each names a
// real feature already in this portal, not generic filler - the point is
// to teach the admin something true, not pad the screen.
const FUN_LOADER_TIPS = [
  "Tip: Bulk-select devices in the Devices tab to move several into a new org unit at once.",
  "Tip: Fleet insights → Warnings & security flags low disk, low RAM, hot CPUs, and outdated TPM firmware automatically.",
  "Tip: Fleet insights → Device events graphs USB, network, and app-install activity across the whole fleet - not just per device.",
  "Tip: A device's Actions tab can start a Chrome Remote Desktop session for remote support.",
  "Tip: Deploy the Location Tracker extension from a device's Actions tab to get live GPS pings.",
  "Tip: Auto-sync interval is configurable in Settings - Sync now in the header always runs immediately regardless.",
  "Tip: Any Distributions card (OS version, model, firmware...) can be exported to CSV from its export button.",
  "Tip: Fleet insights has an Auto-cycle tabs mode - handy for a wall-mounted status dashboard.",
  "Tip: Chrome Extended Updates can push a device's support window past its standard Auto Update Expiration date.",
  "Tip: A device in Developer mode bypasses verified boot - worth investigating if you didn't expect it.",
  "Tip: The Policy editor under Enrollment can set org-unit policies directly, without opening Admin console.",
  "Tip: Each device's Events tab shows just that device's own history from the Chrome Management Telemetry stream.",
];
// DelayedLoader: renders nothing until `delay` ms have passed, then renders
// its children - a flicker guard, not an artificial slowdown. A fast load
// (local backend, warm connection) never shows anything at all; only a
// genuinely slow one (cold start, real network round trip) lives long
// enough to cross the threshold and show the mascot/tip. The timer is
// cancelled on unmount, which happens automatically the moment the parent's
// loading condition clears and stops rendering this.
function DelayedLoader({ delay = 350, children }) {
  const [show, setShow] = useState(false);
  useEffect(() => {
    const t = setTimeout(() => setShow(true), delay);
    return () => clearTimeout(t);
  }, [delay]);
  return show ? children : null;
}

function FunLoader({ label, size, compact = false, showTip = false }) {
  const resolvedSize = size || (compact ? 34 : 60);
  const [msgIndex, setMsgIndex] = useState(() => Math.floor(Math.random() * FUN_LOADER_MESSAGES.length));
  const [tipIndex, setTipIndex] = useState(() => Math.floor(Math.random() * FUN_LOADER_TIPS.length));
  useEffect(() => {
    if (label) return; // fixed label - no need to cycle
    const t = setInterval(() => setMsgIndex(i => (i + 1) % FUN_LOADER_MESSAGES.length), 1800);
    return () => clearInterval(t);
  }, [label]);
  useEffect(() => {
    if (!showTip) return;
    const t = setInterval(() => setTipIndex(i => (i + 1) % FUN_LOADER_TIPS.length), 7000);
    return () => clearInterval(t);
  }, [showTip]);
  return (
    <div className={`fun-loader ${compact ? "compact" : ""}`}>
      <div className="fun-loader-bot-wrap">
        <svg className="fun-loader-bot" width={resolvedSize} height={resolvedSize} viewBox="0 0 64 64" role="img" aria-label="Loading">
          <rect x="8" y="12" width="48" height="34" rx="9" fill="var(--tile-bg)" stroke="var(--primary)" strokeWidth="2" />
          <circle className="fun-loader-eye" cx="23" cy="29" r="4" fill="var(--primary)" />
          <circle className="fun-loader-eye" cx="41" cy="29" r="4" fill="var(--primary)" />
          <path d="M23 38 Q32 44 41 38" fill="none" stroke="var(--primary)" strokeWidth="2.5" strokeLinecap="round" />
          <rect x="2" y="48" width="60" height="8" rx="4" fill="var(--border)" />
        </svg>
        <div className="fun-loader-shadow" />
      </div>
      <p className="fun-loader-caption">{label || FUN_LOADER_MESSAGES[msgIndex]}</p>
      {!compact && <div className="fun-loader-bar"><div className="fun-loader-bar-fill" /></div>}
      {showTip && <p className="fun-loader-tip">{FUN_LOADER_TIPS[tipIndex]}</p>}
    </div>
  );
}

function InfoDot({ text }) {

function DonutWithLegend({ title, segments, info }) {

function SegmentedBar({ segments }) {
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  const [pulseIdx, setPulseIdx] = useState(null);
  return (
    <div className="segbar">
      {segments.map((s, i) => (
        <div key={i} className={pulseIdx === i ? "chart-pulse" : ""} title={`${s.label}: ${s.value}`}
          style={{width: `${(s.value / total) * 100}%`, background: s.color}}
          onClick={() => setPulseIdx(i)}
          onAnimationEnd={() => setPulseIdx(cur => cur === i ? null : cur)} />
      ))}
    </div>
  );
}

// StorageBar: a used/free proportion bar for one device's disk, styled like
// SegmentedBar (thin, rounded, bordered) rather than a fabricated "empty"
// state - shows nothing but a plain note if the telemetry byte counts
// aren't available, instead of drawing a misleading full/empty bar.
function StorageBar({ usedBytes, totalBytes }) {
  if (!totalBytes || !Number.isFinite(usedBytes)) return <p className="empty-note">Not reported.</p>;
  const usedPercent = Math.round((usedBytes / totalBytes) * 100);
  const gb = 1e9;
  return (
    <div>
      <div className="segbar thin" style={{marginBottom:4}}>
        <div title={`Used: ${(usedBytes / gb).toFixed(1)} GB`} style={{width: `${usedPercent}%`, background: "var(--primary)"}} />
        <div title={`Free: ${((totalBytes - usedBytes) / gb).toFixed(1)} GB`} style={{width: `${100 - usedPercent}%`, background: "var(--border)"}} />
      </div>
      <span style={{fontSize:11, color:"var(--text-muted)"}}>{usedPercent}% used &bull; {(usedBytes / gb).toFixed(1)} / {(totalBytes / gb).toFixed(1)} GB</span>
    </div>
  );
}

// BatteryBar: same thin segmented-bar visual language as StorageBar, but for
// a single charge percentage rather than a used/free split - color reflects
// charge level (low/mid/healthy) the same way storage/memory warning
// thresholds elsewhere in this app use color to flag a state, not just
// decorate a number.
function BatteryBar({ chargePct, status }) {
  if (chargePct == null) return <p className="empty-note">Not reported.</p>;
  const pct = Math.max(0, Math.min(100, chargePct));
  const color = pct <= 15 ? "var(--critical-text)" : pct <= 35 ? "var(--pending-text)" : "var(--active-text)";
  const charging = /charg/i.test(status || "") && !/discharg/i.test(status || "");
  return (
    <div>
      <div className="segbar thin" style={{marginBottom:4}}>
        <div title={`${pct}% charged`} style={{width: `${pct}%`, background: color}} />
        <div title={`${100 - pct}% remaining to full`} style={{width: `${100 - pct}%`, background: "var(--border)"}} />
      </div>
      <span style={{fontSize:11, color:"var(--text-muted)"}}>{pct}% {charging ? "· charging" : status ? `· ${status.toLowerCase()}` : ""}</span>
    </div>
  );
}

// TrendBars: a small vertical bar chart for month-over-month counts

// TrendBars: stacked by ChromeOS type (native ChromeOS vs Flex, on

function TrendBars({ points }) {
  const max = Math.max(1, ...points.map(p => p.count));

        {points.map(p => (

          </div>

    </div>
  );
}

// CountTrendBars: single-series day-over-day bar chart (event counts,
// occurrences, etc) - same visual language as TrendBars above, just without
// the ChromeOS/Flex stacking split since a generic count series has no
// sub-category to stack.
function CountTrendBars({ points, color = "var(--primary)" }) {

            onClick={() => setPulseKey(p.key)}
            onAnimationEnd={() => setPulseKey(cur => cur === p.key ? null : cur)} />
          <span style={{fontSize:10, color:"var(--text-faint)", marginTop:4, whiteSpace:"nowrap"}}>{p.label}</span>
        </div>
      ))}
    </div>
  );
}

function DistributionCard({ title, distribution, info, exportRows, exportFilename }) {
  const segments = toSegments(distribution);
  return (
    <div className="metric-card">
      <div className="metric-card-head" style={{marginBottom:8}}>
        <span className="metric-card-title">{title}</span>
        {info && <span className="info-dot" title={info}>i</span>}
        {exportRows && <ExportButton rows={exportRows} filename={exportFilename} />}
      </div>
      {segments.length === 0 ? <p className="empty-note">No data yet.</p> : (
        <>
          <SegmentedBar segments={segments} />
          <div className="segbar-legend">
            {segments.map(s => (
              <span className="segbar-legend-item" key={s.label}>
                <span className="swatch-sq" style={{background:s.color}} />
                {s.label} ({s.value})
              </span>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// EnrollmentSparklineCard: Halofort-only compact stand-in for the full-width
// TrendBars enrollment chart - sized to match the other DistributionCards
// in the same grid (same .metric-card shell) instead of a wide bar chart,
// since it now sits in that grid next to Location rather than its own
// full-width row. A stacked mini area chart (not a plain line) so the
// Chrome OS vs Flex split from the original chart isn't lost, plus a
// visible count label per month instead of only a hover tooltip - both
// were flagged as missing when this was a single-color line.
function EnrollmentSparklineCard({ points }) {
  const allZero = points.every(p => p.count === 0);
  const max = Math.max(1, ...points.map(p => p.count));
  const w = 220, h = 64, pad = 6, labelSpace = 14;
  const chartTop = pad + labelSpace, chartBottom = h - pad, chartH = chartBottom - chartTop;
  const stepX = points.length > 1 ? (w - pad * 2) / (points.length - 1) : 0;
  const xs = points.map((_, i) => pad + i * stepX);
  // Minimum visible height for any non-zero month - without this, a single
  // big outlier month (e.g. a bulk enrollment of 100+ devices) scales every
  // other month down to a barely-visible sliver even though they're not
  // actually zero. The Chrome OS/Flex split within that floored height
  // still reflects the real ratio - only the total bar's minimum size is
  // guaranteed, the color split isn't independently floored.
  const MIN_BAR_HEIGHT = 6;
  const totalHeights = points.map(p => p.count === 0 ? 0 : Math.max(MIN_BAR_HEIGHT, (p.count / max) * chartH));
  const totalYs = totalHeights.map(hgt => chartBottom - hgt);
  const chromeOsTopYs = points.map((p, i) => {
    const ratio = p.count > 0 ? p.chromeOsCount / p.count : 0;
    return chartBottom - totalHeights[i] * ratio;
  });

  const chromeOsAreaPath = `M ${xs[0]},${chartBottom} ` +
    xs.map((x, i) => `L ${x},${chromeOsTopYs[i]}`).join(" ") +
    ` L ${xs[xs.length - 1]},${chartBottom} Z`;
  const flexAreaPath = `M ${xs[0]},${chromeOsTopYs[0]} ` +
    xs.map((x, i) => `L ${x},${totalYs[i]}`).join(" ") +
    " " + xs.slice().reverse().map((x, ri) => { const i = xs.length - 1 - ri; return `L ${x},${chromeOsTopYs[i]}`; }).join(" ") +
    " Z";

  return (
    <div className="metric-card" style={{gridColumn:"span 2"}}>
      <div className="metric-card-head" style={{marginBottom:8}}>
        <span className="metric-card-title">Enrollment trend (6mo)</span>
        <InfoDot text="New devices enrolled per month over the last 6 months, split by Chrome OS vs Chrome OS Flex." />
      </div>
      {allZero ? <p className="empty-note">No devices enrolled in this window.</p> : (
        <>
          <div style={{display:"flex", justifyContent:"flex-end", gap:10, marginBottom:2}}>
            <span className="segbar-legend-item" style={{fontSize:10}}><span className="swatch-sq" style={{background:"var(--primary)"}} />Chrome OS</span>
            <span className="segbar-legend-item" style={{fontSize:10}}><span className="swatch-sq" style={{background:"#7a4fd8"}} />Flex</span>
          </div>
          <svg viewBox={`0 0 ${w} ${h}`} style={{width:"100%", height:h, display:"block"}} preserveAspectRatio="none">
            <path d={chromeOsAreaPath} fill="var(--primary)" fillOpacity="0.55" stroke="var(--primary)" strokeWidth="1.5" />
            <path d={flexAreaPath} fill="#7a4fd8" fillOpacity="0.55" stroke="#7a4fd8" strokeWidth="1.5" />
            {points.map((p, i) => p.count > 0 && (
              <text key={p.month} x={xs[i]} y={totalYs[i] - 4} textAnchor="middle" fontSize="9" fill="var(--text-muted)">{p.count}</text>
            ))}
          </svg>
          <div style={{display:"flex", justifyContent:"space-between", marginTop:4}}>
            {points.map(p => (
              <span key={p.month} style={{fontSize:10, color:"var(--text-faint)"}} title={`${p.month}: ${p.chromeOsCount} Chrome OS, ${p.flexCount} Flex`}>{p.month.slice(5)}/{p.month.slice(2, 4)}</span>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// RankedBarList: Halofort-only alternative to DistributionCard for "top N"
// ranked lists (top apps by device count, top Android apps by user count) -
// a segmented proportion bar is built for a handful of categories that sum
// to a whole (OS version, license type); it doesn't read well for a ranked
// list of many items where each item's own count matters more than its
// share of the total. Reuses the same toSegments() top-5-plus-Other
// grouping as DistributionCard, just rendered as ranked horizontal bars
// instead of one stacked bar.
function RankedBarList({ title, distribution, info }) {
  const segments = toSegments(distribution);
  const max = Math.max(1, ...segments.map(s => s.value));
  return (
    <div className="metric-card">
      <div className="metric-card-head" style={{marginBottom:8}}>
        <span className="metric-card-title">{title}</span>
        {info && <InfoDot text={info} />}
      </div>
      {segments.length === 0 ? <p className="empty-note">No data yet.</p> : (
        <div style={{display:"flex", flexDirection:"column", gap:9}}>
          {segments.map(s => (
            <div key={s.label}>
              <div style={{display:"flex", justifyContent:"space-between", gap:8, fontSize:12, marginBottom:3}}>
                <span style={{overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", minWidth:0}} title={s.label}>{s.label}</span>
                <span style={{color:"var(--text-muted)", flexShrink:0}}>{s.value}</span>
              </div>
              <div style={{height:6, borderRadius:3, background:"var(--border)", overflow:"hidden"}}>
                <div style={{height:"100%", width:`${(s.value / max) * 100}%`, background:s.color, borderRadius:3}} />
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// MetricCard: the shared shell for every device-list insight (AUE, dev mode,
// extended support, storage/RAM warnings, orphaned devices, etc). Each card
// shows a count badge and up to 4 items so ten warning categories read as a
// scannable grid instead of ten long vertical lists.
function MetricCard({ title, items, emptyText, renderValue, info, onViewAll }) {
  const count = items.length;
  const shown = items.slice(0, 3);
  return (
    <div className="metric-card">
      <div className="metric-card-head">
        <span className="metric-card-title">{title}<InfoDot text={info} /></span>
        <span className={`metric-count ${count > 0 ? "nonzero" : ""}`}>{count}</span>
      </div>
      <div className="metric-card-content">
        {count === 0 ? <p className="empty-note">{emptyText}</p> : (
          <>
            {shown.map((item, i) => (
              <div className="metric-item" key={item.id || i}>
                <span className="metric-item-name" title={item.name}>{item.name}</span>
                {renderValue(item)}
              </div>
            ))}
          </>
        )}
      </div>
      {count > 3 && onViewAll && (
        <button className="view-all-btn" onClick={() => onViewAll(title, items)}>
          View all {count.toLocaleString()} devices →
        </button>
      )}
    </div>
  );
}

// Detail: one label+value pair in a device's expanded row. Renders "-" for
// any falsy/absent value so a sparsely-populated device (common - not every
// Workspace backfills every optional field) still reads as complete, not broken.
function Detail({ label, children, info }) {
  return (
    <div>
      <span className="device-detail-label">{label}{info && <InfoDot text={info} />}</span>
      {/* Wrapped in its own span (not just a bare text node) so the
          Halofort card CSS can reliably give it a fixed-width column -
          harmless everywhere else since nothing else styles this class. */}
      <span className="device-detail-value">{children === null || children === undefined || children === "" ? "-" : children}</span>
    </div>
  );
}

// RevealableValue: masked by default (identifiers like Device ID/Serial
// number are sensitive enough to not just sit exposed on screen) - an eye
// button reveals it, a separate copy button copies the real value straight
// to the clipboard without needing to reveal it first.
function RevealableValue({ value }) {
  const [revealed, setRevealed] = useState(false);
  const [copied, setCopied] = useState(false);
  if (value === null || value === undefined || value === "") return "-";
  const copy = () => {
    navigator.clipboard.writeText(String(value)).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    }).catch(() => {});
  };
  return (
    <span style={{display:"inline-flex", alignItems:"center", gap:6}}>
      <code style={{fontSize:11, wordBreak:"break-all"}}>{revealed ? value : "•".repeat(10)}</code>
      <button onClick={() => setRevealed(v => !v)} title={revealed ? "Hide" : "Show"}
        style={{display:"inline-flex", background:"none", border:"none", padding:2, cursor:"pointer", color:"var(--text-faint)"}}>
        <ActionIcon name={revealed ? "hide" : "details"} />
      </button>
      <button onClick={copy} title={copied ? "Copied!" : "Copy"}
        style={{display:"inline-flex", background:"none", border:"none", padding:2, cursor:"pointer", color: copied ? "var(--active-text)" : "var(--text-faint)"}}>
        <ActionIcon name={copied ? "enable" : "copy"} />
      </button>
    </span>
  );
}

// DeviceSection: wraps a device-detail group (icon + title + its Detail
// fields) in the Halofort "titled card" look when that theme is active,
// falling back to the existing plain section-header style otherwise. Same
// children/data either way - this only changes the surrounding chrome, not
// what's fetched or shown, so there's no risk of it silently hiding a field
// that exists in the default layout.
function DeviceSection({ template, icon, title, info, children }) {
  if (template === "halofort") {
    return (
      <div className="halofort-section-card">
        <div className="halofort-section-card-head">
          <ActionIcon name={icon} />
          <span>{title}</span>
          {info && <InfoDot text={info} />}
        </div>
        {children}
      </div>
    );
  }
  return (
    <>
      <p className="device-detail-label" style={{marginTop:14, marginBottom:4}}>{title}{info && <InfoDot text={info} />}</p>
      {children}
    </>
  );
}

// MANUFACTURER_BADGE_COLORS: a fixed color per well-known Chromebook OEM,
// keyed off whatever manufacturer name the device's own reported model
// string starts with (e.g. "HP Chromebook 14a-na0" -> "hp"). This is a
// letter-badge (like the admin avatar chip), not a reproduction of any
// OEM's actual trademarked logo artwork - deliberately original, the same
// reasoning as PlatformIcon elsewhere in this app.
const MANUFACTURER_BADGE_COLORS = {
  hp: "#0096d6", dell: "#007db8", lenovo: "#e2231a", acer: "#83b81a",
  asus: "#003876", samsung: "#1428a0", google: "#4285f4", google_bloog: "#4285f4",
};

// OsTypeBadge: a small corner indicator for the device's real chromeOsType
// field ("chromeOs" | "chromeOsFlex"). Deliberately an original abstract
// glyph, not a reproduction of Google's actual ChromeOS/Flex logo artwork -
// same reasoning as MANUFACTURER_BADGE_COLORS above.
function OsTypeBadge({ chromeOsType, size }) {
  if (!chromeOsType) return null;
  const isFlex = chromeOsType === "chromeOsFlex";
  // Smaller, pushed further into the corner (bigger negative offset) than
  // before - at the old size/position it overlapped the manufacturer
  // initials (e.g. covering the "P" in "HP"). Now it sits mostly outside
  // the badge box as a small corner accent instead of over the text.
  const badgeSize = Math.max(11, Math.round(size * 0.32));
  return (
    <div title={isFlex ? "Chrome OS Flex" : "Chrome OS"} style={{position:"absolute", bottom:-3, right:-3, width:badgeSize, height:badgeSize, borderRadius:"50%", background:"var(--surface)", border:"1.5px solid var(--surface)", boxShadow:"0 0 0 1px var(--border)", display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden"}}>
        {isFlex ? (
          // Original two-tone wave loop, evoking Flex's "infinity" motif without
          // copying its exact geometry or brand colors.
          <svg width={badgeSize} height={badgeSize} viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="12" fill="#0f766e" />
            <path d="M4 13c1.5-3 3.5-3 5 0s3.5 3 5 0 3.5-3 5 0" stroke="#5eead4" strokeWidth="2.4" strokeLinecap="round" fill="none" />
          </svg>
        ) : (
          // Original tri-color pinwheel + center dot, evoking Chrome's general
          // silhouette with a distinct, non-brand palette and proportions.
          <svg width={badgeSize} height={badgeSize} viewBox="0 0 24 24">
            <path d="M12 12 L12 1 A11 11 0 0 1 21.53 17 Z" fill="#e5533d" />
            <path d="M12 12 L21.53 17 A11 11 0 0 1 2.47 17 Z" fill="#2e9e8e" />
            <path d="M12 12 L2.47 17 A11 11 0 0 1 12 1 Z" fill="#e8a33d" />
            <circle cx="12" cy="12" r="4.4" fill="#f4f6f8" />
            <circle cx="12" cy="12" r="4.4" fill="none" stroke="#00000022" strokeWidth="0.6" />
          </svg>
        )}
    </div>
  );
}

function DeviceLogo({ model, chromeOsType, size = 42 }) {
  // Best-effort real-data parse of the device's own reported model string -
  // no fabricated manufacturer when that string doesn't yield a clean word.
  const manufacturer = model ? model.trim().split(/\s+/)[0] : null;
  if (!manufacturer) {
    return (
      <div style={{position:"relative", flexShrink:0}}>
        <div className="halofort-device-header-icon" style={{width:size, height:size}}>
          <ActionIcon name="nav_devices" />
        </div>
        <OsTypeBadge chromeOsType={chromeOsType} size={size} />
      </div>
    );
  }
  const key = manufacturer.toLowerCase().replace(/[^a-z_]/g, "");
  const color = MANUFACTURER_BADGE_COLORS[key] || "var(--primary)";
  return (
    <div style={{position:"relative", flexShrink:0}}>
      <div title={manufacturer} style={{width:size, height:size, borderRadius:8, background:color, color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", fontSize:size * 0.32, fontWeight:700}}>
        {manufacturer.slice(0, 2).toUpperCase()}
      </div>
      <OsTypeBadge chromeOsType={chromeOsType} size={size} />
    </div>
  );
}

// DeviceActionsCard: every real ChromeOS device action beyond Restart/Lock
// (which stay in the table row) - split into command-based actions
// (Google's issueCommand, documented Kiosk/managed-guest-session only for
// several of these, so they may genuinely fail on an ordinary user-session
// Chromebook - that's a real API response, not a bug) and direct field
// patches (disable/re-enable/deprovision/move, which take effect next
// check-in, same as editing them in Admin console).
function DeviceActionsCard({ device, canOperate, isAdmin, runAction, runDeprovision, runDisable, runDeployTracker, actionState }) {
  const [volume, setVolume] = useState(50);
  const [targetOu, setTargetOu] = useState(device.orgUnit || "/");
  // orgUnitOptions backs a <datalist> on the Move field below - the same
  // real org-unit paths the Directory tab and the policy editor's OU picker
  // already fetch, so an admin can pick an existing one instead of having
  // to retype a path by hand (a likely contributor to org-unit typos/path
  // mistakes). Still a plain text input underneath, not a locked dropdown -
  // a path that doesn't exist yet (about to be created, or just not synced
  // into this list yet) can still be typed manually.
  const [orgUnitOptions, setOrgUnitOptions] = useState([]);
  useEffect(() => {
    apiFetch(`${API}/directory`)
      .then(r => r.json()).then(d => setOrgUnitOptions(d.orgUnits || []))
      .catch(() => setOrgUnitOptions([]));
  }, []);
  const [confirming, setConfirming] = useState(null); // action key currently showing its confirm step, or null
  // factoryReset: only meaningful while confirming === "deprovision" - matches
  // Admin console's own deprovision dialog, which defaults to bundling a
  // factory reset (confirmed against the real dialog: "Yes, Factory Reset"
  // is its pre-selected option). Without this, deprovision only flips the
  // server-side status - the device itself shows no visible change, which
  // is exactly why it looked like "nothing happened" before this existed.
  const [factoryReset, setFactoryReset] = useState(true);
  // understood: the required acknowledgement checkbox Admin console's own
  // Reset/Deprovision/Disable dialogs all gate their action button behind
  // ("I understand this will remove data...", "I understand the upgrade
  // policy, deprovisioning steps...") - reused across all three confirms
  // here since only one is ever open at a time, reset to false each time a
  // new one opens so it can't carry over as an accidental yes.
  const [understood, setUnderstood] = useState(false);
  // resetChoice/disableChoice mirror the real dialogs' own radio choice -
  // Reset offers "Clear User Profiles" (recommended) vs "Factory Reset";
  // Disable offers "Disable With Lock Screen" (default) vs "Disable With
  // Factory Reset". Neither is a fake UI-only choice: "Clear User Profiles"
  // maps to the same wipe/Lock action already used elsewhere, and the
  // factory-reset variants sequence a real powerwash after, same pattern as
  // runDeprovision.
  const [resetChoice, setResetChoice] = useState("clear");
  const [disableChoice, setDisableChoice] = useState("lock");

  const state = actionState[device.id];
  const busy = state?.status === "pending";
  const isDisabled = device.provisionStatus === "DISABLED";

  // Kiosk/managed-guest-session-only commands confirmed live to get stuck
  // "pending" forever on an ordinary user-session device (the device never
  // acknowledges them) - and while anything is pending, Google's API
  // rejects ALL new commands for that device, not just kiosk-only ones.
  // Gated behind the same confirm step as the destructive actions so this
  // doesn't happen by an accidental click.
  const kioskWarning = "Only works on Kiosk/managed-guest-session devices. On any other device type it gets stuck \"pending\" and blocks ALL other commands (including Restart/Wipe) until Google's server times it out - confirmed live, can take a while. Proceed?";
  const confirmableCommand = (key, icon, label, tooltip, run) => confirming === key ? (
    <>
      <span className="empty-note" style={{color:"var(--critical-text)", flexBasis:"100%"}}>{kioskWarning}</span>
      <button disabled={busy} className="btn-danger" onClick={() => { run(); setConfirming(null); }}>Yes, run it</button>
      <button disabled={busy} onClick={() => setConfirming(null)}>Cancel</button>
    </>
  ) : (
    <ActionButton icon={icon} disabled={busy || !canOperate} title={canOperate ? tooltip : "Requires operator or admin role"} onClick={() => setConfirming(key)}>{label}</ActionButton>
  );

  return (
    <>
      <p className="action-group-label">Actions<InfoDot text="Diagnostics require the device to be online and, for several, in a Kiosk/managed-guest-session - see the confirmation warning before running them on an ordinary device." /></p>
      <div className="action-row" style={{marginBottom:8}}>
        {confirmableCommand("screenshot", "screenshot", "Screenshot", "Capture a screenshot from the device", () => runAction(device.id, "screenshot"))}
        <ActionButton icon="remote_desktop" disabled={busy || !canOperate} title={canOperate ? "Start a remote desktop session to this device" : "Requires operator or admin role"} onClick={() => runAction(device.id, "crd")}>Remote desktop</ActionButton>
        {confirmableCommand("capture_logs", "capture_logs", "Capture logs", "Capture device logs for troubleshooting", () => runAction(device.id, "capture_logs"))}
        <ActionButton icon="support_packet" disabled={busy || !canOperate} title={canOperate ? "Fetch a Google support packet for this device" : "Requires operator or admin role"} onClick={() => runAction(device.id, "support_packet")}>Fetch support packet</ActionButton>

        {confirming === "set_volume" ? (
          <>
            <span className="empty-note" style={{color:"var(--critical-text)", flexBasis:"100%"}}>{kioskWarning}</span>
            <button disabled={busy} className="btn-danger" onClick={() => { runAction(device.id, "set_volume", String(volume)); setConfirming(null); }}>Yes, run it</button>
            <button disabled={busy} onClick={() => setConfirming(null)}>Cancel</button>
          </>
        ) : (
          <>
            <input type="number" min="0" max="100" value={volume} onChange={e => setVolume(e.target.value)} style={{width:60, fontSize:12, padding:"4px 6px"}} />
            <ActionButton icon="volume" disabled={busy || !canOperate} title={canOperate ? "Set the device's system volume" : "Requires operator or admin role"} onClick={() => setConfirming("set_volume")}>Set volume</ActionButton>
          </>
        )}

        {isDisabled ? (
          <ActionButton icon="enable" disabled={busy || !isAdmin} title={isAdmin ? "Restore this device to active management" : "Requires admin role"} onClick={() => runAction(device.id, "enable")}>Re-enable</ActionButton>
        ) : confirming === "disable" ? (
          <div style={{flexBasis:"100%"}}>
            <p className="empty-note" style={{margin:"0 0 6px"}}>Disabling makes the device inoperable. Choose how, matching Admin console's own Disable dialog:</p>
            <label style={{display:"flex", gap:6, alignItems:"flex-start", fontSize:12, marginBottom:4}}>
              <input type="radio" name="disableChoice" checked={disableChoice === "lock"} onChange={() => setDisableChoice("lock")} />
              <span><b>Disable With Lock Screen</b> - blocks use of the device until it's enabled again; stays enrolled.</span>
            </label>
            <label style={{display:"flex", gap:6, alignItems:"flex-start", fontSize:12, marginBottom:8}}>
              <input type="radio" name="disableChoice" checked={disableChoice === "factory"} onChange={() => setDisableChoice("factory")} />
              <span><b>Disable With Factory Reset</b> - blocks use of the device and removes all data.</span>
            </label>
            <label style={{display:"flex", gap:6, alignItems:"flex-start", fontSize:12, marginBottom:8}}>
              <input type="checkbox" checked={understood} onChange={e => setUnderstood(e.target.checked)} />
              <span>I understand this will make the device inoperable{disableChoice === "factory" ? " and remove all data" : ""}.</span>
            </label>
            <button disabled={busy || !understood} className="btn-danger" onClick={() => { runDisable(device.id, disableChoice === "factory"); setConfirming(null); }}>Disable</button>{" "}
            <button disabled={busy} onClick={() => setConfirming(null)}>Cancel</button>
          </div>
        ) : (
          <ActionButton icon="disable" disabled={busy || !isAdmin} title={isAdmin ? "Temporarily block this device from checking in" : "Requires admin role"} onClick={() => { setDisableChoice("lock"); setUnderstood(false); setConfirming("disable"); }}>Disable</ActionButton>
        )}

        <div style={{flexBasis:"100%", height:0}} />
        <input value={targetOu} onChange={e => setTargetOu(e.target.value)} list="device-orgunit-options"
          placeholder="/Target org unit" title="Pick an existing org unit from the list, or type a path manually"
          style={{flex:1, minWidth:120, fontSize:12, padding:"4px 6px"}} />
        <datalist id="device-orgunit-options">
          {orgUnitOptions.map(ou => <option key={ou.id || ou.path} value={ou.path} />)}
        </datalist>
        <ActionButton icon="move" disabled={busy || !isAdmin || targetOu === device.orgUnit} title={isAdmin ? "Move this device to a different organizational unit" : "Requires admin role"} onClick={() => runAction(device.id, "move", targetOu)}>Move</ActionButton>
      </div>

      <p className="action-group-label" style={{color:"var(--primary)"}}>Extensions & Policies</p>
      <div className="action-row" style={{marginBottom:8}}>
        {confirming === "deploy_tracker" ? (
          <div style={{flexBasis:"100%"}}>
            <p className="empty-note" style={{margin:"0 0 6px"}}>This will forcefully deploy the Location Tracking Chrome Extension to the entire organizational unit <b>{device.orgUnit || "/"}</b> using the Chrome Policy API.</p>
            <button disabled={busy} className="btn-primary" onClick={() => { runDeployTracker(device.id, device.orgUnit); setConfirming(null); }}>Deploy Tracker</button>{" "}
            <button disabled={busy} onClick={() => setConfirming(null)}>Cancel</button>
          </div>
        ) : (
          <ActionButton icon="enable" disabled={busy || !isAdmin} title={isAdmin ? "Forcefully deploy location tracker extension to this OU" : "Requires admin role"} onClick={() => setConfirming("deploy_tracker")}>Deploy Location Tracker</ActionButton>
        )}
      </div>

      <p className="action-group-label" style={{color:"var(--critical-text)"}}>Danger zone</p>
      <div className="action-row">
        {confirming === "powerwash" ? (
          <div style={{flexBasis:"100%"}}>
            <p className="empty-note" style={{margin:"0 0 6px", color:"var(--critical-text)"}}>Resetting will remove data. Choose the type of reset, matching Admin console's own Reset dialog:</p>
            <label style={{display:"flex", gap:6, alignItems:"flex-start", fontSize:12, marginBottom:4}}>
              <input type="radio" name="resetChoice" checked={resetChoice === "clear"} onChange={() => setResetChoice("clear")} />
              <span><b>Clear User Profiles</b> to remove all user profile data, but keep device policy and enrollment (Recommended).</span>
            </label>
            <label style={{display:"flex", gap:6, alignItems:"flex-start", fontSize:12, marginBottom:8}}>
              <input type="radio" name="resetChoice" checked={resetChoice === "factory"} onChange={() => setResetChoice("factory")} />
              <span><b>Factory Reset</b> to remove all data including user profiles, device policies, and enrollment data.</span>
            </label>
            <label style={{display:"flex", gap:6, alignItems:"flex-start", fontSize:12, marginBottom:8}}>
              <input type="checkbox" checked={understood} onChange={e => setUnderstood(e.target.checked)} />
              <span>I understand this will remove data from the device and cannot be undone.</span>
            </label>
            <button disabled={busy || !understood} className="btn-danger" onClick={() => { runAction(device.id, resetChoice === "factory" ? "powerwash" : "wipe"); setConfirming(null); }}>Reset</button>{" "}
            <button disabled={busy} onClick={() => setConfirming(null)}>Cancel</button>
          </div>
        ) : (
          <ActionButton icon="reset" disabled={busy || !isAdmin} className="btn-danger" title={isAdmin ? "Erase all local data and factory reset the device" : "Requires admin role"} onClick={() => { setResetChoice("clear"); setUnderstood(false); setConfirming("powerwash"); }}>Reset (factory reset)</ActionButton>
        )}
        {confirming === "deprovision" ? (
          <div style={{flexBasis:"100%"}}>
            <p className="empty-note" style={{margin:"0 0 6px", color:"var(--critical-text)"}}>Deprovisioning will stop device policy syncing and remove device-level policies. Once deprovisioned, it must be wiped before it can be re-enrolled.</p>
            <label style={{display:"flex", gap:6, alignItems:"flex-start", fontSize:12, marginBottom:4}}>
              <input type="radio" name="deprovisionChoice" checked={factoryReset} onChange={() => setFactoryReset(true)} />
              <span><b>Yes, Factory Reset</b> to remove all data including user profiles, device policies, and enrollment data.</span>
            </label>
            <label style={{display:"flex", gap:6, alignItems:"flex-start", fontSize:12, marginBottom:8}}>
              <input type="radio" name="deprovisionChoice" checked={!factoryReset} onChange={() => setFactoryReset(false)} />
              <span>No, keep existing data and user profiles.</span>
            </label>
            <label style={{display:"flex", gap:6, alignItems:"flex-start", fontSize:12, marginBottom:8}}>
              <input type="checkbox" checked={understood} onChange={e => setUnderstood(e.target.checked)} />
              <span>I understand the upgrade policy, deprovisioning steps, and enrollment steps.</span>
            </label>
            <button disabled={busy || !understood} className="btn-danger" onClick={() => { runDeprovision(device.id, factoryReset); setConfirming(null); }}>Deprovision</button>{" "}
            <button disabled={busy} onClick={() => setConfirming(null)}>Cancel</button>
          </div>
        ) : (
          <ActionButton icon="deprovision" disabled={busy || !isAdmin} className="btn-danger" title={isAdmin ? "Release this device's license and remove it from fleet management" : "Requires admin role"} onClick={() => { setFactoryReset(true); setUnderstood(false); setConfirming("deprovision"); }}>Deprovision</ActionButton>
        )}
      </div>

      {state && state.status !== "pending" && (
        <>
          <p className="empty-note" style={{marginTop:10, color: state.status === "error" ? "var(--critical-text)" : "var(--active-text)"}}>
            {state.action}: {state.status === "error" ? (state.error || "Failed")
              : state.action === "crd" && state.result ? <>Ready - <a href={state.result} target="_blank" rel="noreferrer">open remote desktop session</a></>
              : state.result ? state.result
              : "Done"}
          </p>
          {state.action === "crd" && state.result && (
            <p className="empty-note" style={{color:"var(--text-faint)"}}>
              If the link says "You do not have permission to perform that action," open it in a browser/profile signed into the Workspace admin account that holds the ChromeOS device admin privilege (Admin console &rsaquo; Admin roles) - not a personal Google account. This is a Google-side account/privilege check on remotedesktop.google.com, not something this app controls.
            </p>
          )}
        </>
      )}
      <p className="card-footnote">
        "Reload policies" and "Locate" aren't exposed by any public Google API available to this integration, so they're not offered here - not fabricated.
        Screenshot/Set volume/Capture logs are Kiosk/managed-guest-session only - confirmed live that issuing one on an ordinary device gets it stuck pending and blocks every other command on that device until Google's server times it out, hence the extra confirm step.
      </p>
    </>
  );
}

// LeafletMap: A lightweight React wrapper for Leaflet to render the device location
// and its history path with a custom red marker.
// haversineMeters: great-circle distance between two lat/lng points, used
// to tell real movement apart from GPS/Wi-Fi-resolution jitter (repeated
// pings from a stationary device can drift a few meters between reads
// purely from resolution noise, not actual travel).
function haversineMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
// MOVEMENT_THRESHOLD_METERS: below this, two consecutive pings are treated
// as "the same spot" for the trail line - roughly matching the accuracy
// figures this fleet actually reports (±14-17m in testing), so normal
// resolution noise doesn't draw a trail for a device that never moved.
const MOVEMENT_THRESHOLD_METERS = 20;

function LeafletMap({ lat, lng, history }) {
  const mapRef = React.useRef(null);
  const containerRef = React.useRef(null);

  React.useEffect(() => {
    if (!containerRef.current) return;

    // Initialize map if it doesn't exist
    if (!mapRef.current) {
      mapRef.current = L.map(containerRef.current, {
        zoomControl: true,
        attributionControl: false // keep it clean, we add it manually or it's fine
      });

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
      }).addTo(mapRef.current);
    }

    const map = mapRef.current;

    // Clear existing layers (except the tile layer)
    map.eachLayer((layer) => {
      if (layer instanceof L.Marker || layer instanceof L.Polyline) {
        map.removeLayer(layer);
      }
    });

    // Create a custom red icon
    const redIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    // Add marker for current location
    if (lat && lng) {
      L.marker([lat, lng], { icon: redIcon }).addTo(map);
      map.setView([lat, lng], 17);
    }

    // Add history polyline if available
    if (history && history.length > 0) {
      const rawPoints = history.map(p => [p.lat, p.lng]);
      if (lat && lng) {
        rawPoints.push([lat, lng]); // Connect to current
      }
      // The line only connects points that represent real movement (see
      // MOVEMENT_THRESHOLD_METERS) - every dot below is still a real ping
      // regardless, this just keeps the line itself from zigzagging on
      // pure GPS/Wi-Fi resolution noise from a stationary device.
      const movementPoints = [];
      rawPoints.forEach(([plat, plng]) => {
        const last = movementPoints[movementPoints.length - 1];
        if (!last || haversineMeters(last[0], last[1], plat, plng) >= MOVEMENT_THRESHOLD_METERS) {
          movementPoints.push([plat, plng]);
        }
      });
      if (movementPoints.length > 1) {
        L.polyline(movementPoints, { color: 'red', weight: 3, dashArray: '5, 5', opacity: 0.6 }).addTo(map);
      }

      // Add small dots for every real ping, regardless of the movement
      // filter above - the line shows the movement path, the dots show
      // every individual ping that was actually received.
      history.forEach(p => {
         L.circleMarker([p.lat, p.lng], { radius: 4, color: 'red', fillColor: '#fff', fillOpacity: 1 }).addTo(map);
      });
    }

    // Handle resizes so Leaflet doesn't leave grey gaps when flexbox stretches it
    const resizeObserver = new ResizeObserver(() => {
      map.invalidateSize();
    });
    resizeObserver.observe(containerRef.current);

    return () => resizeObserver.disconnect();
  }, [lat, lng, history]);

  return <div ref={containerRef} style={{ width: "100%", flex: 1, minHeight: "320px", zIndex: 1 }} />;
}

// DeviceDetailTabs: one full-width panel with a subtab switcher (the same
// proven pill-tab pattern Security already uses) instead of six separate
// boxed cards tiled side by side - tiling independently-sized cards (a
// dense Hardware card next to a sparse Network card) turned out to
// genuinely overlap in Chrome once a section grew taller than its
// neighbors, not just leave whitespace. Showing one section at a time
// sidesteps that whole class of layout bug.
// SHOW_IP_BASED_LOCATION: hides the "Approximate Location (IP-based)"
// card - reported confusing alongside the more accurate Live Tracking
// card above it. The endpoint/logic behind it is untouched; flip this
// back to true to bring it back.
const SHOW_IP_BASED_LOCATION = false;
function DeviceDetailTabs(props) {
  const { device: d, tele, storageTotal, storageUsed, memTotal, memUsed, canOperate, isAdmin, runAction, runDeprovision, runDisable, runDeployTracker, actionState, appCatalog, refreshDevices, template } = props;
  const [sub, setSub] = useState("hardware");
  const [deviceActionsMenuOpen, setDeviceActionsMenuOpen] = useState(false);
  // Disk/Memory detail rows are almost always all "-" (most devices don't
  // report this), so they default to hidden behind a toggle instead of
  // permanently padding out the tab with empty fields.
  const [showDiskDetails, setShowDiskDetails] = useState(true);
  const [showMemoryDetails, setShowMemoryDetails] = useState(true);
  // Apps tab pagination - matches Admin console's own "Rows per page" +
  // page-through pattern instead of silently truncating the list.
  const [appsPage, setAppsPage] = useState(0);
  const [appsPageSize, setAppsPageSize] = useState(10);
  const [geoAddress, setGeoAddress] = useState({});
  const [forcePinging, setForcePinging] = useState(false);
  const [mapFullscreen, setMapFullscreen] = useState(false); // in-app fullscreen for the Live Tracking map
  const [pingMsg, setPingMsg] = useState("");
  // Asset info (Location/Notes/Order #) editing - these were read-only
  // displays of Google's annotatedLocation/notes/orderNumber fields (only
  // ever settable from Admin console directly) until handleAssetInfoUpdate
  // added a write path. editingAssetInfo null = viewing; an object = the
  // in-progress edit's field values, seeded from the device's current
  // values only at the moment Edit is clicked (not kept live-synced to `d`
  // while editing, so a background device refresh mid-edit can't clobber
  // what the admin is typing).
  const [editingAssetInfo, setEditingAssetInfo] = useState(null);
  const [savingAssetInfo, setSavingAssetInfo] = useState(false);
  const [assetInfoError, setAssetInfoError] = useState("");
  // Second, independently-sourced location signal - approximate (city/ISP
  // level, not street-level) since it comes from the device's last-known
  // public IP rather than an on-device Wi-Fi/GPS-assisted fix. Fetched only
  // once the Location tab is actually opened, not eagerly for every device.
  const [ipLocation, setIpLocation] = useState(null);
  // Last successful IP-location result, persisted per device so a later
  // failed/private-IP lookup still shows the most recent real fix instead
  // of falling back to the sample preview once one has actually been seen.
  const [lastKnownIpLocation, setLastKnownIpLocation] = useState(() => {
    try {
      const raw = localStorage.getItem(`cc_ip_location_${d.id}`);
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  });
  React.useEffect(() => {
    if (sub !== "location") return;
    setIpLocation({ loading: true });
    apiFetch(`${API}/devices/ip-location?id=${d.id}`)
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
      .then(data => {
        setIpLocation({ data });
        const entry = { data, fetchedAt: Date.now() };
        setLastKnownIpLocation(entry);
        try { localStorage.setItem(`cc_ip_location_${d.id}`, JSON.stringify(entry)); } catch {}
      })
      .catch(e => setIpLocation({ error: e.message }));
  }, [sub, d.id]);
  // Reverse geocode whenever tracked location changes
  const prevLatRef = React.useRef(null);
  React.useEffect(() => {
    if (d.trackedLocationLat && d.trackedLocationLat !== 0 && d.trackedLocationLat !== prevLatRef.current) {
      prevLatRef.current = d.trackedLocationLat;
      fetch(`https://nominatim.openstreetmap.org/reverse?lat=${d.trackedLocationLat}&lon=${d.trackedLocationLng}&format=json`)
        .then(r => r.json())
        .then(data => setGeoAddress(data.address || {}))
        .catch(() => {});
    }
  }, [d.trackedLocationLat, d.trackedLocationLng]);

  // Force Refresh: polls the backend every 2s for up to 30s waiting for a new ping
  const forcePing = async () => {
    setForcePinging(true);
    setPingMsg("Waiting for extension to report location...");
    const before = d.trackedLocationTime || 0;
    const deadline = Date.now() + 30000;
    const poll = async () => {
      if (Date.now() > deadline) {
        setPingMsg("No new ping received in 30s. Extension pings automatically every 15 min.");
        setForcePinging(false);
        return;
      }
      if (refreshDevices) await refreshDevices();
      // If device state updated in the parent, it will re-render with new trackedLocationTime
      // We check via a closure-captured ref
      if (d.trackedLocationTime && d.trackedLocationTime !== before) {
        setPingMsg("Location updated! ✓");
        setForcePinging(false);
        setTimeout(() => setPingMsg(""), 3000);
        return;
      }
      setTimeout(poll, 2000);
    };
    poll();
  };


  const sections = [
    { key: "hardware", label: "Hardware", icon: "nav_devices" },
    { key: "battery", label: "Battery", icon: "storage" },
    { key: "os", label: "OS & updates", icon: "nav_reports" },
    { key: "network", label: "Network", icon: "language" },
    { key: "apps", label: "Apps", icon: "grid" },
    { key: "storage", label: "Storage & Memory", icon: "memory" },
    { key: "actions", label: "Actions", icon: "nav_settings" },
    { key: "location", label: "Location", icon: "location" },
    { key: "usage", label: "Usage & enrollment", icon: "nav_enrollment" },
  ];
  const isHalofort = template === "halofort";
  return (
    <div className="detail-card">
      {isHalofort && (
        <div className="halofort-device-header">
          <div style={{display:"flex", alignItems:"center", gap:12}}>
            <DeviceLogo model={d.model} chromeOsType={d.chromeOsType} />
            <div>
              <p style={{fontWeight:600, fontSize:14, margin:"0 0 2px"}}>{d.name} <span style={{fontWeight:400, color:"var(--text-faint)", fontSize:12}}>(Serial)</span></p>
              <p style={{fontSize:12, color:"var(--text-muted)", margin:0, display:"flex", alignItems:"center", gap:6}}>
                <ActionIcon name="user" />{d.recentUserEmail || "-"}
              </p>
            </div>
          </div>
          {/* Real dropdown - same runAction/runDisable calls the Actions
              tab itself uses, just reached from here as menu items instead
              of only from a separate tab, matching the reference's own
              "Device actions" button. */}
          <div style={{position:"relative"}}>
            <button onClick={() => setDeviceActionsMenuOpen(v => !v)} className="btn-primary" style={{display:"flex", alignItems:"center", gap:6, padding:"8px 14px"}}>
              <ActionIcon name="nav_settings" /> Device actions
            </button>
            {deviceActionsMenuOpen && (
              <>
                <div onClick={() => setDeviceActionsMenuOpen(false)} style={{position:"fixed", inset:0, zIndex:9}} />
                <div className="halofort-avatar-menu" style={{minWidth:190}}>
                  <button className="halofort-avatar-menu-item" disabled={!canOperate}
                    onClick={() => { setDeviceActionsMenuOpen(false); runAction(d.id, "restart"); }}>
                    <ActionIcon name="restart" /> Restart
                  </button>
                  <button className="halofort-avatar-menu-item" disabled={!isAdmin}
                    onClick={() => { setDeviceActionsMenuOpen(false); runAction(d.id, "wipe"); }}>
                    <ActionIcon name="lock" /> Lock
                  </button>
                  {d.provisionStatus === "DISABLED" ? (
                    <button className="halofort-avatar-menu-item" disabled={!isAdmin}
                      onClick={() => { setDeviceActionsMenuOpen(false); runAction(d.id, "enable"); }}>
                      <ActionIcon name="enable" /> Enable
                    </button>
                  ) : (
                    <button className="halofort-avatar-menu-item" disabled={!isAdmin}
                      onClick={() => { setDeviceActionsMenuOpen(false); runAction(d.id, "disable"); }}>
                      <ActionIcon name="disable" /> Disable
                    </button>
                  )}
                  <button className="halofort-avatar-menu-item"
                    onClick={() => { setDeviceActionsMenuOpen(false); setSub("location"); }}>
                    <ActionIcon name="location" /> Location
                  </button>
                  <button className="halofort-avatar-menu-item"
                    onClick={() => { setDeviceActionsMenuOpen(false); setSub("actions"); }}>
                    <ActionIcon name="nav_settings" /> More actions&hellip;
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
      )}
      {isHalofort ? (
        <div className="halofort-subtab-pills">
          {sections.map(s => (
            <button key={s.key} className={`halofort-subtab-pill ${sub === s.key ? "active" : ""}`} onClick={() => setSub(s.key)}>
              <ActionIcon name={s.icon} /> {s.label}
            </button>
          ))}
        </div>
      ) : (
        <div className="subtab-bar" style={{marginBottom:16, display: "flex", justifyContent: "space-between", alignItems: "center"}}>
          <div>
            {sections.map(s => (
              <button key={s.key} className={`subtab-button ${sub === s.key ? "active" : ""}`} onClick={() => setSub(s.key)}>{s.label}</button>
            ))}
          </div>
          <button onClick={refreshDevices} title="Refresh device data" style={{background:"transparent", border:"none", cursor:"pointer", fontSize:16, color:"var(--text-faint)", padding:"4px 8px"}}>
            ↻
          </button>
        </div>
      )}

      {sub === "hardware" && (
        <div className="hardware-scroll">
          <div className={isHalofort ? "halofort-section-cards" : undefined}>
          <DeviceSection template={template} icon="layers" title="Device Summary">
          <div className="device-detail">
            <Detail label="Model" info="The device's hardware model name.">{d.model}</Detail>
            <Detail label="TPM" info="Trusted Platform Module version/firmware - used for verified boot and encryption.">{d.tpmFamily ? `TPM ${d.tpmFamily}${d.tpmFirmwareVersion ? ` (firmware ${d.tpmFirmwareVersion})` : ""}` : null}</Detail>
            <Detail label="Manufactured" info="Device manufacture date, if reported. Falls back to the manufacturer name parsed from the model when Google doesn't report a date.">{d.manufactureDate || (d.model ? d.model.trim().split(/\s+/)[0] : null)}</Detail>
            <Detail label="Org unit" info="The organizational unit this device is assigned to.">{d.orgUnit}</Detail>
            <Detail label="Apps installed" info="Apps and extensions this device has reported usage for, by real name (resolved against the fleet-wide installed-apps report) rather than just a count. See the Apps tab for the full list with usage time.">
              {tele.data?.appsUsage?.length ? (() => {
                const names = tele.data.appsUsage.map(a => appCatalog?.[a.appId]?.displayName || a.appId);
                const shown = names.slice(0, 5);
                const more = names.length - shown.length;
                return (
                  <>
                    {shown.join(", ")}{more > 0 ? ` +${more} more` : ""}{" "}
                    <button onClick={() => setSub("apps")} style={{fontSize:11, padding:"1px 8px", marginLeft:4}}>View all ({names.length})</button>
                  </>
                );
              })() : null}
            </Detail>
          </div>
          </DeviceSection>
          <DeviceSection template={template} icon="memory" title="CPU">
          <div className="device-detail">
            {tele.data?.cpuUtilizationPct != null && <Detail label="CPU utilization" info="Current CPU load as a percentage.">{tele.data.cpuUtilizationPct}%</Detail>}
            <Detail label="CPU model" info="The processor's model name.">{d.cpuModel}</Detail>
            <Detail label="CPU temperature" info="Current CPU core temperature(s).">
              {tele.data?.cpuTemperatures?.length > 0
                ? `${Math.round(tele.data.cpuTemperatures.reduce((s, t) => s + t.temperatureCelsius, 0) / tele.data.cpuTemperatures.length)}°C average (${tele.data.cpuTemperatures.map(t => `${t.label} · ${t.temperatureCelsius}°C`).join(", ")})`
                : d.cpuTempCelsius ? `${d.cpuTempCelsius}°C` : null}
            </Detail>
            <Detail label="Architecture" info="The CPU's instruction set architecture.">{d.cpuArchitecture ? d.cpuArchitecture.replace("X64", "X86-64") : null}</Detail>
            <Detail label="Max clock speed" info="Maximum CPU clock frequency.">{d.cpuMaxClockMhz ? `${(d.cpuMaxClockMhz * 1000).toLocaleString()} kHz` : null}</Detail>
            <Detail label="CPU sample frequency" info="How often CPU telemetry samples are collected.">{tele.data?.cpuSampleFrequency ? `${Number(tele.data.cpuSampleFrequency).toLocaleString()} kHz` : null}</Detail>
            <Detail label="Key locker supported" info="Whether the CPU supports Intel Key Locker for AES key protection.">{tele.data?.cpuKeylockerSupported != null ? String(tele.data.cpuKeylockerSupported) : null}</Detail>
            <Detail label="Key locker configured" info="Whether Key Locker is actually enabled on this device.">{tele.data?.cpuKeylockerConfigured != null ? String(tele.data.cpuKeylockerConfigured) : null}</Detail>
          </div>
          </DeviceSection>
          <DeviceSection template={template} icon="grid" title="Displays, audio & peripherals">
          <div className="device-detail">
            {tele.data?.displays?.length > 0 && <Detail label="Displays connected" info="Number and type of connected displays.">{tele.data.displays.length} ({tele.data.displays.map(dd => `${dd.name || "Display"}${dd.internal ? " (built-in)" : ""}`).join(", ")})</Detail>}
            {tele.data?.touchscreenDevices?.length > 0 && <Detail label="Touchscreens connected" info="Touchscreen input devices detected.">{tele.data.touchscreenDevices.length} ({tele.data.touchscreenDevices.join(", ")})</Detail>}
            {tele.data?.audioOutputDevice && (
              <Detail label="Audio output" info="Active audio output device and volume.">{tele.data.audioOutputDevice}{tele.data.audioOutputVolume != null ? ` (${tele.data.audioOutputVolume}%)` : ""}{tele.data.audioOutputMute ? " · Muted" : ""}</Detail>
            )}
            {tele.data?.audioInputDevice && (
              <Detail label="Audio input" info="Active microphone and gain level.">{tele.data.audioInputDevice}{tele.data.audioInputGain != null ? ` (${tele.data.audioInputGain}% gain)` : ""}{tele.data.audioInputMute ? " · Muted" : ""}</Detail>
            )}
            {tele.data?.usbPeripherals?.length > 0 && <Detail label="Peripherals connected" info="USB peripherals currently attached.">{tele.data.usbPeripherals.length} ({tele.data.usbPeripherals.join(", ")})</Detail>}
          </div>
          </DeviceSection>
          <DeviceSection template={template} icon="clock" title="Boot performance" info="From the Chrome Management Telemetry API - requires the device to have reported a boot event since telemetry reporting was enabled.">
          {tele.error ? (
            <p className="empty-note">Not authorized yet.</p>
          ) : tele.loading ? (
            <p className="empty-note">Loading...</p>
          ) : (
            <div className="device-detail">
              {tele.data?.bootUpDurationSeconds != null && <Detail label="Last boot up duration" info="Time the device took to boot on its last startup.">{`${tele.data.bootUpDurationSeconds}s`}</Detail>}
              {tele.data?.lastShutdownTime && (
                <Detail label="Last shutdown" info="When the device last shut down, and how long it took.">
                  {new Date(tele.data.lastShutdownTime).toLocaleString()}
                  {tele.data.lastShutdownDurationSeconds ? ` (${tele.data.lastShutdownDurationSeconds}s)` : ""}
                </Detail>

                        {geoAddress.state && <p style={{margin:"0 0 3px", fontSize:12, color:"var(--text-faint)"}}>{geoAddress.state}</p>}
                        {geoAddress.country && <p style={{margin:0, fontSize:12, color:"var(--text-faint)"}}>{geoAddress.country}</p>}
                      </>
                    ) : <p style={{margin:0, fontSize:12, color:"var(--text-faint)"}}>Resolving...</p>}
                  </div>
                </div>
              </div>

              {/* Textual list view of the same real d.locationHistory the
                  map trail line above is already drawn from (last 50 real
                  pings, backend/main.go:2126-2128) - newest first, so the
                  history is readable as data, not just a line on the map. */}
              {d.locationHistory && d.locationHistory.length > 0 && (
                <div style={{marginTop:4}}>
                  <p className="device-detail-label" style={{marginBottom:8, display:"flex", alignItems:"center", gap:4}}>
                    Location history ({d.locationHistory.length} ping{d.locationHistory.length === 1 ? "" : "s"})
                    <InfoDot text="Every real ping this device has sent, newest first (oldest ones roll off past 50). Click View to open that exact point in Google Maps - useful for confirming exactly where/when a device actually was, not just its current position." />
                  </p>
                  <div className="scroll-list" style={{maxHeight:280}}>
                    <table style={{width:"100%", borderCollapse:"collapse", fontSize:13}}>
                      <thead>
                        <tr style={{textAlign:"left", color:"var(--text-faint)", fontSize:11, textTransform:"uppercase", letterSpacing:0.5}}>

          ) : (
            <div style={{padding:"32px 0", textAlign:"center"}}>
              <p style={{fontSize:32, margin:"0 0 12px"}}>📍</p>
              <p className="device-detail-label" style={{marginBottom:6}}>No location reported yet</p>

            </div>
          )}

          {/* Real state-transition timeline - server-observed
              ws_online/ws_offline (the exact same signal the Devices
              table's Live check-in column reads) interleaved with
              extension-reported idle_active/idle_idle/idle_locked (see
              handleIdleState on the backend) - the only way any of these
              idle/locked entries can exist at all, since nothing server-
              side can see chrome.idle state on its own. Deliberately
              rendered here, OUTSIDE the trackedLocationLat ternary above -
              a device can have real connectivity history (WS connects,
              idle transitions) well before it ever gets a GPS/Wi-Fi fix, or
              even if it never does, so this must never be hidden behind
              "has location data." A gap between entries with no event
              marking it is the closest available signal for a full system
              sleep, since Chrome extensions have no API that observes
              suspend directly. */}
          {d.connectivityHistory && d.connectivityHistory.length > 0 && (
            <div style={{marginTop:20}}>
              <p className="device-detail-label" style={{marginBottom:8, display:"flex", alignItems:"center", gap:4}}>

                <InfoDot text="A real timeline of this device's connectivity/activity state - ws_online/ws_offline come from the server the instant the extension's live WebSocket connects or drops (same signal as the Devices table's Live check-in column); idle/active/locked come from the extension's own chrome.idle API, reported in specifically because the server can't observe that on its own. A long gap with nothing logged usually means the device was fully asleep (Chrome extensions have no API to detect that directly, only its absence of activity)." />
              </p>
              <div className="scroll-list" style={{maxHeight:280}}>
                <table style={{width:"100%", borderCollapse:"collapse", fontSize:13}}>

          {/* Second, independently-sourced location - derived from the

      {sub === "usage" && (

            <Detail label="Last enrolled" info="When the device was most recently re-enrolled.">{d.lastEnrollmentTime ? new Date(d.lastEnrollmentTime).toLocaleDateString() : null}</Detail>
          </div>
          <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginTop:18, marginBottom:6}}>

          {editingAssetInfo ? (

                  <span className="device-detail-label" style={{margin:0}}>Order #</span>
                  <input type="text" value={editingAssetInfo.orderNumber}
                    onChange={e => setEditingAssetInfo(v => ({ ...v, orderNumber: e.target.value }))}
                    style={{fontSize:13, padding:"5px 7px"}} />
