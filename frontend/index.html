}

function SettingsPanel({ intervalSeconds, intervalChoice, customMinutes, onIntervalChoiceChange, onCustomMinutesSubmit, setCustomMinutes, isAdmin, theme, setTheme, template, setTemplate, glass, setGlass }) {
  const [thresholds, setThresholds] = useState(null);
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  // Which Fleet insights/Dashboard sub-section it opens on next time the
  // panel is mounted (page load or first visit that session) - the panel
  // itself only reads this once at mount, so changing it here has no
  // visible effect until the next reload, by design. Options depend on the
  // active template since Halofort groups the same six sections into three
  // combined tabs (see HALOFORT_INSIGHTS_GROUPS) - showing the other
  // theme's six keys here would let you pick a value Halofort can't use.
  const insightsSections = template === "halofort" ? HALOFORT_INSIGHTS_GROUPS : INSIGHTS_SECTIONS;
  const [insightsDefaultTab, setInsightsDefaultTab] = useState(() => {
    const stored = localStorage.getItem(INSIGHTS_DEFAULT_TAB_KEY);
    return insightsSections.some(s => s.key === stored) ? stored : insightsSections[0].key;
  });
  const onInsightsDefaultTabChange = e => {
    setInsightsDefaultTab(e.target.value);
    localStorage.setItem(INSIGHTS_DEFAULT_TAB_KEY, e.target.value);
  };

  // Auto-cycle controls - actual state/timer live inside FleetHealthPanel
  // (it stays mounted for the session, unlike this Settings panel which is
  // just a config surface), synced live via INSIGHTS_SETTINGS_EVENT so
  // toggling it here takes effect immediately, not just on next reload.
  const [autoCycle, setAutoCycle] = useState(() => localStorage.getItem(INSIGHTS_AUTOCYCLE_KEY) === "true");
  const savedInterval = Number(localStorage.getItem(INSIGHTS_AUTOCYCLE_INTERVAL_KEY)) || 10;
  const [cycleChoice, setCycleChoice] = useState(() => CYCLE_INTERVAL_PRESETS.includes(savedInterval) ? savedInterval : "custom");
  const [customCycleSec, setCustomCycleSec] = useState(CYCLE_INTERVAL_PRESETS.includes(savedInterval) ? "" : String(savedInterval));

  const onAutoCycleToggle = () => {
    const next = !autoCycle;
    setAutoCycle(next);
    localStorage.setItem(INSIGHTS_AUTOCYCLE_KEY, String(next));
    window.dispatchEvent(new CustomEvent(INSIGHTS_SETTINGS_EVENT));
  };

  const onCycleChoiceChange = e => {
    const v = e.target.value;
    if (v === "custom") { setCycleChoice("custom"); return; }
    const n = Number(v);
    setCycleChoice(n);
    localStorage.setItem(INSIGHTS_AUTOCYCLE_INTERVAL_KEY, String(n));
    window.dispatchEvent(new CustomEvent(INSIGHTS_SETTINGS_EVENT));
  };

  const onCustomCycleSubmit = e => {
    e.preventDefault();
    const n = Number(customCycleSec);
    if (!n || n <= 0) return;
    localStorage.setItem(INSIGHTS_AUTOCYCLE_INTERVAL_KEY, String(n));
    window.dispatchEvent(new CustomEvent(INSIGHTS_SETTINGS_EVENT));
  };

  useEffect(() => {
    apiFetch(`${API}/thresholds`).then(r => r.json()).then(setThresholds);
  }, []);

  const updateField = (field, value) => {
    setThresholds(t => ({ ...t, [field]: value }));
    setSaved(false);
  };

  const save = async (e) => {
    e.preventDefault();
    setSaving(true);
    const res = await apiFetch(`${API}/thresholds`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(thresholds),
    });
    if (res.ok) setSaved(true);
    setSaving(false);
  };

  return (
    <>
      <div className="card">
        <h3 className="card-title">Appearance</h3>
        <div style={{display:"flex", flexWrap:"wrap", gap:"16px 28px"}}>
          <label style={{fontSize:12, display:"flex", flexDirection:"column", gap:5}}>
            <span style={{color:"var(--text-muted)"}}>Theme template</span>
            <select className="theme-toggle" value={template} onChange={e => setTemplate(e.target.value)}>
              {THEME_TEMPLATES.map(t => <option key={t.key} value={t.key}>{t.name}</option>)}
            </select>
          </label>
          <label style={{fontSize:12, display:"flex", flexDirection:"column", gap:5}}>
            <span style={{color:"var(--text-muted)"}}>Light/dark mode</span>
            <select className="theme-toggle" value={theme} onChange={e => setTheme(e.target.value)}>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
              <option value="system">System</option>
            </select>
          </label>
          <label style={{fontSize:12, display:"flex", flexDirection:"column", gap:5}} title="Ambient glow background + translucent glass cards. Off reverts to the original flat look.">
            <span style={{color:"var(--text-muted)"}}>Glass finish</span>
            <span className="glass-switch" style={{height:30}}><input type="checkbox" checked={glass} onChange={e => setGlass(e.target.checked)} /></span>
          </label>
        </div>
      </div>
      <div className="card">
        <h3 className="card-title">{template === "halofort" ? "Dashboard" : "Fleet insights"}<InfoDot text="Preferences for this tab. Moved here to keep its own toolbar focused on content instead of settings." /></h3>
        <div style={{display:"flex", flexWrap:"wrap", alignItems:"flex-end", gap:"16px 28px"}}>
          <label style={{fontSize:12, display:"flex", flexDirection:"column", gap:5}}>
            <span style={{color:"var(--text-muted)"}}>Default tab on open</span>
            <select value={insightsDefaultTab} onChange={onInsightsDefaultTabChange} style={{fontSize:12, padding:"4px 6px"}}>
              {insightsSections.map(s => <option key={s.key} value={s.key}>{s.label}</option>)}
            </select>
          </label>
          <label style={{fontSize:12, display:"flex", flexDirection:"column", gap:5, cursor:"pointer"}}>
            <span style={{color:"var(--text-muted)"}}>Auto-cycle tabs</span>
            <span style={{height:24, display:"flex", alignItems:"center"}}><input type="checkbox" checked={autoCycle} onChange={onAutoCycleToggle} /></span>
          </label>
          {autoCycle && (
            <label style={{fontSize:12, display:"flex", flexDirection:"column", gap:5}}>
              <span style={{color:"var(--text-muted)"}}>Cycle every</span>
              <select value={cycleChoice} onChange={onCycleChoiceChange} style={{fontSize:12, padding:"4px 6px"}}>
                {CYCLE_INTERVAL_PRESETS.map(s => <option key={s} value={s}>{s}s</option>)}
                <option value="custom">Custom</option>
              </select>
            </label>
          )}
          {autoCycle && cycleChoice === "custom" && (
            <form onSubmit={onCustomCycleSubmit} style={{display:"flex", alignItems:"flex-end", gap:8}}>
              <label style={{fontSize:12, display:"flex", flexDirection:"column", gap:5}}>
                <span style={{color:"var(--text-muted)"}}>Custom seconds</span>
                <input type="number" min="1" placeholder="seconds" value={customCycleSec} onChange={e => setCustomCycleSec(e.target.value)} style={{width:80, fontSize:12, padding:"4px 6px"}} />
              </label>
              <button type="submit" style={{fontSize:12, padding:"4px 10px"}}>Set</button>
            </form>
          )}
        </div>
        <p className="card-footnote" style={{marginTop:10, marginBottom:0}}>"Default tab on open" takes effect the next time the tab loads (page refresh or first visit that session), not immediately.</p>
      </div>
      <div className="card">
        <h3 className="card-title">Auto-sync<InfoDot text="How often this portal automatically pulls the device/user list from Google in the background. Sync now (header) always runs immediately regardless of this interval. &quot;Always&quot; syncs roughly every 30 seconds - the fastest offered, since going much faster risks tripping Google's Directory API rate limits, especially on larger fleets." /></h3>
        {!isAdmin && <p className="empty-note" style={{color:"var(--critical-text)", marginBottom:8}}>Requires admin role to change.</p>}
        <fieldset disabled={!isAdmin} style={{border:"none", padding:0, margin:0}}>
        <div style={{display:"flex", flexWrap:"wrap", alignItems:"flex-end", gap:"16px 28px"}}>
          <label style={{fontSize:12, display:"flex", flexDirection:"column", gap:5}}>
            <span style={{color:"var(--text-muted)"}}>Sync interval</span>
            <select value={intervalChoice} onChange={onIntervalChoiceChange} style={{fontSize:12, padding:"4px 6px"}}>
              {SYNC_PRESETS.map(p => <option key={p.seconds} value={p.seconds}>{p.label}</option>)}
              <option value="custom">Custom</option>
            </select>
          </label>
          {intervalChoice === "custom" && (
            <form onSubmit={onCustomMinutesSubmit} style={{display:"flex", alignItems:"flex-end", gap:8}}>
              <label style={{fontSize:12, display:"flex", flexDirection:"column", gap:5}}>
                <span style={{color:"var(--text-muted)"}}>Custom minutes</span>
                <input
                  type="number"
                  min="1"
                  placeholder="minutes"
                  value={customMinutes}
                  onChange={e => setCustomMinutes(e.target.value)}
                  style={{width:80, fontSize:12, padding:"4px 6px"}}
                />
              </label>
              <button type="submit" style={{fontSize:12, padding:"4px 10px"}}>Set</button>
            </form>
          )}
        </div>
        </fieldset>
        <p className="empty-note" style={{marginTop:10}}>Currently syncing every {formatSyncInterval(intervalSeconds)}.</p>
      </div>

      <div className="card">
        <h3 className="card-title">Insight thresholds<InfoDot text="Cutoffs used by the Fleet insights warning cards (stale devices, low disk/memory, hot CPU, outdated TPM) - change these to tune what counts as a warning." /></h3>
        {!isAdmin && <p className="empty-note" style={{color:"var(--critical-text)", marginBottom:8}}>Requires admin role to change.</p>}
        {!thresholds ? <p className="empty-note">Loading...</p> : (
          <form onSubmit={save}>
            <fieldset disabled={!isAdmin} style={{border:"none", padding:0, margin:0}}>
            <div style={{display:"flex", flexWrap:"wrap", gap:"16px 28px", marginBottom:14}}>
              <label style={{fontSize:12, display:"flex", flexDirection:"column", gap:5}}>
                <span style={{color:"var(--text-muted)"}}>Stale after (days)</span>
                <input type="number" min="1" value={thresholds.staleAfterDays}
                  onChange={e => updateField("staleAfterDays", Number(e.target.value))}
                  style={{width:80, fontSize:13, padding:"4px 6px"}} />
              </label>
              <label style={{fontSize:12, display:"flex", flexDirection:"column", gap:5}}>
                <span style={{color:"var(--text-muted)"}}>Online after (minutes)</span>
                <input type="number" min="1" value={thresholds.onlineAfterMinutes}
                  onChange={e => updateField("onlineAfterMinutes", Number(e.target.value))}
                  style={{width:80, fontSize:13, padding:"4px 6px"}} />
              </label>
              <label style={{fontSize:12, display:"flex", flexDirection:"column", gap:5}}>
                <span style={{color:"var(--text-muted)"}}>Low disk space (% free)</span>
                <input type="number" min="1" max="100" value={thresholds.lowStoragePercent}
                  onChange={e => updateField("lowStoragePercent", Number(e.target.value))}
                  style={{width:80, fontSize:13, padding:"4px 6px"}} />
              </label>
              <label style={{fontSize:12, display:"flex", flexDirection:"column", gap:5}}>
                <span style={{color:"var(--text-muted)"}}>Low memory (% free)</span>
                <input type="number" min="1" max="100" value={thresholds.lowRamPercent}
                  onChange={e => updateField("lowRamPercent", Number(e.target.value))}
                  style={{width:80, fontSize:13, padding:"4px 6px"}} />
              </label>
              <label style={{fontSize:12, display:"flex", flexDirection:"column", gap:5}}>
                <span style={{color:"var(--text-muted)"}}>Hot CPU (&deg;C)</span>
                <input type="number" min="1" value={thresholds.hotCpuTempCelsius}
                  onChange={e => updateField("hotCpuTempCelsius", Number(e.target.value))}
                  style={{width:80, fontSize:13, padding:"4px 6px"}} />
              </label>
              <label style={{fontSize:12, display:"flex", flexDirection:"column", gap:5}}>
                <span style={{color:"var(--text-muted)"}}>Outdated TPM family</span>
                <input type="text" value={thresholds.outdatedTpmFamily}
                  onChange={e => updateField("outdatedTpmFamily", e.target.value)}
                  style={{width:110, fontSize:13, padding:"4px 6px"}} />
              </label>
            </div>
            <button type="submit" disabled={saving}>{saving ? "Saving..." : "Save thresholds"}</button>
            {saved && <span style={{fontSize:12, color:"var(--active-text)", marginLeft:8}}>Saved.</span>}
            </fieldset>
          </form>
        )}
      </div>
    </>
  );
}

const DASHBOARD_TAB_KEY = "cc_dashboard_tab";
// BUILD_DATE: an honest "dev build" indicator for the Halofort sidebar
// footer (today's date, computed once when the page loads) - not a
// fabricated copy of Halofort's own internal build/version numbering
// scheme, which this prototype has no real equivalent of.
const BUILD_DATE = new Date().toISOString().slice(0, 10);
const DASHBOARD_TABS = ["devices", "insights", "activity", "directory", "reports", "enrollment", "security", "settings", "setup"];

// DASHBOARD_SECTIONS: the single source of truth for the tab list, shared
// by both the default top .tab-bar and Halofort's left sidebar nav - one
// array driving both instead of two separately-maintained button lists.
const DASHBOARD_SECTIONS = [
  { key: "devices", label: "Devices", icon: "nav_devices" },
  { key: "insights", label: "Fleet insights", icon: "nav_insights" },
  { key: "activity", label: "Activity", icon: "nav_activity" },
  { key: "directory", label: "Directory", icon: "nav_directory" },
  { key: "reports", label: "Reports", icon: "nav_reports" },
  { key: "enrollment", label: "Enrollment", icon: "nav_enrollment" },
  { key: "security", label: "Security", icon: "nav_security" },
  { key: "settings", label: "Settings", icon: "nav_settings" },
];

function DeviceDashboard({ status, refreshStatus, role, jumpToTab, onJumpConsumed, onViewActivity, onActionResult, template, theme, setTheme, setTemplate, glass, setGlass, language, setLanguage, auth, activityCount, onLogout }) {
  const canOperate = role === "operator" || role === "admin"; // sync, restart
  const isAdmin = role === "admin"; // wipe, disconnect, settings writes
  // Persisted so a browser refresh lands back on whichever tab was open
  // instead of always resetting to Devices - validated against the actual
  // known tab keys so a stale/corrupted value can't leave the dashboard on
  // a tab with no matching button highlighted.
  const [tab, setTab] = useState(() => {
    const stored = localStorage.getItem(DASHBOARD_TAB_KEY);
    if (DASHBOARD_TABS.includes(stored)) return stored;
    // First-ever visit (nothing stored yet): Halofort's own landing page is
    // Fleet insights, not the Devices table - every other template keeps
    // Devices as the default it's always had.
    return template === "halofort" ? "insights" : "devices";
  });
  useEffect(() => { localStorage.setItem(DASHBOARD_TAB_KEY, tab); }, [tab]);
  // Halofort-only UI state: sidebar icon-only collapse (hamburger toggle)
  // and the avatar dropdown (Logout only - no Tenant/Profile since this
  // portal has no such concepts).
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [avatarMenuOpen, setAvatarMenuOpen] = useState(false);
  const [languageMenuOpen, setLanguageMenuOpen] = useState(false);
  const [isFullscreen, setIsFullscreen] = useState(false);
  React.useEffect(() => {
    const onChange = () => setIsFullscreen(!!document.fullscreenElement);
    document.addEventListener("fullscreenchange", onChange);
    return () => document.removeEventListener("fullscreenchange", onChange);
  }, []);
  const toggleFullscreen = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  };
  // .halofort-shell is position:fixed (pinned straight to the viewport,
  // independent of body's padding/#root's width/any vh rounding - the
  // actual robust fix, after a few rounds of CSS arithmetic that kept
  // landing a pixel or two off). Since a fixed element can't itself make
  // body scrollable, this is belt-and-suspenders: force body's own scroll
  // off outright while this shell is showing, and restore it the moment
  // it isn't (leaving every other template's normal page scroll untouched).
  useEffect(() => {
    if (template !== "halofort") return;
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.body.style.overflow = prevOverflow; };
  }, [template]);
  // Once a tab has been visited, its panel stays mounted (just hidden via
  // CSS) instead of being unmounted on tab switch - confirmed live that
  // unmounting was destroying each panel's already-fetched data (alerts,
  // audit log, policies, admin roles, etc), forcing a full re-fetch of
  // several slow sequential API calls every time you switched back to a
  // tab you'd already visited. First visit still fetches lazily; every
  // visit after that is instant.
  // Every tab starts "visited" (mounted) as soon as this dashboard itself
  // mounts - which only happens once already connected - instead of only
  // the first tab a user actually clicks. Each panel's own fetch-on-mount
  // effect is untouched; this just means that effect fires right after
  // connecting instead of waiting for a click, so by the time someone
  // switches to e.g. Security the data's likely already loaded instead of
  // showing "Loading..." there for the first time. Panels stay mounted
  // (hidden via CSS) after that exactly as before.
  const [visitedTabs, setVisitedTabs] = useState({
    devices: true, insights: true, activity: true, directory: true,
    reports: true, enrollment: true, security: true, settings: true,
  });
  const goToTab = (t) => { setTab(t); setVisitedTabs(v => v[t] ? v : { ...v, [t]: true }); };

  // jumpToTab: set by the header bell (in App(), outside this component) to
  // request a tab switch from outside - e.g. tapping the bell should land
  // on Activity regardless of whichever tab is currently open here. Consumed
  // once and cleared via onJumpConsumed so it doesn't keep re-firing.
  useEffect(() => {
    if (jumpToTab) {
      goToTab(jumpToTab);
      if (onJumpConsumed) onJumpConsumed();
    }
  }, [jumpToTab]);

  // Tells App() the user is actually looking at Activity right now (not
  // just that it's mounted in the background, which happens for every tab
  // as soon as this dashboard connects) - that's the real "read" signal the
  // header bell's unread count should clear on.
  useEffect(() => {
    if (tab === "activity" && onViewActivity) onViewActivity();
  }, [tab]);
  const [devices, setDevices] = useState([]);
  const [insights, setInsights] = useState(null);
  const [expandedDeviceId, setExpandedDeviceId] = useState(null);
  const [telemetry, setTelemetry] = useState({}); // deviceId -> {data} | {error} | {loading}
  // insightFilter: when set from a MetricCard "View all" click, the Devices
  // table narrows to only the devices in that insight card. Cleared by the
  // banner's "Clear filter" button or by navigating away from Devices tab.
  const [insightFilter, setInsightFilter] = useState(null); // {label, ids: Set}
  // deviceTypeFilter: "all" | "chromeos" | "mobile" - which of the two
  // device tables show on the Devices tab. Kept as one filter above both
  // rather than merging them into a single table: ChromeOS devices carry
  // org-unit/policy/sync-status concepts mobile devices don't have (and vice
  // versa for OS/approval status), so a merged table would be mostly dashes
  // either way - this keeps each table's real columns intact while still
  // letting an admin narrow the tab to just the fleet they care about.
  const [deviceTypeFilter, setDeviceTypeFilter] = useState("all");

  // Telemetry is a separate, newer API (Chrome Management Telemetry) from
  // the device list - fetched only once per device, only when its detail
  // panel is actually expanded, not for every row on every load.
  useEffect(() => {
    if (!expandedDeviceId || telemetry[expandedDeviceId]) return;
    setTelemetry(t => ({ ...t, [expandedDeviceId]: { loading: true } }));
    apiFetch(`${API}/devices/telemetry?id=${expandedDeviceId}`)
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
      .then(data => setTelemetry(t => ({ ...t, [expandedDeviceId]: { data } })))
      .catch(e => setTelemetry(t => ({ ...t, [expandedDeviceId]: { error: e.message } })));
  }, [expandedDeviceId]);
  const [actionState, setActionState] = useState({}); // deviceId -> {action, status: pending|complete|error, error}
  const [refreshingIds, setRefreshingIds] = useState(() => new Set()); // deviceId -> in-flight single-device Google refresh
  const [showConnInfo, setShowConnInfo] = useState(false); // toggles the "Connection details" panel (Client ID, Customer ID, scopes, etc.)
  const [appCatalog, setAppCatalog] = useState({}); // appId -> {displayName, appType, appSource, homepageUri} - see the chrome-reports fetch below

  // Bulk org-unit move: select N devices, move them all in one API call
  // (Chromeosdevices.MoveDevicesToOu) instead of moving each one at a time
  // from its own detail panel - the batch-move endpoint this backs.
  const [selectedIds, setSelectedIds] = useState(() => new Set());
  const [bulkOrgUnit, setBulkOrgUnit] = useState("");
  const [bulkMoveState, setBulkMoveState] = useState(null); // {status: pending|complete|error, error}
  const toggleSelected = (id) => setSelectedIds(prev => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });
  const toggleSelectAll = () => setSelectedIds(prev => prev.size === devices.length ? new Set() : new Set(devices.map(d => d.id)));
  const submitBulkMove = async (e) => {
    e.preventDefault();
    setBulkMoveState({ status: "pending" });
    try {
      const res = await apiFetch(`${API}/devices/batch-move`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ids: [...selectedIds], orgUnit: bulkOrgUnit }),
      });
      if (!res.ok) throw new Error(await res.text());
      setDevices(ds => ds.map(d => selectedIds.has(d.id) ? { ...d, orgUnit: bulkOrgUnit } : d));
      setBulkMoveState({ status: "complete" });
      setSelectedIds(new Set());
      setBulkOrgUnit("");
    } catch (err) {
      setBulkMoveState({ status: "error", error: err.message || "Move failed" });
    }
  };
  const [disconnecting, setDisconnecting] = useState(false);
  const [syncing, setSyncing] = useState(false);
  const [intervalSeconds, setIntervalSeconds] = useState(15 * 60);
  const [intervalChoice, setIntervalChoice] = useState(15 * 60);
  const [customMinutes, setCustomMinutes] = useState("");

  const disconnect = async () => {
    setDisconnecting(true);
    await apiFetch(`${API}/disconnect`, { method: "POST" });
    setDisconnecting(false);
    refreshStatus();
  };

  const loadDevices = () => apiFetch(`${API}/devices`).then(r => r.json()).then(setDevices);
  const loadInsights = () => apiFetch(`${API}/insights`).then(r => r.json()).then(setInsights);

  // syncCooldownSecs mirrors the backend's own minManualSyncCooldown guard
  // (429 + Retry-After when synced too recently) - a real enforced limit,
  // not just a client-side nicety, so this only reflects what the server
  // actually decided rather than a separate arbitrary timer that could
  // drift out of sync with it.
  const [syncCooldownSecs, setSyncCooldownSecs] = useState(0);
  useEffect(() => {
    if (syncCooldownSecs <= 0) return;
    const t = setTimeout(() => setSyncCooldownSecs(s => Math.max(0, s - 1)), 1000);
    return () => clearTimeout(t);
  }, [syncCooldownSecs]);

  const syncNow = async () => {
    setSyncing(true);
    const res = await apiFetch(`${API}/sync`, { method: "POST" });
    if (res.status === 429) {
      setSyncCooldownSecs(parseInt(res.headers.get("Retry-After") || "30", 10));
      setSyncing(false);
      return;
    }
    await loadDevices();
    await loadInsights();
    refreshStatus();
    setSyncing(false);
  };

  const loadSyncSettings = () =>
    apiFetch(`${API}/sync/settings`).then(r => r.json()).then(s => {
      const isPreset = SYNC_PRESETS.some(p => p.seconds === s.intervalSeconds);
      setIntervalSeconds(s.intervalSeconds);
      setIntervalChoice(isPreset ? s.intervalSeconds : "custom");
      if (!isPreset) setCustomMinutes(String(Math.round(s.intervalSeconds / 60)));
    });

  const applyInterval = async (seconds) => {
    if (!seconds || seconds < minSyncIntervalSecs) return;
    await apiFetch(`${API}/sync/settings`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ intervalSeconds: seconds }),
    });
    setIntervalSeconds(seconds);
  };

  const onIntervalChoiceChange = (e) => {
    const value = e.target.value;
    setIntervalChoice(value === "custom" ? "custom" : Number(value));
    if (value !== "custom") applyInterval(Number(value));
  };

  const onCustomMinutesSubmit = (e) => {
    e.preventDefault();
    applyInterval(Number(customMinutes) * 60);
  };

  useEffect(() => {
    loadDevices();
    loadInsights();
    loadSyncSettings();
    // Fetched once, shared by every device's Apps tab below - resolves the
    // raw extension-ID/package-name strings device-level telemetry reports
    // (e.g. "mgndgikekgjfcpckkfioiadnlibdjbkf") into the friendly names
    // Admin console shows, by matching against the fleet-wide installed-apps
    // report (chrome.management.reports.readonly), which is the one Chrome
    // Management endpoint that actually carries a name for each app ID.
    apiFetch(`${API}/chrome-reports`).then(r => r.ok ? r.json() : null).then(data => {
      if (!data) return;
      const catalog = {};
      [...(data.installedApps || []), ...(data.androidApps || [])].forEach(a => { catalog[a.appId] = a; });
      setAppCatalog(catalog);
    }).catch(() => {});
    const t = setInterval(loadDevices, 3000);
    const ti = setInterval(loadInsights, 4000);
    return () => { clearInterval(t); clearInterval(ti); };
  }, []);

  // runAction resolves with the action's final {status, error, result} once
  // it completes (not just once the initial POST is accepted) - needed so
  // runDeprovision below can wait for deprovision to actually finish before
  // deciding whether to also fire a factory reset.
  const runAction = (deviceId, action, payload) => {
    setActionState(s => ({ ...s, [deviceId]: { action, status: "pending" } }));
    return (async () => {
      const res = await apiFetch(`${API}/devices/action?id=${deviceId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, payload }),
      });
      if (!res.ok) {
        const errText = await res.text();
        const failed = { action, status: "error", error: errText || "Failed" };
        setActionState(s => ({ ...s, [deviceId]: failed }));
        if (onActionResult) onActionResult();
        return failed;
      }
      const act = await res.json();
      return new Promise(resolve => {
        const check = async () => {
          const r = await apiFetch(`${API}/actions?id=${act.id}`);
          const a = await r.json();
          if (a.status === "complete" || a.status === "error") {
            const done = { action, status: a.status, error: a.error, result: a.result };
            setActionState(s => ({ ...s, [deviceId]: done }));
            if (onActionResult) onActionResult();
            resolve(done);
          } else {
            setTimeout(check, 500);
          }
        };
        check();
      });
    })();
  };

  // refreshDeviceRow: a live, single-device Chromeosdevices.Get instead of
  // waiting for the next fleet-wide sync - narrows this portal's own
  // contribution to the Connection/Last seen gap on demand. Can't make
  // Google's own device-to-cloud sync happen any sooner (that's on the
  // device/Chrome policy's own schedule), so this is a "check what Google
  // knows right now" button, not a way to force a device to check in.
  const refreshDeviceRow = async (deviceId) => {
    setRefreshingIds(s => new Set(s).add(deviceId));
    try {
      const r = await apiFetch(`${API}/devices/refresh?id=${deviceId}`, { method: "POST" });
      if (r.ok) {
        const fresh = await r.json();
        setDevices(list => list.map(d => d.id === deviceId ? fresh : d));
      }
    } catch (e) { /* leave the row as-is on failure */ }
    setRefreshingIds(s => { const next = new Set(s); next.delete(deviceId); return next; });
  };

  const runDeployTracker = async (deviceId, orgUnitPath) => {
    setActionState(s => ({ ...s, [deviceId]: { action: "deploy_tracker", status: "pending" } }));
    const payload = {
      orgUnitPath: orgUnitPath || "/",
      schemaName: "chrome.users.apps.InstallType",
      appId: "chrome:edlpnpedboiammdpngpihpgmaibbdloo",
      value: { "appInstallType": "FORCED" }
    };
    const res = await apiFetch(`${API}/policies/set`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const errText = await res.text();
      const failed = { action: "deploy_tracker", status: "error", error: errText || "Failed" };
      setActionState(s => ({ ...s, [deviceId]: failed }));
      return failed;
    }
    const done = { action: "deploy_tracker", status: "complete", result: "Extension force-installed to " + (orgUnitPath || "/") };
    setActionState(s => ({ ...s, [deviceId]: done }));
    if (onActionResult) onActionResult();
    return done;
  };

  // runDeprovision matches Admin console's own deprovision dialog, which
  // defaults to bundling a factory reset with the deprovision (confirmed
  // against the real dialog - "Yes, Factory Reset" is its pre-selected
  // option) - our two actions already exist separately (deprovision via
  // BatchChangeStatus, powerwash via issueCommand), so this sequences them
  // the same way instead of leaving deprovision as status-only, which
  // looked like "nothing happened" on the device itself even though the
  // server-side status genuinely had changed.
  //
  // Powerwash MUST go first. Confirmed live: handleDeviceAction on
  // deprovision's completion deletes the device from this portal's own
  // in-memory store (to mirror what a real sync would show afterward), and
  // every action request - including a follow-up powerwash - requires the
  // device to still be in that store. Deprovision-then-powerwash meant the
  // powerwash call 404'd instantly ("device not found") before ever
  // reaching Google's real command API, so the on-device factory reset
  // silently never happened even though "Deprovision" showed as complete.
  // Sending the reset command while the device is still fully active also
  // matches the semantics: a device already marked deprovisioned in
  // Google's own system may not honor further remote commands at all.
  const runDeprovision = async (deviceId, alsoFactoryReset) => {
    if (alsoFactoryReset) {
      const wipeResult = await runAction(deviceId, "powerwash");
      if (wipeResult.status === "error") return; // don't deprovision a device the reset command couldn't even reach
    }
    await runAction(deviceId, "deprovision");
  };

  // runDisable matches Admin console's own Disable dialog, which offers the
  // same choice: "Disable With Lock Screen" (device stays enrolled, just
  // locked - the default) or "Disable With Factory Reset" (also wipes it).
  // Disable itself is always the same BatchChangeStatus call either way;
  // the factory-reset option just additionally sequences a powerwash after,
  // same pattern as runDeprovision above.
  const runDisable = async (deviceId, alsoFactoryReset) => {
    const result = await runAction(deviceId, "disable");
    if (alsoFactoryReset && result.status !== "error") {
      await runAction(deviceId, "powerwash");
    }
  };

  return (
    <div className={template === "halofort" ? "halofort-shell" : undefined}>
      {template === "halofort" && (
        <aside className={`halofort-sidebar ${sidebarCollapsed ? "collapsed" : ""}`}>
          <div className="halofort-sidebar-logo"><HalofortLogo size={24} showWordmark={!sidebarCollapsed} /></div>
          <nav className="halofort-nav">
            {/* "Initial Setup" only exists in the sidebar, not the default
                top tab-bar - it's what the always-visible connector status
                card becomes here (see the render gate below), matching the
                reference's own "Initial Setup" nav item. Enrollment is
                folded into it too (both are "get a new device/portal up
                and running" tasks) rather than kept as its own nav item -
                its own content still renders, just gated on tab==="setup"
                instead of a dedicated button. */}
            {[{ key: "setup", label: "Initial Setup", icon: "nav_setup" }, ...DASHBOARD_SECTIONS.filter(s => s.key !== "enrollment").map(s => s.key === "insights" ? { ...s, label: "Dashboard" } : s)].map(s => (
              <button key={s.key} className={`halofort-nav-item ${tab === s.key ? "active" : ""}`} onClick={() => goToTab(s.key)} title={sidebarCollapsed ? t(s.label, language) : undefined}>
                <ActionIcon name={s.icon} />
                {!sidebarCollapsed && <span>{t(s.label, language)}</span>}
                {!sidebarCollapsed && <span className="halofort-nav-chevron">&rsaquo;</span>}
              </button>
            ))}
          </nav>
        </aside>
      )}
      <div className={template === "halofort" ? "halofort-main" : undefined}>
      {template === "halofort" && (
        <div className="halofort-topbar">
          <button className="halofort-topbar-icon" title="Collapse menu" onClick={() => setSidebarCollapsed(v => !v)}>
            <ActionIcon name="menu" />
          </button>
          <div className="halofort-topbar-cluster" style={{display:"flex", alignItems:"center", gap:4}}>
            {status.status === "active" && (
              <button onClick={() => goToTab("activity")} className="halofort-topbar-icon" style={{position:"relative"}}
                title={`${activityCount} recent device event${activityCount === 1 ? "" : "s"} - view Activity`}>
                <ActionIcon name="bell" />
                {activityCount > 0 && (
                  // Absolutely positioned, right-anchored: it only ever grows
                  // leftward into the bell icon's own button as the count
                  // gains digits (1 -> 99+), never rightward toward the next
                  // topbar icon - so the other icons' size/spacing/alignment
                  // is unaffected no matter how large the count gets. A
                  // single digit gets a fixed square box (true circle, not
                  // stretched into a horizontal oval); only 2+ digits switch
                  // to auto-width so "99+" has room without squashing.
                  <span style={{position:"absolute", top:-3, right:-3, zIndex:1, background:"var(--critical-text)", color:"#fff", borderRadius:activityCount > 9 ? 8 : "50%", fontSize:9, fontWeight:700, lineHeight:1, width: activityCount > 9 ? "auto" : 15, minWidth:15, height:15, boxSizing:"border-box", display:"flex", alignItems:"center", justifyContent:"center", padding: activityCount > 9 ? "0 4px" : 0, border:"2px solid var(--surface)", pointerEvents:"none"}}>
                    {activityCount > 99 ? "99+" : activityCount}
                  </span>
                )}
              </button>
            )}
            {/* The app-grid switcher has no real destination yet (no other
                real apps/portals to link to) - left as a placeholder.
                Language, dark mode, and full screen below are all real. */}
            <div style={{position:"relative"}}>
              <button className="halofort-topbar-icon" title={t("Language", language)} onClick={() => setLanguageMenuOpen(v => !v)}>
                {/* Shows the currently active language's real flag instead
                    of a generic globe - also sidesteps flag-emoji font
                    support varying by OS (confirmed some environments show
                    raw "IN"/"US" text instead of the emoji glyph). */}
                <FlagIcon country={LANGUAGE_COUNTRY[language]} size={18} />
              </button>
              {languageMenuOpen && (
                <>
                  <div onClick={() => setLanguageMenuOpen(false)} style={{position:"fixed", inset:0, zIndex:9}} />
                  <div className="halofort-avatar-menu" style={{minWidth:200, maxHeight:320, overflowY:"auto"}}>
                    {LANGUAGES.map(l => (
                      <button key={l.code} className="halofort-avatar-menu-item"
                        style={l.code === language ? {background:"var(--hover-bg)", fontWeight:600} : undefined}
                        onClick={() => { setLanguage(l.code); setLanguageMenuOpen(false); }}>
                        <FlagIcon country={LANGUAGE_COUNTRY[l.code]} size={16} /> {l.label}
                        {l.code === language && <span style={{marginLeft:"auto"}}>&#10003;</span>}
                      </button>
                    ))}
                  </div>
                </>
              )}
            </div>
            <button className="halofort-topbar-icon" title={t("Toggle dark mode", language)} onClick={() => setTheme(theme === "dark" ? "light" : "dark")}><ActionIcon name="moon" /></button>
            <button className="halofort-topbar-icon" title={isFullscreen ? "Exit full screen" : t("Full screen", language)} onClick={toggleFullscreen}><ActionIcon name="fullscreen" /></button>
            <button className="halofort-topbar-icon" title="Apps (coming soon)"><ActionIcon name="grid" /></button>
            <div style={{position:"relative", marginLeft:8, paddingLeft:12, borderLeft:"1px solid var(--border)"}}>
              <button onClick={() => setAvatarMenuOpen(v => !v)}
                style={{display:"flex", alignItems:"center", gap:8, background:"none", border:"none", padding:0, cursor:"pointer"}}>
                <div className="halofort-avatar" title={`Role: ${auth.role}`}>{auth.username.slice(0, 2).toUpperCase()}</div>
                <div style={{lineHeight:1.3, textAlign:"left"}}>
                  <div style={{fontWeight:600, fontSize:12.5, color:"var(--text)"}}>{auth.username}</div>
                  <div style={{fontSize:11, color:"var(--text-muted)"}}>{titleCase(auth.role)}</div>
                </div>
              </button>
              {avatarMenuOpen && (
                <>
                  {/* Click-outside catcher, same pattern as other dropdowns
                      in this app - a full-viewport transparent layer below
                      the menu itself that just closes it on click. */}
                  <div onClick={() => setAvatarMenuOpen(false)} style={{position:"fixed", inset:0, zIndex:9}} />
                  <div className="halofort-avatar-menu">
                    <button onClick={() => { setAvatarMenuOpen(false); onLogout(); }} className="halofort-avatar-menu-item danger">
                      <ActionIcon name="disconnect" /> {t("Logout", language)}
                    </button>
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      )}
      <div className={template === "halofort" ? "halofort-content" : undefined}>
      {/* On the default top-tab-bar layout this connector status card is
          always visible above whichever tab is open. Halofort's sidebar
          instead gives it its own "Initial Setup" nav item (matching the
          reference), so there it only shows when that item is selected -
          same markup either way, just gated differently, to avoid keeping
          two copies of this card in sync. */}
      {(template !== "halofort" || tab === "setup") && (
      <>
      <div className="card" style={{display:"flex", alignItems:"center", gap:12}}>
        <div style={{flex:1}}>
          <p style={{fontWeight:500, margin:"0 0 2px", display:"flex", alignItems:"center", gap:6}}>
            ChromeOS connector
            <button onClick={() => setShowConnInfo(v => !v)} title="Connection details"
              style={{display:"inline-flex", alignItems:"center", justifyContent:"center", width:16, height:16, borderRadius:"50%", padding:0, border:"none", background:"var(--border)", color:"var(--text-muted)", fontSize:10, fontStyle:"italic", fontFamily:"Georgia, serif", cursor:"pointer"}}>i</button>
          </p>
          <p style={{fontSize:12, color:"var(--text-muted)", margin:0}}>{status.connectedAccount || "-"} &bull; {status.deviceCount} devices &bull; last sync {status.lastSync ? new Date(status.lastSync).toLocaleTimeString() : "-"}</p>
        </div>
        <span className={`badge ${status.status}`}>{titleCase(status.status)}</span>
        <span style={{fontSize:11, color:"var(--text-faint)"}}>Auto-sync every {formatSyncInterval(intervalSeconds)}</span>
        {syncing && <FunLoader compact label="Syncing with Google..." />}

        <ActionButton icon="sync" className="btn-primary" disabled={syncing || !canOperate || syncCooldownSecs > 0}
          title={!canOperate ? "Requires operator or admin role" : syncCooldownSecs > 0 ? `Synced too recently - each sync costs one extra Google API call per device, so this is throttled to avoid hitting Google's rate limits on larger fleets. Try again in ${syncCooldownSecs}s.` : "Refresh the device list from Google now"}
          onClick={syncNow}>{syncing ? "Syncing..." : syncCooldownSecs > 0 ? `Wait ${syncCooldownSecs}s` : "Sync now"}</ActionButton>
        <ActionButton icon="disconnect" className="btn-danger" disabled={disconnecting || !isAdmin} title={isAdmin ? "Disconnect this portal from Google Workspace" : "Requires admin role"} onClick={disconnect}>{disconnecting ? "Disconnecting..." : "Disconnect"}</ActionButton>
      </div>

      {showConnInfo && (
        <div className="card" style={{marginTop:-4}}>
          <p className="detail-card-title" style={{marginBottom:12}}>Connection details</p>
          <div className="device-detail">
            <Detail label="Client ID">{status.clientId}</Detail>
            <Detail label="Customer ID">{status.customerId}</Detail>
            <Detail label="Connected account">{status.connectedAccount}</Detail>
            <Detail label="Authorized">{status.authorizedAt ? new Date(status.authorizedAt).toLocaleString() : null}</Detail>
            <Detail label="Auto-sync interval">{formatSyncInterval(intervalSeconds)}</Detail>
            <Detail label="Last sync">{status.lastSync ? new Date(status.lastSync).toLocaleString() : null}</Detail>
          </div>
          {status.scopes?.length > 0 && (
            <>
              <p className="device-detail-label" style={{marginTop:14, marginBottom:6}}>Authorized scopes ({status.scopes.length})</p>
              <p style={{fontSize:11.5, color:"var(--text-muted)", lineHeight:1.6, wordBreak:"break-all", margin:0}}>{status.scopes.join(", ")}</p>
            </>
          )}
          {status.authorizationUrl && (
            <p style={{marginTop:12}}>
              <a href={status.authorizationUrl} target="_blank" rel="noreferrer">Open domain-wide delegation settings in Admin console &rarr;</a>
            </p>
          )}
          <p className="device-detail-label" style={{marginTop:16, marginBottom:6, color:"var(--critical-text)"}}>If you disconnect</p>
          <ul style={{fontSize:12.5, color:"var(--text-muted)", lineHeight:1.7, margin:0, paddingLeft:18}}>
            <li>The portal immediately drops back to the Setup wizard - you lose access to Devices, Fleet insights, Activity, everything, until you reconnect. It doesn't keep showing your last-synced view.</li>
            <li>Every previously-synced device is cleared from this portal's memory right away, not just hidden - that's the first thing disconnecting does.</li>
            <li>Auto-sync stops immediately, and every action that calls Google (Restart, Wipe, Disable, Move, Remote desktop, etc.) becomes unreachable since the dashboard itself is gone.</li>
            <li>Reconnecting requires the full Setup wizard again (re-upload the key, re-authorize in Admin console) - there's no "resume" shortcut, and you'll see an empty device list until the first post-reconnect sync completes.</li>
            <li>Nothing changes on the Google side - devices, policies, and enrollment are untouched. Disconnecting only removes this portal's own view into them, not any real state on your devices.</li>
          </ul>
        </div>
      )}
      </>
      )}

      {template !== "halofort" && (
        <div className="tab-bar">
          {DASHBOARD_SECTIONS.map(s => (
            <button key={s.key} className={`tab-button ${tab === s.key ? "active" : ""}`} onClick={() => goToTab(s.key)}>{s.label}</button>
          ))}
        </div>
      )}

      {visitedTabs.devices && (
      <div style={{display: tab === "devices" ? "block" : "none"}}>
        {(template === "halofort" && expandedDeviceId) ? (() => {
          // Halofort's own navigation pattern: clicking a device's serial
          // number replaces the whole table with a dedicated full-page
          // view (back arrow + the same DeviceDetailTabs header/pills/cards
          // already built), instead of expanding inline in the table row
          // the way every other template does. Reuses expandedDeviceId (the
          // same state the inline eye-icon toggle already drives) rather
          // than adding a second, parallel piece of state to keep in sync.
          const dv = devices.find(dev => dev.id === expandedDeviceId);
          if (!dv) return null;
          const tele = telemetry[dv.id] || {};
          const storageTotal = tele.data?.storageTotalBytes || dv.storageTotalBytes;
          const storageUsed = tele.data?.storageTotalBytes
            ? tele.data.storageTotalBytes - tele.data.storageAvailableBytes
            : (dv.storageTotalBytes ? dv.storageTotalBytes - dv.storageFreeBytes : 0);
          const memTotal = tele.data?.memoryTotalBytes || dv.ramTotalBytes;
          const memUsed = tele.data?.memoryTotalBytes
            ? tele.data.memoryTotalBytes - tele.data.memoryAvailableBytes
            : (dv.ramTotalBytes ? dv.ramTotalBytes - dv.ramFreeBytes : 0);
          return (
            <>
              <button onClick={() => setExpandedDeviceId(null)}
                style={{display:"flex", alignItems:"center", gap:8, background:"none", border:"none", cursor:"pointer", fontSize:15, fontWeight:600, padding:"4px 0", marginBottom:16, color:"var(--text)"}}>

              </button>
              <DeviceDetailTabs
                device={dv} tele={tele}
                storageTotal={storageTotal} storageUsed={storageUsed}
                memTotal={memTotal} memUsed={memUsed}
                canOperate={canOperate} isAdmin={isAdmin} runAction={runAction} runDeprovision={runDeprovision} runDisable={runDisable} runDeployTracker={runDeployTracker} actionState={actionState}

                refreshDevices={loadDevices}
                template={template}
              />

        })() : (
        <>
        {/* The device-count stat row moved back to Dashboard's Health

        <div className="subtab-bar">
          <button className={`subtab-button ${deviceTypeFilter === "all" ? "active" : ""}`} onClick={() => setDeviceTypeFilter("all")}>All devices</button>
          <button className={`subtab-button ${deviceTypeFilter === "chromeos" ? "active" : ""}`} onClick={() => setDeviceTypeFilter("chromeos")}>ChromeOS ({devices.length})</button>

        {insightFilter && (

          {isAdmin && bulkMoveState?.status === "complete" && selectedIds.size === 0 && (

          <div style={{overflowX:"auto"}}>
          <table>
            <thead>

                <th>Google sync<InfoDot text="Online/Offline + how long ago Google last heard from this device (hover for the exact timestamp), against the online-after window in Settings - sourced purely from Directory sync, which can lag real device state by minutes to hours. Not a live connectivity check." /></th>
                <th>Live check-in<InfoDot text="A separate, more real-time signal from the Location Tracker extension (only available on devices that have it installed) - independent of the Google sync column to its left, so the two can genuinely disagree without either being wrong. When the extension holds a live WebSocket connection open (labeled 'Online (live)' with a pulsing dot), the server knows within seconds of it actually disconnecting - not a polling guess. Otherwise this falls back to the extension's periodic location-ping timestamp." /></th>

                    <td title="Google's own provisioning state - independent of whether the device has synced recently.">
                      <span className={`badge ${provisionStatusMeta(d.provisionStatus).badge}`}>{provisionStatusLabel(d.provisionStatus)}</span>
                    </td>
                    <td title="Derived from Last seen vs. the stale-after threshold in Settings - not real-time connectivity. Only meaningful for devices Google itself reports as ACTIVE; a disabled/deprovisioned device's real state is already shown in the Status column to its left.">
                      {d.provisionStatus !== "ACTIVE" ? (

                      ) : d.stale ? (

                        <span className="badge active">Active</span>

                    </td>
                    <td style={{whiteSpace:"nowrap"}} title={`Google Directory sync only - ${d.online ? "online" : "offline"}, last synced ${new Date(d.lastSeen).toLocaleString()} (${timeAgo(d.lastSeen)}), against the online-after threshold in Settings. Not a live connectivity check; can lag the device's real state by minutes to hours. See the Live check-in column for a closer-to-real-time signal on devices that have the extension.${d.connectionState ? ` Last reported network state (may be stale if currently offline): ${d.connectionState}.` : ""}`}>
                      <span style={{display:"inline-flex", alignItems:"center", gap:6}}>
                        <span style={{width:8, height:8, borderRadius:"50%", background: d.online ? "var(--active-text)" : "var(--disconnected-text)", flexShrink:0}} />

                        style={{marginLeft:6, padding:"2px 6px", fontSize:11, verticalAlign:"middle"}}>
                        {refreshingIds.has(d.id) ? "…" : <ActionIcon name="sync" />}
                      </button>
                    </td>
                    <td style={{whiteSpace:"nowrap"}} title={d.wsLastEventTime
                      ? (d.wsConnected
                        ? `Live WebSocket connection, open since ${new Date(d.wsLastEventTime).toLocaleString()} - the server detects this within seconds of the connection actually dropping (network lost, device slept/powered off), not on a polling window. This is the most accurate of the three connectivity signals in this table.`
                        : `Live WebSocket connection - last disconnected ${new Date(d.wsLastEventTime).toLocaleString()} (${timeAgo(d.wsLastEventTime)}). The server found out within seconds of this happening, not after a polling delay.`)
                      : d.trackedLocationTime
                      ? `Location Tracker extension's own last check-in, ${new Date(d.trackedLocationTime).toLocaleString()} (${timeAgo(d.trackedLocationTime)}) - a genuinely independent signal from the Google sync column to its left (which is purely Directory sync, no live ping exists there). This one updates as often as the extension's own ping interval, so it can catch a device as online well before Google's sync does.`
                      : "This device has never sent a Location Tracker extension ping - either the extension isn't installed, or it hasn't successfully reported yet."}>
                      {d.wsLastEventTime ? (
                        <span className={`badge ${d.wsConnected ? "active live-pulse" : "disconnected"}`}>
                          {d.wsConnected ? "Online (live)" : "Offline"} · {timeAgo(d.wsLastEventTime)}
                        </span>
                      ) : d.trackedLocationTime ? (
                        <span className={`badge ${d.extensionOnline ? "active" : "disconnected"}`}>{d.extensionOnline ? "Online" : "Offline"} · {timeAgo(d.trackedLocationTime)}</span>
                      ) : (
                        <span style={{color:"var(--text-faint)", fontSize:12}}>—</span>
                      )}
                    </td>
                    <td style={{whiteSpace:"nowrap"}}>
                      {actionState[d.id]?.status === "pending" ? (
                        <span style={{fontSize:12, color:"var(--primary)"}}>{actionDisplayName(actionState[d.id].action)}ing...</span>
                      ) : template === "halofort" ? (
                        // No per-action buttons here (those live on the
                        // device detail page's own "Device actions"
                        // dropdown) - this column is repurposed to show
                        // whether this device actually has a live location

                        // nothing under it was pointless.
                        <button onClick={() => { setExpandedDeviceId(d.id); setTimeout(() => { document.querySelectorAll('.halofort-subtab-pill').forEach(b => { if (b.textContent.includes('Location')) b.click(); }); }, 100); }}
                          title={d.trackedLocationLat && d.trackedLocationLat !== 0 ? "Live location reported - view on the Location tab" : "No location reported yet"}
                          style={{background:"none", border:"none", padding:"4px 8px", cursor:"pointer", color: d.trackedLocationLat && d.trackedLocationLat !== 0 ? "var(--primary)" : "var(--text-faint)"}}>
                          <ActionIcon name="location" />

                      ) : (
                        <div className="actions-cell">
                          <ActionButton icon="restart" disabled={!canOperate} title={canOperate ? "Restart this device" : "Requires operator or admin role"} onClick={() => runAction(d.id, "restart")} />
                          <ActionButton icon="lock" disabled={!isAdmin} title={isAdmin ? "Force this device to log out and require re-login (clears local user data - not a full factory reset)" : "Requires admin role"} onClick={() => runAction(d.id, "wipe")} />
                          {d.provisionStatus === "DISABLED" ? (
                            <ActionButton icon="enable" disabled={!isAdmin} title={isAdmin ? "Restore this device to active management" : "Requires admin role"} onClick={() => runAction(d.id, "enable")} />
                          ) : (
                            <ActionButton icon="disable" disabled={!isAdmin} title={isAdmin ? "Temporarily block this device from checking in" : "Requires admin role"} onClick={() => runAction(d.id, "disable")} />
                          )}
                          <ActionButton
                             icon="location"
                             title={d.trackedLocationLat ? "View live location for this device" : "No location reported yet - click to open Location tab"}
                             onClick={() => { setExpandedDeviceId(d.id); setTimeout(() => { document.querySelectorAll('.subtab-button').forEach(b => { if (b.textContent === 'Location') b.click(); }); }, 100); }}
                           />
                        </div>
                      )}
                    </td>
                    {template !== "halofort" && (
                      <td>
                        <ActionButton icon={expandedDeviceId === d.id ? "hide" : "details"} title={expandedDeviceId === d.id ? "Collapse device details" : "View full device details"} onClick={() => setExpandedDeviceId(expandedDeviceId === d.id ? null : d.id)} />
                      </td>
                    )}
                  </tr>
                  {expandedDeviceId === d.id && (() => {
                    const tele = telemetry[d.id] || {};
                    // Prefer live telemetry byte counts (Chrome Management Telemetry API -
                    // confirmed live to be the reliable source; the Directory API's own
                    // DiskVolumeReports frequently comes back empty for the same device)
                    // and fall back to the Directory-API-sourced fields only if telemetry
                    // itself has nothing.
                    const storageTotal = tele.data?.storageTotalBytes || d.storageTotalBytes;
                    const storageUsed = tele.data?.storageTotalBytes
                      ? tele.data.storageTotalBytes - tele.data.storageAvailableBytes
                      : (d.storageTotalBytes ? d.storageTotalBytes - d.storageFreeBytes : 0);
                    const memTotal = tele.data?.memoryTotalBytes || d.ramTotalBytes;
                    const memUsed = tele.data?.memoryTotalBytes
                      ? tele.data.memoryTotalBytes - tele.data.memoryAvailableBytes
                      : (d.ramTotalBytes ? d.ramTotalBytes - d.ramFreeBytes : 0);
                    return (
                    <tr>
                      <td colSpan={isAdmin ? 10 : 9} style={{background:"var(--tile-bg)"}}>
                        <div style={{padding:"8px 4px"}}>
                          <DeviceDetailTabs
                            device={d} tele={tele}
                            storageTotal={storageTotal} storageUsed={storageUsed}
                            memTotal={memTotal} memUsed={memUsed}
                            canOperate={canOperate} isAdmin={isAdmin} runAction={runAction} runDeprovision={runDeprovision} runDisable={runDisable} runDeployTracker={runDeployTracker} actionState={actionState}
                            appCatalog={appCatalog}
                            refreshDevices={loadDevices}
                            template={template}
                          />
                        </div>
                      </td>
                    </tr>
                    );
                  })()}
                </React.Fragment>
              ))}
            </tbody>
          </table>
          </div>
        </div>
        )}
        {deviceTypeFilter !== "chromeos" && <MobileDevicesPanel forceExpanded={deviceTypeFilter === "mobile"} />}
        </>
        )}
      </div>
      )}

      {visitedTabs.insights && (
        <div style={{display: tab === "insights" ? "block" : "none"}}>
          {insights ? <FleetHealthPanel insights={insights} devices={devices} template={template} onViewAll={(label, items) => {
            setInsightFilter({ label, ids: new Set(items.map(d => d.id)) });
            goToTab("devices");
          }} /> : <InsightsSkeleton template={template} />}
        </div>
      )}
      {visitedTabs.activity && insights && (
        <div style={{display: tab === "activity" ? "block" : "none"}}>
          <ActivityPanel insights={insights} />
          <DeviceEventsCard />
        </div>

      {visitedTabs.directory && (
        <div style={{display: tab === "directory" ? "block" : "none"}}>
          <DirectoryPanel />
        </div>
      )}
      {visitedTabs.reports && insights && (
        <div style={{display: tab === "reports" ? "block" : "none"}}>
          <ReportsPanel insights={insights} devices={devices} setTab={goToTab} />
        </div>
      )}
      {visitedTabs.enrollment && (
        <div style={{display: (tab === "enrollment" || (template === "halofort" && tab === "setup")) ? "block" : "none"}}>
          <EnrollmentPanel />

      {visitedTabs.security && (
        <div style={{display: tab === "security" ? "block" : "none"}}>
          <SecurityPanel isAdmin={isAdmin} template={template} />
        </div>
      )}
      {visitedTabs.settings && (
        <div style={{display: tab === "settings" ? "block" : "none"}}>
          <SettingsPanel
            intervalSeconds={intervalSeconds}
            intervalChoice={intervalChoice}
            customMinutes={customMinutes}
            onIntervalChoiceChange={onIntervalChoiceChange}
            onCustomMinutesSubmit={onCustomMinutesSubmit}
            setCustomMinutes={setCustomMinutes}
            isAdmin={isAdmin}
            theme={theme} setTheme={setTheme} template={template} setTemplate={setTemplate} glass={glass} setGlass={setGlass}
          />
        </div>
      )}
      </div>
      {template === "halofort" && (
        <div className="halofort-footer">
          {/* Confined to the main content column (starts after the
              sidebar, not flush under it) - left side is intentionally
              just "localhost" as a placeholder for now (real content still
              to be defined) rather than a fabricated version/build number. */}
          <span>localhost</span>
          <span>halofort &copy; All rights reserved</span>
        </div>
      )}
      </div>

}

function App() {
  const [theme, setTheme] = useTheme();
  const [template, setTemplate] = useThemeTemplate(theme);
  const [glass, setGlass] = useGlass();
  const [language, setLanguage] = useLanguage();
  const [auth, setAuth] = useAuth();
  const [status, refreshStatus] = useConnectionStatus(!!auth);
  // jumpToTab: how the header bell tells DeviceDashboard (a sibling, not a
  // parent/child of this button) to switch to the Activity tab - see the
  // matching effect inside DeviceDashboard that consumes and clears this.
  const [jumpToTab, setJumpToTab] = useState(null);
  // activityCount: an unread-style badge count, not a running total - only
  // events reported AFTER the last time the Activity tab was actually
  // viewed count (persisted in localStorage so it survives a reload).
  // Reuses the same GET /device-events endpoint the Activity tab itself
  // calls (not a new backend endpoint) - last 24h, polled every minute
  // while connected.
  const [lastViewedActivityAt, setLastViewedActivityAt] = useState(() => Number(localStorage.getItem("lastViewedActivityAt") || 0));
  const [activityCount, setActivityCount] = useState(0);
  useEffect(() => {
    if (!auth || status?.status !== "active") return;
    const load = () => apiFetch(`${API}/device-events?hours=24`)
      .then(r => r.ok ? r.json() : [])
      .then(evts => {
        const unseen = (evts || []).filter(e => new Date(e.reportTime).getTime() > lastViewedActivityAt);
        setActivityCount(unseen.length);
      })
      .catch(() => {});
    load();
    const t = setInterval(load, 60000);
    return () => clearInterval(t);
  }, [auth, status?.status, lastViewedActivityAt]);

  // bumpActivity is called by DeviceDashboard the moment a device action
  // (restart/lock/disable/etc) finishes, success or failure - device
  // actions are a separate feed (DeviceAction history) from the telemetry
  // events device-events polls, so they wouldn't otherwise show up here.
  // This is also why the real "commands still pending" error from a
  // stuck-earlier-command device now surfaces via the bell/Activity tab
  // instead of as long inline text that was forcing the devices table into
  // horizontal scroll.
  const bumpActivity = () => setActivityCount(c => c + 1);

  // markActivityViewed is called by DeviceDashboard the moment the user is
  // actually looking at the Activity tab (not just because every tab is
  // pre-mounted in the background) - see the matching effect there.
  const markActivityViewed = () => {
    const now = Date.now();
    localStorage.setItem("lastViewedActivityAt", String(now));
    setLastViewedActivityAt(now);
    setActivityCount(0);
  };

  if (auth === undefined) return <div style={{display:"flex", justifyContent:"center", paddingTop:"18vh"}}><DelayedLoader>{template === "halofort" ? <HalofortBootSplash /> : <FunLoader showTip />}</DelayedLoader></div>;
  if (!auth) return <LoginScreen onLoggedIn={setAuth} theme={theme} setTheme={setTheme} template={template} setTemplate={setTemplate} glass={glass} setGlass={setGlass} />;
  if (!status) return <div style={{display:"flex", justifyContent:"center", paddingTop:"18vh"}}><DelayedLoader>{template === "halofort" ? <HalofortBootSplash /> : <FunLoader showTip />}</DelayedLoader></div>;

  const logout = async () => {
    await apiFetch(`${AUTH_API}/logout`, { method: "POST" });
    localStorage.removeItem(TOKEN_KEY);
    setAuth(null);
  };

  // The Halofort sidebar (rendered inside DeviceDashboard) carries its own
  // logo, so this top header's logo would be a redundant second one exactly
  // when that sidebar is showing - only true once actually connected and
  // past the Setup wizard, which is why this mirrors that same condition
  // rather than just checking the template.
  const showingHalofortSidebar = template === "halofort"
    && !(status.status === "disconnected" || status.status === "pending" || status.status === "authorized");

  return (
    <div>
      {/* Halofort's sidebar (inside DeviceDashboard) carries its own logo
          plus a compact top bar with the bell/account controls - this outer
          header would otherwise sit above it as dead vertical space with
          nothing useful left in it, which was the actual source of the gap
          above the sidebar (not just body's own padding). */}
      {!showingHalofortSidebar && (
        <div style={{display:"flex", alignItems:"baseline", justifyContent:"space-between"}}>
          <h2 style={{fontWeight:500, display:"flex", alignItems:"center", gap:10}}>
            {template === "halofort" ? <HalofortLogo size={26} /> : (
              <>
                <PlatformIcon monochrome={template === "bw"} />
                ChromeOS device management
              </>
            )}
          </h2>
          <div style={{display:"flex", alignItems:"center", gap:10, fontSize:12, color:"var(--text-muted)"}}>
            {status.status === "active" && (
              <button onClick={() => setJumpToTab("activity")} title={`${activityCount} recent device event${activityCount === 1 ? "" : "s"} - view Activity`}
                style={{position:"relative", display:"inline-flex", alignItems:"center", padding:"4px 8px"}}>
                <ActionIcon name="bell" />
                {activityCount > 0 && (
                  <span style={{position:"absolute", top:-4, right:-4, background:"var(--critical-text)", color:"#fff", borderRadius:"50%", fontSize:10, lineHeight:1, minWidth:16, height:16, display:"flex", alignItems:"center", justifyContent:"center", padding:"0 3px"}}>
                    {activityCount > 99 ? "99+" : activityCount}
                  </span>
                )}
              </button>
            )}
            <span>Signed in as <span className={`role-chip ${auth.role}`} title={`Role: ${auth.role}`}>{auth.username}</span></span>
            <button onClick={logout} style={{fontSize:12, padding:"4px 10px"}}>Log out</button>
          </div>
        </div>
      )}
      {(status.status === "disconnected" || status.status === "pending" || status.status === "authorized")
        ? (auth.role === "admin"
            ? <SetupWizard onConnected={refreshStatus} />
            : <p className="card empty-note">This portal isn't connected to Google Workspace yet - ask an admin to run the connect wizard.</p>)
        : <DeviceDashboard status={status} refreshStatus={refreshStatus} role={auth.role} jumpToTab={jumpToTab} onJumpConsumed={() => setJumpToTab(null)} onViewActivity={markActivityViewed} onActionResult={bumpActivity} template={template} theme={theme} setTheme={setTheme} setTemplate={setTemplate} glass={glass} setGlass={setGlass} language={language} setLanguage={setLanguage} auth={auth} activityCount={activityCount} onLogout={logout} />
      }
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
