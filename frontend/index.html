}

// Detail: one label+value pair in a device's expanded row. Renders "-" for
// any falsy/absent value so a sparsely-populated device (common - not every
// Workspace backfills every optional field) still reads as complete, not broken.
function Detail({ label, children }) {
  return (
    <div>
      <span className="device-detail-label">{label}</span>
      {children === null || children === undefined || children === "" ? "-" : children}
    </div>
  );
}

// DeviceActionsCard: every real ChromeOS device action beyond Restart/Lock
// (which stay in the table row) - split into command-based actions
// (Google's issueCommand, documented Kiosk/managed-guest-session only for
// several of these, so they may genuinely fail on an ordinary user-session
// Chromebook - that's a real API response, not a bug) and direct field
// patches (disable/re-enable/deprovision/move, which take effect next
// check-in, same as editing them in Admin console).
function DeviceActionsCard({ device, canOperate, isAdmin, runAction, runDeprovision, runDisable, runDeployTracker, actionState }) {
  const [volume, setVolume] = useState(50);
  const [targetOu, setTargetOu] = useState(device.orgUnit || "/");
  const [confirming, setConfirming] = useState(null); // action key currently showing its confirm step, or null
  // factoryReset: only meaningful while confirming === "deprovision" - matches
  // Admin console's own deprovision dialog, which defaults to bundling a
  // factory reset (confirmed against the real dialog: "Yes, Factory Reset"
  // is its pre-selected option). Without this, deprovision only flips the
  // server-side status - the device itself shows no visible change, which
  // is exactly why it looked like "nothing happened" before this existed.
  const [factoryReset, setFactoryReset] = useState(true);
  // understood: the required acknowledgement checkbox Admin console's own
  // Reset/Deprovision/Disable dialogs all gate their action button behind
  // ("I understand this will remove data...", "I understand the upgrade
  // policy, deprovisioning steps...") - reused across all three confirms
  // here since only one is ever open at a time, reset to false each time a
  // new one opens so it can't carry over as an accidental yes.
  const [understood, setUnderstood] = useState(false);
  // resetChoice/disableChoice mirror the real dialogs' own radio choice -
  // Reset offers "Clear User Profiles" (recommended) vs "Factory Reset";
  // Disable offers "Disable With Lock Screen" (default) vs "Disable With
  // Factory Reset". Neither is a fake UI-only choice: "Clear User Profiles"
  // maps to the same wipe/Lock action already used elsewhere, and the
  // factory-reset variants sequence a real powerwash after, same pattern as
  // runDeprovision.
  const [resetChoice, setResetChoice] = useState("clear");
  const [disableChoice, setDisableChoice] = useState("lock");

  const state = actionState[device.id];
  const busy = state?.status === "pending";
  const isDisabled = device.provisionStatus === "DISABLED";

  // Kiosk/managed-guest-session-only commands confirmed live to get stuck
  // "pending" forever on an ordinary user-session device (the device never
  // acknowledges them) - and while anything is pending, Google's API
  // rejects ALL new commands for that device, not just kiosk-only ones.
  // Gated behind the same confirm step as the destructive actions so this
  // doesn't happen by an accidental click.
  const kioskWarning = "Only works on Kiosk/managed-guest-session devices. On any other device type it gets stuck \"pending\" and blocks ALL other commands (including Restart/Wipe) until Google's server times it out - confirmed live, can take a while. Proceed?";
  const confirmableCommand = (key, icon, label, tooltip, run) => confirming === key ? (
    <>
      <span className="empty-note" style={{color:"var(--critical-text)", flexBasis:"100%"}}>{kioskWarning}</span>
      <button disabled={busy} className="btn-danger" onClick={() => { run(); setConfirming(null); }}>Yes, run it</button>
      <button disabled={busy} onClick={() => setConfirming(null)}>Cancel</button>
    </>
  ) : (
    <ActionButton icon={icon} disabled={busy || !canOperate} title={canOperate ? tooltip : "Requires operator or admin role"} onClick={() => setConfirming(key)}>{label}</ActionButton>
  );

  return (
    <>
      <p className="action-group-label">Actions<InfoDot text="Diagnostics require the device to be online and, for several, in a Kiosk/managed-guest-session - see the confirmation warning before running them on an ordinary device." /></p>
      <div className="action-row" style={{marginBottom:8}}>
        {confirmableCommand("screenshot", "screenshot", "Screenshot", "Capture a screenshot from the device", () => runAction(device.id, "screenshot"))}
        <ActionButton icon="remote_desktop" disabled={busy || !canOperate} title={canOperate ? "Start a remote desktop session to this device" : "Requires operator or admin role"} onClick={() => runAction(device.id, "crd")}>Remote desktop</ActionButton>
        {confirmableCommand("capture_logs", "capture_logs", "Capture logs", "Capture device logs for troubleshooting", () => runAction(device.id, "capture_logs"))}
        <ActionButton icon="support_packet" disabled={busy || !canOperate} title={canOperate ? "Fetch a Google support packet for this device" : "Requires operator or admin role"} onClick={() => runAction(device.id, "support_packet")}>Fetch support packet</ActionButton>

        {confirming === "set_volume" ? (
          <>
            <span className="empty-note" style={{color:"var(--critical-text)", flexBasis:"100%"}}>{kioskWarning}</span>
            <button disabled={busy} className="btn-danger" onClick={() => { runAction(device.id, "set_volume", String(volume)); setConfirming(null); }}>Yes, run it</button>
            <button disabled={busy} onClick={() => setConfirming(null)}>Cancel</button>
          </>
        ) : (
          <>
            <input type="number" min="0" max="100" value={volume} onChange={e => setVolume(e.target.value)} style={{width:60, fontSize:12, padding:"4px 6px"}} />
            <ActionButton icon="volume" disabled={busy || !canOperate} title={canOperate ? "Set the device's system volume" : "Requires operator or admin role"} onClick={() => setConfirming("set_volume")}>Set volume</ActionButton>
          </>
        )}

        {isDisabled ? (
          <ActionButton icon="enable" disabled={busy || !isAdmin} title={isAdmin ? "Restore this device to active management" : "Requires admin role"} onClick={() => runAction(device.id, "enable")}>Re-enable</ActionButton>
        ) : confirming === "disable" ? (
          <div style={{flexBasis:"100%"}}>
            <p className="empty-note" style={{margin:"0 0 6px"}}>Disabling makes the device inoperable. Choose how, matching Admin console's own Disable dialog:</p>
            <label style={{display:"flex", gap:6, alignItems:"flex-start", fontSize:12, marginBottom:4}}>
              <input type="radio" name="disableChoice" checked={disableChoice === "lock"} onChange={() => setDisableChoice("lock")} />
              <span><b>Disable With Lock Screen</b> - blocks use of the device until it's enabled again; stays enrolled.</span>
            </label>
            <label style={{display:"flex", gap:6, alignItems:"flex-start", fontSize:12, marginBottom:8}}>
              <input type="radio" name="disableChoice" checked={disableChoice === "factory"} onChange={() => setDisableChoice("factory")} />
              <span><b>Disable With Factory Reset</b> - blocks use of the device and removes all data.</span>
            </label>
            <label style={{display:"flex", gap:6, alignItems:"flex-start", fontSize:12, marginBottom:8}}>
              <input type="checkbox" checked={understood} onChange={e => setUnderstood(e.target.checked)} />
              <span>I understand this will make the device inoperable{disableChoice === "factory" ? " and remove all data" : ""}.</span>
            </label>
            <button disabled={busy || !understood} className="btn-danger" onClick={() => { runDisable(device.id, disableChoice === "factory"); setConfirming(null); }}>Disable</button>{" "}
            <button disabled={busy} onClick={() => setConfirming(null)}>Cancel</button>
          </div>
        ) : (
          <ActionButton icon="disable" disabled={busy || !isAdmin} title={isAdmin ? "Temporarily block this device from checking in" : "Requires admin role"} onClick={() => { setDisableChoice("lock"); setUnderstood(false); setConfirming("disable"); }}>Disable</ActionButton>
        )}

        <div style={{flexBasis:"100%", height:0}} />
        <input value={targetOu} onChange={e => setTargetOu(e.target.value)} style={{flex:1, minWidth:120, fontSize:12, padding:"4px 6px"}} />
        <ActionButton icon="move" disabled={busy || !isAdmin || targetOu === device.orgUnit} title={isAdmin ? "Move this device to a different organizational unit" : "Requires admin role"} onClick={() => runAction(device.id, "move", targetOu)}>Move</ActionButton>
      </div>

      <p className="action-group-label" style={{color:"var(--primary)"}}>Extensions & Policies</p>
      <div className="action-row" style={{marginBottom:8}}>
        {confirming === "deploy_tracker" ? (
          <div style={{flexBasis:"100%"}}>
            <p className="empty-note" style={{margin:"0 0 6px"}}>This will forcefully deploy the Location Tracking Chrome Extension to the entire organizational unit <b>{device.orgUnit || "/"}</b> using the Chrome Policy API.</p>
            <button disabled={busy} className="btn-primary" onClick={() => { runDeployTracker(device.id, device.orgUnit); setConfirming(null); }}>Deploy Tracker</button>{" "}
            <button disabled={busy} onClick={() => setConfirming(null)}>Cancel</button>
          </div>
        ) : (
          <ActionButton icon="enable" disabled={busy || !isAdmin} title={isAdmin ? "Forcefully deploy location tracker extension to this OU" : "Requires admin role"} onClick={() => setConfirming("deploy_tracker")}>Deploy Location Tracker</ActionButton>
        )}
      </div>

      <p className="action-group-label" style={{color:"var(--critical-text)"}}>Danger zone</p>
      <div className="action-row">
        {confirming === "powerwash" ? (
          <div style={{flexBasis:"100%"}}>
            <p className="empty-note" style={{margin:"0 0 6px", color:"var(--critical-text)"}}>Resetting will remove data. Choose the type of reset, matching Admin console's own Reset dialog:</p>
            <label style={{display:"flex", gap:6, alignItems:"flex-start", fontSize:12, marginBottom:4}}>
              <input type="radio" name="resetChoice" checked={resetChoice === "clear"} onChange={() => setResetChoice("clear")} />
              <span><b>Clear User Profiles</b> to remove all user profile data, but keep device policy and enrollment (Recommended).</span>
            </label>
            <label style={{display:"flex", gap:6, alignItems:"flex-start", fontSize:12, marginBottom:8}}>
              <input type="radio" name="resetChoice" checked={resetChoice === "factory"} onChange={() => setResetChoice("factory")} />
              <span><b>Factory Reset</b> to remove all data including user profiles, device policies, and enrollment data.</span>
            </label>
            <label style={{display:"flex", gap:6, alignItems:"flex-start", fontSize:12, marginBottom:8}}>
              <input type="checkbox" checked={understood} onChange={e => setUnderstood(e.target.checked)} />
              <span>I understand this will remove data from the device and cannot be undone.</span>
            </label>
            <button disabled={busy || !understood} className="btn-danger" onClick={() => { runAction(device.id, resetChoice === "factory" ? "powerwash" : "wipe"); setConfirming(null); }}>Reset</button>{" "}
            <button disabled={busy} onClick={() => setConfirming(null)}>Cancel</button>
          </div>
        ) : (
          <ActionButton icon="reset" disabled={busy || !isAdmin} className="btn-danger" title={isAdmin ? "Erase all local data and factory reset the device" : "Requires admin role"} onClick={() => { setResetChoice("clear"); setUnderstood(false); setConfirming("powerwash"); }}>Reset (factory reset)</ActionButton>
        )}
        {confirming === "deprovision" ? (
          <div style={{flexBasis:"100%"}}>
            <p className="empty-note" style={{margin:"0 0 6px", color:"var(--critical-text)"}}>Deprovisioning will stop device policy syncing and remove device-level policies. Once deprovisioned, it must be wiped before it can be re-enrolled.</p>
            <label style={{display:"flex", gap:6, alignItems:"flex-start", fontSize:12, marginBottom:4}}>
              <input type="radio" name="deprovisionChoice" checked={factoryReset} onChange={() => setFactoryReset(true)} />
              <span><b>Yes, Factory Reset</b> to remove all data including user profiles, device policies, and enrollment data.</span>
            </label>
            <label style={{display:"flex", gap:6, alignItems:"flex-start", fontSize:12, marginBottom:8}}>
              <input type="radio" name="deprovisionChoice" checked={!factoryReset} onChange={() => setFactoryReset(false)} />
              <span>No, keep existing data and user profiles.</span>
            </label>
            <label style={{display:"flex", gap:6, alignItems:"flex-start", fontSize:12, marginBottom:8}}>
              <input type="checkbox" checked={understood} onChange={e => setUnderstood(e.target.checked)} />
              <span>I understand the upgrade policy, deprovisioning steps, and enrollment steps.</span>
            </label>
            <button disabled={busy || !understood} className="btn-danger" onClick={() => { runDeprovision(device.id, factoryReset); setConfirming(null); }}>Deprovision</button>{" "}
            <button disabled={busy} onClick={() => setConfirming(null)}>Cancel</button>
          </div>
        ) : (
          <ActionButton icon="deprovision" disabled={busy || !isAdmin} className="btn-danger" title={isAdmin ? "Release this device's license and remove it from fleet management" : "Requires admin role"} onClick={() => { setFactoryReset(true); setUnderstood(false); setConfirming("deprovision"); }}>Deprovision</ActionButton>
        )}
      </div>

      {state && state.status !== "pending" && (
        <>
          <p className="empty-note" style={{marginTop:10, color: state.status === "error" ? "var(--critical-text)" : "var(--active-text)"}}>
            {state.action}: {state.status === "error" ? (state.error || "Failed")
              : state.result ? <>Ready - <a href={state.result} target="_blank" rel="noreferrer">open remote desktop session</a></>
              : "Done"}
          </p>
          {state.action === "crd" && state.result && (
            <p className="empty-note" style={{color:"var(--text-faint)"}}>
              If the link says "You do not have permission to perform that action," open it in a browser/profile signed into the Workspace admin account that holds the ChromeOS device admin privilege (Admin console &rsaquo; Admin roles) - not a personal Google account. This is a Google-side account/privilege check on remotedesktop.google.com, not something this app controls.
            </p>
          )}
        </>
      )}
      <p className="card-footnote">
        "Reload policies" and "Locate" aren't exposed by any public Google API available to this integration, so they're not offered here - not fabricated.
        Screenshot/Set volume/Capture logs are Kiosk/managed-guest-session only - confirmed live that issuing one on an ordinary device gets it stuck pending and blocks every other command on that device until Google's server times it out, hence the extra confirm step.
      </p>
    </>
  );
}

// LeafletMap: A lightweight React wrapper for Leaflet to render the device location
// and its history path with a custom red marker.
function LeafletMap({ lat, lng, history }) {
  const mapRef = React.useRef(null);
  const containerRef = React.useRef(null);

  React.useEffect(() => {
    if (!containerRef.current) return;

    // Initialize map if it doesn't exist
    if (!mapRef.current) {
      mapRef.current = L.map(containerRef.current, {
        zoomControl: true,
        attributionControl: false // keep it clean, we add it manually or it's fine
      });

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
      }).addTo(mapRef.current);
    }

    const map = mapRef.current;

    // Clear existing layers (except the tile layer)
    map.eachLayer((layer) => {
      if (layer instanceof L.Marker || layer instanceof L.Polyline) {
        map.removeLayer(layer);
      }
    });

    // Create a custom red icon
    const redIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    // Add marker for current location
    if (lat && lng) {
      L.marker([lat, lng], { icon: redIcon }).addTo(map);
      map.setView([lat, lng], 17);
    }

    // Add history polyline if available
    if (history && history.length > 0) {
      const latlngs = history.map(p => [p.lat, p.lng]);
      if (lat && lng) {
        latlngs.push([lat, lng]); // Connect to current
      }
      L.polyline(latlngs, { color: 'red', weight: 3, dashArray: '5, 5', opacity: 0.6 }).addTo(map);
      
      // Add small dots for history points
      history.forEach(p => {
         L.circleMarker([p.lat, p.lng], { radius: 4, color: 'red', fillColor: '#fff', fillOpacity: 1 }).addTo(map);
      });
    } // <-- restored this missing bracket

    // Handle resizes so Leaflet doesn't leave grey gaps when flexbox stretches it
    const resizeObserver = new ResizeObserver(() => {
      map.invalidateSize();
    });
    resizeObserver.observe(containerRef.current);

    return () => resizeObserver.disconnect();
  }, [lat, lng, history]);

  return <div ref={containerRef} style={{ width: "100%", flex: 1, minHeight: "320px", zIndex: 1 }} />;
}

// DeviceDetailTabs: one full-width panel with a subtab switcher (the same
// proven pill-tab pattern Security already uses) instead of six separate
// boxed cards tiled side by side - tiling independently-sized cards (a
// dense Hardware card next to a sparse Network card) turned out to
// genuinely overlap in Chrome once a section grew taller than its
// neighbors, not just leave whitespace. Showing one section at a time
// sidesteps that whole class of layout bug.
function DeviceDetailTabs(props) {
  const { device: d, tele, storageTotal, storageUsed, memTotal, memUsed, canOperate, isAdmin, runAction, runDeprovision, runDisable, runDeployTracker, actionState, appCatalog, refreshDevices } = props;
  const [sub, setSub] = useState("hardware");
  const [geoAddress, setGeoAddress] = useState({});
  const [forcePinging, setForcePinging] = useState(false);
  const [pingMsg, setPingMsg] = useState("");

  // Reverse geocode whenever tracked location changes
  const prevLatRef = React.useRef(null);
  React.useEffect(() => {
    if (d.trackedLocationLat && d.trackedLocationLat !== 0 && d.trackedLocationLat !== prevLatRef.current) {
      prevLatRef.current = d.trackedLocationLat;
      fetch(`https://nominatim.openstreetmap.org/reverse?lat=${d.trackedLocationLat}&lon=${d.trackedLocationLng}&format=json`)
        .then(r => r.json())
        .then(data => setGeoAddress(data.address || {}))
        .catch(() => {});
    }
  }, [d.trackedLocationLat, d.trackedLocationLng]);

  // Force Refresh: polls the backend every 2s for up to 30s waiting for a new ping
  const forcePing = async () => {
    setForcePinging(true);
    setPingMsg("Waiting for extension to report location...");
    const before = d.trackedLocationTime || 0;
    const deadline = Date.now() + 30000;
    const poll = async () => {
      if (Date.now() > deadline) {
        setPingMsg("No new ping received in 30s. Extension pings automatically every 15 min.");
        setForcePinging(false);
        return;
      }
      if (refreshDevices) await refreshDevices();
      // If device state updated in the parent, it will re-render with new trackedLocationTime
      // We check via a closure-captured ref
      if (d.trackedLocationTime && d.trackedLocationTime !== before) {
        setPingMsg("Location updated! ✓");
        setForcePinging(false);
        setTimeout(() => setPingMsg(""), 3000);
        return;
      }
      setTimeout(poll, 2000);
    };
    poll();
  };


  const sections = [
    { key: "hardware", label: "Hardware" },
    { key: "os", label: "OS & updates" },
    { key: "network", label: "Network" },
    { key: "apps", label: "Apps" },
    { key: "actions", label: "Actions" },
    { key: "location", label: "Location" },
    { key: "usage", label: "Usage & enrollment" },
  ];
  return (
    <div className="detail-card">
      <div className="subtab-bar" style={{marginBottom:16, display: "flex", justifyContent: "space-between", alignItems: "center"}}>
        <div>
          {sections.map(s => (
            <button key={s.key} className={`subtab-button ${sub === s.key ? "active" : ""}`} onClick={() => setSub(s.key)}>{s.label}</button>
          ))}
        </div>
        <button onClick={refreshDevices} title="Refresh device data" style={{background:"transparent", border:"none", cursor:"pointer", fontSize:16, color:"var(--text-faint)", padding:"4px 8px"}}>
          ↻
        </button>
      </div>

      {sub === "hardware" && (
        <div>
          <div className="device-detail">
            <Detail label="Model">{d.model}</Detail>
            <Detail label="CPU">{d.cpuModel ? `${d.cpuModel} (${d.cpuArchitecture}, ${d.cpuMaxClockMhz}MHz)` : null}</Detail>
            <Detail label="CPU temperature">{d.cpuTempCelsius ? `${d.cpuTempCelsius}°C` : null}</Detail>
            <Detail label="TPM">{d.tpmFamily ? `TPM ${d.tpmFamily}` : null}</Detail>
            <Detail label="Manufactured">{d.manufactureDate}</Detail>
            {tele.data?.batteryHealth && <Detail label="Battery health">{titleCase(tele.data.batteryHealth.replace("BATTERY_HEALTH_", "").replace(/_/g, " "))}{tele.data.batteryCycleCount ? ` (${tele.data.batteryCycleCount} cycles)` : ""}</Detail>}
            {tele.data?.displays?.length > 0 && <Detail label="Displays">{tele.data.displays.map(dd => `${dd.name || "Display"}${dd.internal ? " (built-in)" : ""}`).join(", ")}</Detail>}
            {tele.data?.audioOutputDevice && <Detail label="Audio">{tele.data.audioOutputDevice}{tele.data.audioOutputVolume ? ` (${tele.data.audioOutputVolume}%)` : ""}{tele.data.audioInputDevice ? ` • ${tele.data.audioInputDevice}` : ""}</Detail>}
            {tele.data?.usbPeripherals?.length > 0 && <Detail label="USB peripherals">{tele.data.usbPeripherals.join(", ")}</Detail>}
          </div>
          <p className="device-detail-label" style={{marginTop:18, marginBottom:6}}>Storage</p>
          {tele.error ? (
            <p className="empty-note" style={{color:"var(--critical-text)"}} title={tele.error}>Not authorized yet.</p>
          ) : tele.loading && !storageTotal ? (
            <p className="empty-note">Loading...</p>
          ) : (
            <StorageBar usedBytes={storageUsed} totalBytes={storageTotal} />
          )}
          <p className="device-detail-label" style={{marginTop:18, marginBottom:6}}>Memory</p>
          {tele.error ? (
            <p className="empty-note" style={{color:"var(--critical-text)"}} title={tele.error}>Not authorized yet.</p>
          ) : tele.loading && !memTotal ? (
            <p className="empty-note">Loading...</p>
          ) : (
            <StorageBar usedBytes={memUsed} totalBytes={memTotal} />
          )}
          <p className="device-detail-label" style={{marginTop:18, marginBottom:6}}>Boot performance<InfoDot text="From the Chrome Management Telemetry API - requires the device to have reported a boot event since telemetry reporting was enabled." /></p>
          {tele.error ? (
            <p className="empty-note" style={{color:"var(--critical-text)"}}>Not authorized yet.</p>
          ) : tele.loading ? (
            <p className="empty-note">Loading...</p>
          ) : !tele.data?.lastShutdownTime && !tele.data?.bootUpDurationSeconds ? (
            <p className="empty-note">Not reported.</p>
          ) : (
            <div className="device-detail">
              <Detail label="Last boot up duration">{tele.data.bootUpDurationSeconds ? `${tele.data.bootUpDurationSeconds}s` : null}</Detail>
              <Detail label="Last shutdown">
                {tele.data.lastShutdownTime ? new Date(tele.data.lastShutdownTime).toLocaleString() : null}
                {tele.data.lastShutdownDurationSeconds ? ` (${tele.data.lastShutdownDurationSeconds}s)` : ""}
              </Detail>
              <Detail label="Shutdown reason">{tele.data.lastShutdownReason ? titleCase(tele.data.lastShutdownReason.replace(/_/g, " ")) : null}</Detail>
            </div>
          )}
        </div>
      )}

      {sub === "os" && (
        <div className="device-detail">
          <Detail label="Device ID"><code style={{fontSize:11, wordBreak:"break-all"}}>{d.id}</code></Detail>
          <Detail label="Serial number">{d.name}</Detail>
          <Detail label="Provisioning status">{provisionStatusLabel(d.provisionStatus)}</Detail>
          <Detail label="OS version">
            {d.osVersion}
            {d.osVersion && (
              d.autoUpdateExpiration && new Date(d.autoUpdateExpiration) <= new Date() ? (
                <span className="badge critical" style={{marginLeft:8}} title="Auto-update expiration has passed - this device no longer receives Chrome/OS updates">Expired</span>
              ) : (
                <span className="badge active" style={{marginLeft:8}} title={d.autoUpdateExpiration ? `Receiving updates until ${new Date(d.autoUpdateExpiration).toLocaleDateString()}` : "No auto-update expiration reported for this device"}>Compliant</span>
              )
            )}
          </Detail>
          <Detail label="Boot mode">{d.bootMode}</Detail>
          <Detail label="Firmware version">{d.firmwareVersion}</Detail>
          <Detail label="Chrome OS type">{d.chromeOsType === "chromeOsFlex" ? "Chrome OS Flex" : d.chromeOsType === "chromeOs" ? "Chrome OS" : null}</Detail>
          <Detail label="License type">{d.deviceLicenseType}</Detail>
          <Detail label="Auto-update expiration">{d.autoUpdateExpiration ? new Date(d.autoUpdateExpiration).toLocaleDateString() : null}</Detail>
          <Detail label="Support end date">{d.supportEndDate ? new Date(d.supportEndDate).toLocaleDateString() : null}</Detail>
          <Detail label="Pending update">{d.osUpdateState ? d.osUpdateState.replace("updateState", "") : "Up to date"}</Detail>
          <Detail label="Extended support">{d.extendedSupportEligible ? (d.extendedSupportEnabled ? "Enabled" : "Needs opt-in") : "Not eligible"}</Detail>
        </div>
      )}

      {sub === "network" && (
        <div className="device-detail">
          <Detail label="Last known IP">{d.lastKnownIp}</Detail>
          <Detail label="MAC (Wi-Fi)">{d.macAddress}</Detail>
          <Detail label="MAC (Ethernet)">{d.ethernetMacAddress}</Detail>
          {tele.data?.connectionState && (
            <Detail label="Connection state">
              {/* Unlike the Devices table's own connection badge, this per-device telemetry endpoint
                  returns Google's raw enum (ONLINE/CONNECTED/PORTAL/CONNECTING/NOT_CONNECTED), not a
                  pre-decoded label - map it the same way decodeConnectionState does server-side. */}
              <span className={`badge ${tele.data.connectionState === "ONLINE" ? "active" : tele.data.connectionState === "NOT_CONNECTED" ? "disconnected" : "warning"}`}>
                {CONNECTION_STATE_LABELS[tele.data.connectionState] || titleCase(tele.data.connectionState.replace(/_/g, " ").toLowerCase())}
              </span>
            </Detail>
          )}
          {tele.data?.connectionType && <Detail label="Connection type">{titleCase(tele.data.connectionType)}</Detail>}
          {tele.data?.gatewayIpAddress && <Detail label="Gateway IP">{tele.data.gatewayIpAddress}</Detail>}
          {tele.data?.latencyMs > 0 && (
            <Detail label="HTTPS latency">
              {tele.data.latencyMs.toFixed(0)}ms
              {tele.data.latencyProblem && tele.data.latencyProblem !== "HTTPS_LATENCY_PROBLEM_UNSPECIFIED" && (
                <span className="badge warning" style={{marginLeft:6}}>{titleCase(tele.data.latencyProblem.replace(/_/g, " "))}</span>
              )}
            </Detail>
          )}
        </div>
      )}

      {sub === "apps" && (
        tele.error ? (
          <p className="empty-note" style={{color:"var(--critical-text)"}}>Not authorized yet.</p>
        ) : tele.loading ? (
          <p className="empty-note">Loading...</p>
        ) : !tele.data?.appsUsage?.length ? (
          <p className="empty-note">No app usage reported.</p>
        ) : (
          <>
            {tele.data.appsUsage.map((a, i) => {
              const known = appCatalog?.[a.appId];
              const name = known?.displayName || a.appId;
              const typeLabel = known ? catalogAppTypeLabel(known.appType) : appTypeLabel(a.appType);
              return (
                <div className="app-usage-row" key={i}>
                  <span className="app-usage-name" title={known ? a.appId : ""} style={{display:"flex", alignItems:"center", gap:8}}>
                    <AppIcon appId={a.appId} displayName={known?.displayName} homepageUri={known?.homepageUri} appType={known?.appType || a.appType?.replace("APPLICATION_TYPE_", "")} />
                    <span style={{overflow:"hidden", textOverflow:"ellipsis"}}>
                      {known?.homepageUri ? <a href={known.homepageUri} target="_blank" rel="noreferrer">{name}</a> : name}
                      {typeLabel && <span style={{color:"var(--text-faint)"}}> &bull; {typeLabel}</span>}
                    </span>
                  </span>
                  <span className="app-usage-time">{formatDuration(a.runningDurationSeconds)}</span>
                </div>
              );
            })}
            <p className="card-footnote">
              Names are resolved against the fleet-wide installed-apps report (Reports tab) where the app ID matches - the same way Admin console's own Apps view does it, now paginated through the full report instead of just its first page. When an app isn't in that report at all, this falls back to Google's raw app/extension ID rather than inventing a name. Icons are the site's real favicon when there's an actual domain to fetch one from (a URL-shaped app ID, a known Google app, or a catalog homepage link) - chrome:// internal pages and bare extension IDs have no real domain to fetch from, so those keep a generic by-type icon instead of a fabricated logo.
              {tele.data?.appReportSnapshotCount != null && (
                <><br /><br /><b>Diagnostic:</b> Google returned {tele.data.appReportSnapshotCount} usage snapshot{tele.data.appReportSnapshotCount === 1 ? "" : "s"} for this device{tele.data.appReportOldestTime ? `, oldest from ${new Date(tele.data.appReportOldestTime).toLocaleString()}` : ""}. If Admin console's own Apps view shows more entries than appear here, this is very likely why - it only lists apps actually launched within whatever window Google retained for this API, not every app installed on the device. There's no "full installed-apps inventory" endpoint for a single device in the public Chrome Management API to fall back to.</>
              )}
            </p>
          </>
        )
      )}

      {sub === "actions" && (
        <DeviceActionsCard device={d} canOperate={canOperate} isAdmin={isAdmin} runAction={runAction} runDeprovision={runDeprovision} runDisable={runDisable} runDeployTracker={runDeployTracker} actionState={actionState} />
      )}

      {sub === "location" && (
        <div>
          {d.trackedLocationLat != null && d.trackedLocationLat !== 0 ? (
            <>
              <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginTop:8, marginBottom:16}}>
                <div style={{display:"flex", alignItems:"center", gap:8}}>
                  <p className="device-detail-label" style={{margin:0, color: "var(--primary)"}}>Live Tracking (Extension)</p>
                  {pingMsg && <span style={{fontSize:11, color:"var(--primary)"}}>{pingMsg}</span>}
                </div>
                <div style={{display:"flex", gap:8, alignItems:"center"}}>
                  <select 
                    value={d.trackedLocationPingInterval || 15}
                    onChange={async (e) => {
                      const val = parseInt(e.target.value, 10);
                      try {
                        await apiFetch(`${API}/location/interval`, {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({ deviceId: d.id, intervalMinutes: val })
                        });
                        if (refreshDevices) refreshDevices();
                      } catch (err) {
                        alert("Failed to update interval: " + err);
                      }
                    }}
                    style={{fontSize:11, padding:"3px 6px", borderRadius:6, border:"1px solid var(--border)", background:"var(--surface)"}}
                  >
                    <option value={1}>Ping: 1 min</option>
                    <option value={5}>Ping: 5 min</option>
                    <option value={15}>Ping: 15 min</option>
                    <option value={60}>Ping: 60 min</option>
                  </select>
                  <button
                    onClick={forcePing}
                    disabled={forcePinging}
                    style={{fontSize:11, padding:"3px 10px", borderRadius:6, border:"1px solid var(--primary)", background:"transparent", color:"var(--primary)", cursor:"pointer"}}
                  >{forcePinging ? "Waiting..." : "↻ Force Refresh"}</button>
                  <a href={`https://www.openstreetmap.org/?mlat=${d.trackedLocationLat}&mlon=${d.trackedLocationLng}#map=17/${d.trackedLocationLat}/${d.trackedLocationLng}`} target="_blank" rel="noreferrer"
                    style={{fontSize:11, padding:"3px 10px", borderRadius:6, border:"1px solid var(--border)", background:"transparent", color:"var(--text-faint)", cursor:"pointer", textDecoration:"none"}}
                  >⤢ Full Map</a>
                  <a href={`https://www.google.com/maps?q=${d.trackedLocationLat},${d.trackedLocationLng}`} target="_blank" rel="noreferrer"
                    style={{fontSize:11, padding:"3px 10px", borderRadius:6, border:"1px solid var(--border)", background:"transparent", color:"var(--text-faint)", cursor:"pointer", textDecoration:"none"}}
                  >Google Maps</a>
                </div>
              </div>

              <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:16, alignItems:"stretch"}}>
                {/* Left: Embedded Map - height matches the 4 right-side cards */}
                <div style={{borderRadius:8, overflow:"hidden", border:"1px solid var(--border)", display:"flex", flexDirection:"column", minHeight:320}}>
                  <LeafletMap lat={d.trackedLocationLat} lng={d.trackedLocationLng} history={d.locationHistory} />
                </div>

                {/* Right: Location Details Panel - 4 cards */}
                <div style={{display:"flex", flexDirection:"column", gap:10}}>
                  <div style={{background:"var(--tile-bg)", borderRadius:8, border:"1px solid var(--border)", padding:"14px 16px", flex:1}}>
                    <p style={{margin:"0 0 6px", fontSize:11, fontWeight:600, color:"var(--text-faint)", textTransform:"uppercase", letterSpacing:1}}>Coordinates</p>
                    <p style={{margin:0, fontSize:13, fontFamily:"monospace"}}>{d.trackedLocationLat.toFixed(6)}, {d.trackedLocationLng.toFixed(6)}</p>
                  </div>
                  <div style={{background:"var(--tile-bg)", borderRadius:8, border:"1px solid var(--border)", padding:"14px 16px", flex:1}}>
                    <p style={{margin:"0 0 6px", fontSize:11, fontWeight:600, color:"var(--text-faint)", textTransform:"uppercase", letterSpacing:1}}>Accuracy</p>
                    <p style={{margin:0, fontSize:13}}>±{Math.round(d.trackedLocationAccuracy)} meters</p>
                  </div>
                  <div style={{background:"var(--tile-bg)", borderRadius:8, border:"1px solid var(--border)", padding:"14px 16px", flex:1}}>
                    <p style={{margin:"0 0 6px", fontSize:11, fontWeight:600, color:"var(--text-faint)", textTransform:"uppercase", letterSpacing:1}}>Last Ping</p>
                    <p style={{margin:0, fontSize:13}}>{d.trackedLocationTime ? new Date(d.trackedLocationTime).toLocaleString() : "Unknown"}</p>
                  </div>
                  <div style={{background:"var(--tile-bg)", borderRadius:8, border:"1px solid var(--border)", padding:"14px 16px", flex:2}}>
                    <p style={{margin:"0 0 6px", fontSize:11, fontWeight:600, color:"var(--text-faint)", textTransform:"uppercase", letterSpacing:1}}>Resolved Address</p>
                    {Object.keys(geoAddress).length > 0 ? (
                      <>
                        {geoAddress.road && <p style={{margin:"0 0 3px", fontSize:13}}>{geoAddress.house_number ? `${geoAddress.house_number} ` : ""}{geoAddress.road}</p>}
                        {geoAddress.suburb && <p style={{margin:"0 0 3px", fontSize:12, color:"var(--text-faint)"}}>{geoAddress.suburb}</p>}
                        {(geoAddress.city || geoAddress.town) && <p style={{margin:"0 0 3px", fontSize:12, color:"var(--text-faint)"}}>{geoAddress.city || geoAddress.town}{geoAddress.postcode ? ` – ${geoAddress.postcode}` : ""}</p>}
                        {geoAddress.state && <p style={{margin:"0 0 3px", fontSize:12, color:"var(--text-faint)"}}>{geoAddress.state}</p>}
                        {geoAddress.country && <p style={{margin:0, fontSize:12, color:"var(--text-faint)"}}>{geoAddress.country}</p>}
                      </>
                    ) : <p style={{margin:0, fontSize:12, color:"var(--text-faint)"}}>Resolving...</p>}
                  </div>
                </div>
              </div>
            </>
          ) : (
            <div style={{padding:"32px 0", textAlign:"center"}}>
              <p style={{fontSize:32, margin:"0 0 12px"}}>📍</p>
              <p className="device-detail-label" style={{marginBottom:6}}>No location reported yet</p>
              <p className="card-footnote" style={{maxWidth:400, margin:"0 auto"}}>The Location Tracker extension hasn't sent a ping for this device. Deploy it from the <b>Actions</b> tab to start tracking.</p>
            </div>
          )}
        </div>
      )}

      {sub === "usage" && (
        <div>
          <div className="device-detail">
            <Detail label="Last seen / synced">
              {new Date(d.lastSeen).toLocaleString()}
              {d.stale && <span className="badge warning" style={{marginLeft:6}}>Stale</span>}
            </Detail>
            <Detail label="Active today">{d.activeTimeTodayMinutes != null ? `${d.activeTimeTodayMinutes} min` : null}</Detail>
            <Detail label="Recent user">{d.recentUserEmail}</Detail>
            <Detail label="Recent user count">{d.recentUserCount}</Detail>
            <Detail label="First enrolled">{d.firstEnrollmentTime ? new Date(d.firstEnrollmentTime).toLocaleDateString() : null}</Detail>
            <Detail label="Last enrolled">{d.lastEnrollmentTime ? new Date(d.lastEnrollmentTime).toLocaleDateString() : null}</Detail>
          </div>
          <p className="device-detail-label" style={{marginTop:18, marginBottom:6}}>Asset info</p>
          <div className="device-detail">
            <Detail label="Location (admin-entered)">{d.location}</Detail>
            <Detail label="Notes">{d.notes}</Detail>
            <Detail label="Order #">{d.orderNumber}</Detail>
          </div>
        </div>
      )}
    </div>
  );
}

// TopAppsSection: self-fetches the Chrome Management reports (not part of
// the /insights payload, which only covers Directory-API device data) so
// Fleet Insights can show the same app-usage picture as the Reports tab
// without requiring a tab switch.
function TopAppsSection() {
  const [chromeReports, setChromeReports] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    apiFetch(`${API}/chrome-reports`)
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
      .then(setChromeReports)
      .catch(e => setError(e.message));
  }, []);

  if (error) return (
    <>
      <p className="insight-group-title">Top consumed apps</p>
      <p className="empty-note" style={{color:"var(--critical-text)", marginBottom:16}}>Not authorized yet: {error}</p>
    </>
  );
  if (!chromeReports) return (
    <>
      <p className="insight-group-title">Top consumed apps</p>
      <p className="empty-note" style={{marginBottom:16}}>Loading...</p>
    </>
  );

  return (
    <>
      <p className="insight-group-title">Top consumed apps</p>
      <div className="cards-grid" style={{marginBottom:16}}>
        <DistributionCard
          title="Top apps &amp; extensions (by device)"
          distribution={Object.fromEntries((chromeReports.installedApps || []).map(a => [a.displayName, a.browserDeviceCount]))}
        />
        <DistributionCard
          title="Top Android apps (by user)"
          distribution={Object.fromEntries((chromeReports.androidApps || []).map(a => [a.displayName, a.osUserCount]))}
        />
      </div>
    </>
  );
}

// InsightsSkeleton: shown the first time Fleet insights is opened before the
// initial /insights fetch resolves - a shimmering placeholder shaped like
// the real stat-tile/donut layout, so the tab shows loading feedback
// instead of a blank flash while the first sync/fetch is still running.
function InsightsSkeleton() {
  return (
    <div className="card">
      <h3 className="card-title">Fleet insights</h3>
      <div className="stat-row" style={{marginBottom:16, flexWrap:"wrap"}}>
        {Array.from({length:6}).map((_, i) => (
          <div className="stat-tile" key={i}>
            <div className="skeleton" style={{height:22, width:"60%", marginBottom:8}} />
            <div className="skeleton" style={{height:11, width:"85%"}} />
          </div>
        ))}
      </div>
      <div className="donut-row">
        {Array.from({length:3}).map((_, i) => (
          <div className="donut-tile" key={i}>
            <div className="skeleton" style={{width:72, height:72, borderRadius:"50%", flexShrink:0}} />
            <div style={{flex:1}}>
              <div className="skeleton" style={{height:12, width:"70%", marginBottom:8}} />
              <div className="skeleton" style={{height:10, width:"90%", marginBottom:6}} />
              <div className="skeleton" style={{height:10, width:"60%"}} />
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

const INSIGHTS_DEFAULT_TAB_KEY = "cc_insights_default_tab";
const INSIGHTS_AUTOCYCLE_KEY = "cc_insights_autocycle";
const INSIGHTS_AUTOCYCLE_INTERVAL_KEY = "cc_insights_autocycle_interval_sec";
const CYCLE_INTERVAL_PRESETS = [5, 10, 15, 30];

function FleetHealthPanel({ insights, devices = [], onViewAll }) {
  const sections = [
    { key: "overview", label: "Overview" },
    { key: "directory", label: "Directory" },
    { key: "distributions", label: "Distributions" },
    { key: "orgunits", label: "Org units" },
    { key: "warnings", label: "Warnings & security" },
  ];

  // Default tab persists per-browser so the panel opens on whichever section
  // is most useful to this admin, instead of always resetting to Overview.
  const [defaultTab, setDefaultTab] = useState(() => localStorage.getItem(INSIGHTS_DEFAULT_TAB_KEY) || "overview");
  const [sub, setSub] = useState(defaultTab);

  // Auto-cycle: a kiosk/TV-dashboard mode that steps through every section on
  // a timer instead of requiring a click - off by default so it never
  // surprises an admin actively reading one section.
  const [autoCycle, setAutoCycle] = useState(() => localStorage.getItem(INSIGHTS_AUTOCYCLE_KEY) === "true");
  const savedInterval = Number(localStorage.getItem(INSIGHTS_AUTOCYCLE_INTERVAL_KEY)) || 10;
  const [cycleChoice, setCycleChoice] = useState(() => CYCLE_INTERVAL_PRESETS.includes(savedInterval) ? savedInterval : "custom");
  const [cycleSec, setCycleSec] = useState(savedInterval);
  const [customCycleSec, setCustomCycleSec] = useState(CYCLE_INTERVAL_PRESETS.includes(savedInterval) ? "" : String(savedInterval));

  useEffect(() => {
    if (!autoCycle) return;
    const t = setInterval(() => {
      setSub(current => {
        const idx = sections.findIndex(s => s.key === current);
        return sections[(idx + 1) % sections.length].key;
      });
    }, Math.max(1, cycleSec) * 1000);
    return () => clearInterval(t);
  }, [autoCycle, cycleSec]);

  const onDefaultTabChange = e => {
    setDefaultTab(e.target.value);
    localStorage.setItem(INSIGHTS_DEFAULT_TAB_KEY, e.target.value);
  };

  const onAutoCycleToggle = () => {
    const next = !autoCycle;
    setAutoCycle(next);
    localStorage.setItem(INSIGHTS_AUTOCYCLE_KEY, String(next));
  };

  const onCycleChoiceChange = e => {
    const v = e.target.value;
    if (v === "custom") { setCycleChoice("custom"); return; }
    const n = Number(v);
    setCycleChoice(n);
    setCycleSec(n);
    localStorage.setItem(INSIGHTS_AUTOCYCLE_INTERVAL_KEY, String(n));
  };

  const onCustomCycleSubmit = e => {
    e.preventDefault();
    const n = Number(customCycleSec);
    if (!n || n <= 0) return;
    setCycleSec(n);
    localStorage.setItem(INSIGHTS_AUTOCYCLE_INTERVAL_KEY, String(n));
  };

  return (
    <div className="card">
      <h3 className="card-title">Fleet insights<InfoDot text="Aggregated across all synced devices, refreshed on every sync (auto or manual)." /></h3>

      <div style={{display:"flex", flexWrap:"wrap", alignItems:"center", gap:16, marginBottom:14, paddingBottom:14, borderBottom:"1px solid var(--border)"}}>
        <label style={{fontSize:12, color:"var(--text-muted)", display:"flex", alignItems:"center", gap:6}}>
          Default tab on open
          <select value={defaultTab} onChange={onDefaultTabChange} style={{fontSize:12, padding:"4px 6px"}}>
            {sections.map(s => <option key={s.key} value={s.key}>{s.label}</option>)}
          </select>
        </label>

        <label style={{fontSize:12, color:"var(--text-muted)", display:"flex", alignItems:"center", gap:6, cursor:"pointer"}}>
          <input type="checkbox" checked={autoCycle} onChange={onAutoCycleToggle} />
          Auto-cycle tabs
        </label>

        {autoCycle && (
          <label style={{fontSize:12, color:"var(--text-muted)", display:"flex", alignItems:"center", gap:6}}>
            every
            <select value={cycleChoice} onChange={onCycleChoiceChange} style={{fontSize:12, padding:"4px 6px"}}>
              {CYCLE_INTERVAL_PRESETS.map(s => <option key={s} value={s}>{s}s</option>)}
              <option value="custom">Custom</option>
            </select>
          </label>
        )}
        {autoCycle && cycleChoice === "custom" && (
          <form onSubmit={onCustomCycleSubmit} style={{display:"flex", alignItems:"center", gap:6}}>
            <input type="number" min="1" placeholder="seconds" value={customCycleSec} onChange={e => setCustomCycleSec(e.target.value)} style={{width:70, fontSize:12, padding:"4px 6px"}} />
            <button type="submit" style={{fontSize:12, padding:"4px 10px"}}>Set</button>
          </form>
        )}
      </div>

      <div className="subtab-bar" style={{marginBottom:16}}>
        {sections.map(s => (
          <button key={s.key} className={`subtab-button ${sub === s.key ? "active" : ""}`} onClick={() => setSub(s.key)}>{s.label}</button>
        ))}
      </div>

      {sub === "overview" && (<>
      <p className="insight-group-title" style={{marginTop:0}}>Health overview</p>
      <div className="stat-row" style={{marginBottom:16, flexWrap:"wrap"}}>
        <div className="stat-tile">
          <div className="stat-value">{insights.totalDevices}</div>
          <div className="stat-label">Total devices</div>
        </div>
        <div className="stat-tile">
          <div className="stat-value" style={{color:"var(--pending-text)"}}>{insights.staleDevices}</div>
          <div className="stat-label">Stale (&gt;{insights.staleAfterDays}d no check-in)</div>
        </div>
        <div className="stat-tile">
          <div className="stat-value">{insights.averageFleetAgeYears}y</div>
          <div className="stat-label">Avg fleet age</div>
        </div>
        <div className="stat-tile">
          <div className="stat-value" style={{color:"var(--pending-text)"}}>{insights.devicesOverThreeYears}</div>
          <div className="stat-label">Devices &gt;3yr old</div>
        </div>
        <div className="stat-tile">
          <div className="stat-value">{insights.totalUsageMinutesToday}</div>
          <div className="stat-label">Fleet usage min. today</div>
        </div>
        <div className="stat-tile">
          <div className="stat-value">{insights.averageUsageMinutesToday}</div>
          <div className="stat-label">Avg usage min./device</div>
        </div>
      </div>

      <div className="donut-row">
        <DonutWithLegend
          title="Device status"
          info="The same signal as the Devices table's Connection column - provisioned active AND synced within the online-after threshold (Settings). To test: lower that threshold below this device's last-sync age and watch it flip to Offline."
          segments={[
            { label: "Online", value: insights.activeDevices, color: "var(--active-text)" },
            { label: "Offline", value: insights.offlineDevices, color: "#a8a6a0" },
          ]}
        />
        <DonutWithLegend
          title="Network visibility"
          info="Reporting = the last sync included a known IP address. Not reporting = Google hasn't received network telemetry for this device yet - to test, compare against a device that has never reported an IP."
          segments={[
            { label: "Reporting", value: insights.devicesWithNetworkInfo, color: "var(--primary)" },
            { label: "Not reporting", value: insights.devicesWithoutNetworkInfo, color: "#c9c7be" },
          ]}
        />
        <DonutWithLegend
          title="Provisioning status"
          info="Google's own provisioning state - all 10 real values it can report (ACTIVE, DISABLED, DEPROVISIONED, DELINQUENT, PRE_PROVISIONED, INACTIVE, RETURN_ARRIVED, RETURN_REQUESTED, SHIPPED, UNKNOWN), not just the 3 common ones - independent of whether the device has synced recently. Disable a device in Admin console to test."
          segments={Object.entries(insights.provisionStatusCounts)
            .filter(([, count]) => count > 0)
            .map(([status, count]) => ({ label: provisionStatusMeta(status).label, value: count, color: provisionStatusMeta(status).color }))}
        />
        <DonutWithLegend
          title="Boot mode"
          info="Dev mode devices have the developer hardware switch enabled and boot to a command-line shell - a security-relevant signal, since it bypasses ChromeOS's normal verified-boot restrictions."
          segments={[
            { label: "Verified", value: insights.bootModeCounts.Verified || 0, color: "var(--primary)" },
            { label: "Dev", value: insights.bootModeCounts.Dev || 0, color: "var(--critical-text)" },
          ]}
        />
        <DonutWithLegend
          title="Update status"
          info="Pending = the device has an OS update downloaded and waiting, in progress, or not yet started. Devices that stay pending for a long time miss security patches - see the Pending updates card below for which ones."
          segments={[
            { label: "Up to date", value: (insights.updateStatusCounts || {})["Up to date"] || 0, color: "var(--active-text)" },
            { label: "Pending", value: (insights.updateStatusCounts || {}).Pending || 0, color: "var(--pending-text)" },
          ]}
        />
      </div>
      </>)}

      {sub === "directory" && (<>
      <p className="insight-group-title" style={{marginTop:0}}>Directory health</p>
      <div className="stat-row" style={{marginBottom:16, flexWrap:"wrap"}}>
        <div className="stat-tile">
          <div className="stat-value">{insights.directoryHealth.totalUsers}</div>
          <div className="stat-label">Total users</div>
        </div>
        <div className="stat-tile">
          <div className="stat-value" style={{color: insights.directoryHealth.suspendedUsers ? "var(--critical-text)" : undefined}}>{insights.directoryHealth.suspendedUsers}</div>
          <div className="stat-label">Suspended users</div>
        </div>
        <div className="stat-tile">
          <div className="stat-value" style={{color: insights.directoryHealth.usersNeverLoggedIn ? "var(--pending-text)" : undefined}}>{insights.directoryHealth.usersNeverLoggedIn}</div>
          <div className="stat-label">Never logged in</div>
        </div>
        <div className="stat-tile">
          <div className="stat-value">{insights.directoryHealth.totalGroups}</div>
          <div className="stat-label">Total groups</div>
        </div>
        <div className="stat-tile">
          <div className="stat-value" style={{color: insights.directoryHealth.emptyGroups ? "var(--pending-text)" : undefined}}>{insights.directoryHealth.emptyGroups}</div>
          <div className="stat-label">Empty groups</div>
        </div>
      </div>

      <p className="insight-group-title">Enrollment trend (last 6 months)</p>
      <div className="metric-card" style={{marginBottom:16, padding:"16px 20px"}}>
        {insights.enrollmentTrend.every(p => p.count === 0) ? (
          <p className="empty-note">No devices enrolled in this window.</p>
        ) : (
          <TrendBars points={insights.enrollmentTrend} />
        )}
      </div>
      </>)}

      {sub === "distributions" && (<>
      <div className="cards-grid">
        <DistributionCard title="OS version" distribution={insights.osVersions} />
        <DistributionCard title="Model" distribution={insights.models} />
        <DistributionCard title="Firmware version" distribution={insights.firmwareVersions} />
        <DistributionCard title="License type" distribution={insights.licenseTypes} />
        <DistributionCard title="Chrome OS type" distribution={insights.chromeOsTypes} />
        <DistributionCard
          title="Location (by building)"
          distribution={insights.locations}
          info={`From Admin console's "Annotated location" field - text-based, not a literal map (no GPS data via the Directory API).${insights.devicesWithoutLocation > 0 ? ` ${insights.devicesWithoutLocation} device${insights.devicesWithoutLocation === 1 ? "" : "s"} not annotated.` : ""}`}
        />
      </div>

      <TopAppsSection />
      </>)}

      {sub === "orgunits" && (
      <table>
        <thead>
          <tr><th>Path</th><th>Total</th><th>Active</th><th>Offline</th></tr>
        </thead>
        <tbody>
          {insights.orgUnitBreakdown.map(ou => (
            <tr key={ou.path}>
              <td>{ou.path}</td>
              <td>{ou.total}</td>
              <td>{ou.active}</td>
              <td>{ou.offline}</td>
            </tr>
          ))}
        </tbody>
      </table>
      )}

      {sub === "warnings" && (
      <div className="cards-grid">
        <MetricCard
          title="Auto-update expiration" items={insights.expiringSoon} emptyText="No devices expiring soon."
          info="Devices approaching Google's Auto Update Expiration (AUE) date - after that date the device stops receiving OS/security updates."
          onViewAll={onViewAll}
          renderValue={d => (
            <span className="metric-item-value" style={{display:"flex", alignItems:"center", gap:6}}>
              {new Date(d.autoUpdateExpiration).toLocaleDateString()}
              <span className={`badge ${aueBadge(d.daysRemaining)}`}>{d.daysRemaining < 0 ? "expired" : `${d.daysRemaining}d`}</span>
            </span>
          )}
        />
        <MetricCard
          title="Pending updates" items={insights.pendingUpdateDevices} emptyText="No devices with a pending update."
          info="Devices with an OS update downloaded and waiting, in progress, or not yet started - the same devices counted as Pending in the Update status donut above."
          onViewAll={onViewAll}
          renderValue={d => <span className="badge warning">{d.value}</span>}

        <MetricCard
          title="Idle today" items={insights.idleDevices} emptyText="Every online device logged some usage today."

// CONNECTION_STATE_LABELS mirrors backend/google.go's decodeConnectionState -
// this per-device telemetry field comes back as Google's raw enum, unlike
// the Devices table's own Connection badge which is pre-decoded server-side.
const CONNECTION_STATE_LABELS = {
  ONLINE: "Online",
  CONNECTED: "Connected (no internet)",
  PORTAL: "Captive portal",
  CONNECTING: "Connecting",
  NOT_CONNECTED: "Not connected",
};

const EVENT_TYPE_LABELS = {
  NETWORK_STATE_CHANGE: "Network state change",
  USB_ADDED: "USB connected",
  USB_REMOVED: "USB disconnected",
  NETWORK_HTTPS_LATENCY_CHANGE: "HTTPS latency change",
  WIFI_SIGNAL_STRENGTH_LOW: "WiFi signal low",
  WIFI_SIGNAL_STRENGTH_RECOVERED: "WiFi signal recovered",
  VPN_CONNECTION_STATE_CHANGE: "VPN state change",
  APP_INSTALLED: "App installed",
  APP_UNINSTALLED: "App uninstalled",
  APP_LAUNCHED: "App launched",
  AUDIO_SEVERE_UNDERRUN: "Audio underrun",
};

// DeviceEventsCard: the Chrome Management Telemetry API's actual event
// stream (network changes, USB, app installs, audio/WiFi issues) - a
// different feed from Recent device actions above (portal-issued commands)
// and from the device-detail telemetry snapshots (point-in-time reads).
// This is real push-style history Google reports as things happen.
function DeviceEventsCard() {
  const [events, setEvents] = useState(null);
  const [error, setError] = useState(null);
  const [hours, setHours] = useState(24);

  const load = (h) => {
    setEvents(null);
    setError(null);
    apiFetch(`${API}/device-events?hours=${h}`)
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
      .then(setEvents)
      .catch(e => setError(e.message));
  };

  useEffect(() => { load(hours); }, [hours]);

  return (
    <div className="card">
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8}}>
        <h3 className="card-title" style={{margin:0}}>
          Device events
          <InfoDot text="Chrome Management Telemetry's event stream - network state changes, USB connect/disconnect, app installs, audio/WiFi issues, as Google's servers actually received them. Requires the telemetry scope to be authorized." />
        </h3>
        <select value={hours} onChange={e => setHours(Number(e.target.value))} style={{fontSize:12, padding:"4px 6px"}}>
          <option value={6}>Last 6 hours</option>
          <option value={24}>Last 24 hours</option>
          <option value={72}>Last 3 days</option>
          <option value={168}>Last 7 days</option>
        </select>
      </div>
      {error ? (
        <p className="empty-note" style={{color:"var(--critical-text)", marginTop:12}} title={error}>Not authorized yet: {error}</p>
      ) : !events ? (
        <p className="empty-note" style={{marginTop:12}}>Loading...</p>
      ) : events.length === 0 ? (
        <p className="empty-note" style={{marginTop:12}}>No events reported in this window.</p>
      ) : (
        <div className="scroll-list" style={{marginTop:12}}>
          {events.map(e => (
            <div className="aue-row" key={e.id}>
              <span>
                <span className="badge disconnected" style={{marginRight:8}}>{EVENT_TYPE_LABELS[e.eventType] || e.eventType}</span>
                {e.deviceName || e.deviceId} {e.description ? `– ${e.description}` : ""}
              </span>
              <span style={{display:"flex", alignItems:"center", gap:8}}>
                {e.userEmail && <span style={{fontSize:12, color:"var(--text-faint)"}}>{e.userEmail}</span>}
                <span style={{fontSize:12, color:"var(--text-muted)"}}>{new Date(e.reportTime).toLocaleString()}</span>
              </span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// MobileDevicesPanel: read-only, extends the fleet view beyond ChromeOS to
// phones/tablets under Workspace MDM (admin.directory.device.mobile.readonly,
// a new scope). Live-fetched, not polled - the mobile fleet is viewed
// occasionally like the Reports tab.
function MobileDevicesPanel() {
  const [expanded, setExpanded] = useState(false);
  const [devices, setDevices] = useState(null);
  const [error, setError] = useState(null);

  // Collapsed by default - the fetch is deferred until first expand instead
  // of firing on every Devices-tab visit, since this list is checked
  // occasionally, not on every load.
  useEffect(() => {
    if (!expanded || devices || error) return;
    apiFetch(`${API}/mobile-devices`)
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
      .then(setDevices)
      .catch(e => setError(e.message));

  return (
    <div className="card">
      <div className="metric-card-head">
        <h3 className="card-title" style={{margin:0}}>
          Mobile devices
          <InfoDot text="Phones/tablets under Workspace MDM (admin.directory.device.mobile.readonly) - read-only, separate from ChromeOS device management above." />
          {devices && <span style={{fontWeight:400, color:"var(--text-faint)"}}> ({devices.length})</span>}

        <button onClick={() => setExpanded(e => !e)}>{expanded ? "Hide" : "Show"}</button>

                <td>{d.model || "-"}</td>

                <td>{d.type || "-"}</td>

function alertSeverityBadge(severity) {
  if (severity === "HIGH") return "critical";
  if (severity === "MEDIUM") return "warning";
  return "disconnected";
}

function roleScopeBadge(scopeType) {
  return scopeType === "ORG_UNIT" ? "warning" : "disconnected";
}

// EnrollmentPanel: a guide, not an automation - neither ChromeOS enrollment
// path has a public API this connector (or any third-party admin-SDK
// integration) can call. Manual enrollment happens entirely on-device via
// OOBE sign-in; zero-touch enrollment's device-serial registration step is
// reseller-only. What IS self-service for a customer admin (generating the
// pre-provisioning token in Admin console, accepting the ZTE terms) is
// called out explicitly below rather than blurring it with the reseller-only
// part. Links out to Admin console instead of an iframe, since Google's
// admin.google.com pages send X-Frame-Options/CSP frame-ancestors headers
// that block being embedded in another origin's page - not a limitation of
// this app, an intentional security boundary on Google's side.
function EnrollmentPanel() {
  const [subtab, setSubtab] = useState("manual");
  return (
    <>
      <div className="card">
        <h3 className="card-title">
          Enrollment
          <InfoDot text="Neither enrollment path has a public API a third-party app can call - this is a guide to the two real Google-side workflows, not automation this portal performs." />
        </h3>
        <p className="empty-note" style={{marginBottom:14}}>
          ChromeOS device enrollment always happens through Google directly - either on the device itself, or through a reseller.
          There's no API this connector (or any third-party integration) can call to enroll a device on your behalf. This tab exists to make the two real paths clear, and to hand you straight to the one manual step each requires in Admin console.
        </p>
        <div className="subtab-bar">
          <button className={`subtab-button ${subtab === "manual" ? "active" : ""}`} onClick={() => setSubtab("manual")}>Manual enrollment</button>
          <button className={`subtab-button ${subtab === "zte" ? "active" : ""}`} onClick={() => setSubtab("zte")}>Zero-touch enrollment (ZTE)</button>
          <button className={`subtab-button ${subtab === "flex" ? "active" : ""}`} onClick={() => setSubtab("flex")}>ChromeOS Flex</button>
        </div>
      </div>

      {subtab === "manual" && (
        <div className="card">
          <h3 className="card-title">Manual enrollment</h3>
          <p className="empty-note" style={{marginBottom:14}}>The standard path for devices already in someone's hands - no reseller involvement, works the moment a device is powered on. This mirrors Admin console's own "Enroll device manually" wizard exactly.</p>
          <ol style={{fontSize:13, lineHeight:1.7, paddingLeft:20, margin:"0 0 16px"}}>
            <li>Turn on the ChromeOS device and connect it to a network - it'll check for updates. If it's a device that's already been used, factory reset it first.</li>
            <li>At the black setup screen, press <b>Ctrl + Alt + E</b> to start enterprise enrollment. (Not Ctrl+Alt+Shift+R - that combo is for factory reset, a separate step.)</li>
            <li>Sign in with a Google Account that's eligible for enrollment in your domain.</li>
            <li>Once enrolled, whatever policies are configured on that device's org unit apply automatically - it's ready to hand to its end user.</li>
            <li>The device appears in this portal's <b>Devices</b> tab on the next sync (auto-sync interval in Settings, or click <b>Sync now</b>). From there it's back in this portal's hands - move it to the right OU, run actions, check its status.</li>
          </ol>
          <div className="detail-card">
            <p className="detail-card-title">If step 2/3 doesn't trigger enrollment</p>
            <p style={{fontSize:13, margin:0}}>
              <b>Enrollment permission</b> for that device's org unit may be set to "Do not allow" or "Allow with the option to opt out" - both need a one-time admin change per OU before sign-in will actually enroll the device.
            </p>
            <p style={{marginTop:10}}>
              <a href="https://admin.google.com/ac/chrome/devices/enrollmenttokens" target="_blank" rel="noreferrer">Open Devices &rsaquo; Chrome &rsaquo; Enrollment tokens in Admin console &rarr;</a>
            </p>
          </div>
        </div>
      )}

      {subtab === "zte" && (
        <div className="card">
          <h3 className="card-title">Zero-touch enrollment (ZTE)</h3>
          <p className="empty-note" style={{marginBottom:14}}>
            For devices you're buying in bulk, not devices you already have - a pre-provisioning partner (your reseller/distributor) registers the device serials against your account before the devices ever ship, so they auto-enroll on first power-on with zero user interaction. This mirrors Admin console's own "Set up zero-touch enrollment" wizard.
          </p>
          <ol style={{fontSize:13, lineHeight:1.7, paddingLeft:20, margin:"0 0 16px"}}>
            <li><b>You (self-service):</b> go to <b>Devices &rsaquo; Chrome &rsaquo; Enrollment tokens</b>, click <b>Enroll</b>, choose <b>ChromeOS devices</b> (or "Non-ChromeOS devices (with ChromeOS Flex)" if that's what you're provisioning), then pick <b>Set up zero-touch enrollment</b>.</li>
            <li><b>You:</b> select the org unit the token should place devices into, then click <b>Start token generation</b> to create the pre-provisioning token. It'll show up in the Enrollment tokens table with Purpose "Zero-touch enrollment" and Status "Active."</li>
            <li><b>You:</b> share that token + your Customer ID with an <a href="https://developers.google.com/zero-touch/resources/customer-reseller-list" target="_blank" rel="noreferrer">authorized pre-provisioning partner</a>.</li>
            <li><b>Your reseller (not self-service):</b> uses the token in their reseller console to associate the purchased devices' serial numbers with your account. This step requires reseller-level access - no customer admin, and no third-party app including this one, can do it via any public API.</li>
            <li>Devices ship to end users. On first boot with a network connection, they enroll automatically into the org unit the token specifies - no sign-in prompt.</li>

          </ol>
          <div className="detail-card">
            <p className="detail-card-title">Where to do the self-service part</p>
            <p style={{fontSize:13, margin:0}}>
              Generating the token and reviewing devices your reseller has already assigned both happen outside this portal - Google doesn't expose either as an API, and their pages block being embedded in another site's frame, so an in-app iframe isn't possible. These links open Google's own pages directly.
            </p>
            <p style={{marginTop:10, display:"flex", flexDirection:"column", gap:6}}>
              <a href="https://admin.google.com/ac/chrome/devices/enrollmenttokens" target="_blank" rel="noreferrer">Devices &rsaquo; Chrome &rsaquo; Enrollment tokens (generate the token here) &rarr;</a>

            </p>
          </div>
        </div>
      )}

      {subtab === "flex" && (
        <div className="card">
          <h3 className="card-title">ChromeOS Flex</h3>
          <p className="empty-note" style={{marginBottom:14}}>
            Not a third enrollment path - a way to get existing Windows/Mac/Linux hardware onto ChromeOS in the first place, so it can then go through Manual enrollment or ZTE above like any other ChromeOS device. This tab is the pre-step those two don't cover: turning a PC into something enrollable.
          </p>
          <ol style={{fontSize:13, lineHeight:1.7, paddingLeft:20, margin:"0 0 16px"}}>
            <li>Check the device against Google's <a href="https://chromeenterprise.google/os/certified-devices/" target="_blank" rel="noreferrer">certified models list</a> - Flex installs on most x86-64 hardware, but only certified models are guaranteed full feature support (verified webcam/audio, etc).</li>
            <li>On a working computer, install the <b>Chromebook Recovery Utility</b> (Chrome Web Store) and use it to write the ChromeOS Flex image to a USB drive (8 GB+).</li>
            <li>Boot the target device from that USB drive (usually a boot-menu key at power-on) to try Flex live without installing, or choose <b>Install ChromeOS Flex</b> to replace the existing OS permanently.</li>
            <li>Once installed and signed in, the device behaves like any ChromeOS device from this portal's perspective - continue with <b>Manual enrollment</b> above for one-off installs, or reference the ZTE tab's note on "Non-ChromeOS devices (with ChromeOS Flex)" if provisioning in bulk through a reseller.</li>
          </ol>
          <div className="detail-card">
            <p className="detail-card-title">Where to do this</p>
            <p style={{fontSize:13, margin:0}}>
              Same reasoning as ZTE above - certification lookup and the installer tool are Google-hosted pages/extensions, not something this portal can embed or automate via a public API.
            </p>
            <p style={{marginTop:10, display:"flex", flexDirection:"column", gap:6}}>
              <a href="https://chromeenterprise.google/os/chromeosflex/" target="_blank" rel="noreferrer">ChromeOS Flex overview &rarr;</a>
              <a href="https://chromeenterprise.google/os/certified-devices/" target="_blank" rel="noreferrer">Certified models list &rarr;</a>
              <a href="https://chrome.google.com/webstore/detail/chromebook-recovery-utility/pocpnlppkickgojjlghddhagjaejjpco" target="_blank" rel="noreferrer">Chromebook Recovery Utility (Chrome Web Store) &rarr;</a>
            </p>
          </div>
        </div>
      )}
    </>
  );
}

// SecurityPanel: four independently-loading sections, each behind its own
// scope - Security alerts (Alert Center, covers DLP among other sources),
// Audit log (Admin SDK Reports API), Policy compliance (Chrome Policy API,
// the actual enforced value), Admin roles (who holds which Google Admin
// role). Rendered as sub-tabs instead of one long stacked scroll - each
// section still loads independently on mount so switching sub-tabs is
// instant, but only the active one is on screen at once.
// curatedPolicySchemas mirrors backend/google.go's curatedPolicySchemas list
// exactly - the small, security-relevant subset of Chrome policy schemas
// this connector resolves. Kept here (not derived from the /policies
// response) so untouched schemas still show an editable row with no
// resolved value yet, instead of disappearing - that's the exact case where
// an admin most likely wants to set one for the first time.
// PolicyEditRow: shows a curated policy's resolved value, and - for admins
// only - an inline editor that writes a real, enforced change via the
// Chrome Policy API (POST /policies/set, /policies/clear). The value
// textarea is raw JSON rather than a typed control per policy, on purpose:
// this connector can't reliably hardcode every schema's exact enum strings
// without risking a wrong literal silently rejected (or worse, accepted as
// something unintended) on a live domain - Google's own Resolve response is
// the source of truth for shape, so editing starts from exactly that.
// POLICY_GUIDES: a short "how to use this" writeup per policy, shown behind
// a Guide toggle next to Edit. Keyed by category for the 12
// dynamically-discovered categories (their exact schema/field names vary by
// customer, so the guide talks about the category's purpose and typical
// shape rather than a field name that might not match this domain's
// resolved schema) and by displayName for the 7 curated Security schemas,
// where the example value is the exact shape confirmed live against real
// mock/real resolves earlier in this project - not a guess.

  },

  "Bookmarks": { text: "Pushes bookmarks to the bookmark bar that users can't remove.", note: "Typical shape: an array of {name, url} entries, optionally nested into folders. Check the exact field name via Browse policies before writing a value for the first time." },
  "Power button options": { text: "What happens on idle or when the power button is pressed - sleep, lock, log out, shut down, or nothing.", note: "Typical shape: separate action fields per trigger (idle, power button), often as an enum like SUSPEND/LOCK/SHUT_DOWN. Confirm field names via Browse policies first." },
  "Camera": { text: "Whether sites and apps are allowed to access the camera at all in this org unit.", note: "Typical shape: a single boolean allow/deny field. Confirm the exact field name via Browse policies first." },
  "Microphone": { text: "Whether sites and apps are allowed to access the microphone at all in this org unit.", note: "Typical shape: a single boolean allow/deny field. Confirm the exact field name via Browse policies first." },

  },
  "Time-based policies": { text: "A schedule that restricts or logs devices out automatically by day and time.", note: "Typical shape: a list of {dayOfWeek, startTime, endTime} windows. Confirm the exact field name via Browse policies first." },
  "App deployments": { text: "Apps (often Android/ARC++ apps) automatically installed for users in this org unit via a managed configuration.", note: "Typical shape: a JSON-encoded managed app configuration block. Confirm the exact field name via Browse policies first." },
  "Kiosk mode": { text: "The single app a device set up as a Kiosk/managed-guest-session auto-launches.", note: "Typical shape: a Chrome Web Store app ID string. Confirm the exact field name via Browse policies first." },
  "Extensions": { text: "Extensions/apps automatically installed and enforced (users can't remove them), or blocked outright.", note: "Typical shape: a list of extension IDs, or [\"*\"] to block everything except an allowlist. Confirm the exact field name via Browse policies first." },
  "PWA deployments": { text: "Progressive web apps automatically installed and enforced for users in this org unit.", note: "Typical shape: a list of {url, defaultLaunchContainer} entries. Confirm the exact field name via Browse policies first." },
