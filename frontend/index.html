              {assetInfoError && <p className="empty-note" style={{color:"var(--critical-text)", marginTop:8}}>{assetInfoError}</p>}
              <div style={{display:"flex", gap:8, marginTop:10}}>
                <button
                  disabled={savingAssetInfo}
                  onClick={async () => {
                    setSavingAssetInfo(true);
                    setAssetInfoError("");
                    try {
                      const r = await apiFetch(`${API}/devices/asset-info`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ deviceId: d.id, ...editingAssetInfo }),
                      });
                      if (!r.ok) throw new Error(await r.text());
                      setEditingAssetInfo(null);
                      if (refreshDevices) await refreshDevices();
                    } catch (err) {
                      setAssetInfoError("Failed to save: " + err.message);
                    } finally {
                      setSavingAssetInfo(false);
                    }
                  }}
                  style={{fontSize:12, padding:"5px 14px"}}
                >{savingAssetInfo ? "Saving..." : "Save"}</button>
                <button disabled={savingAssetInfo} onClick={() => { setEditingAssetInfo(null); setAssetInfoError(""); }} style={{fontSize:12, padding:"5px 14px"}}>Cancel</button>
              </div>
              <p className="card-footnote" style={{marginTop:8}}>Writes directly to Google (the same annotatedLocation/notes/orderNumber fields Admin console's own Asset info panel edits) - this also feeds the Fleet insights "Location (by building)" card, which reads this same field.</p>
            </div>
          ) : (
            <div className="device-detail cols-5">
              <Detail label="Location (admin-entered)" info="Free-text location set by an admin, not device-reported.">{d.location}</Detail>
              <Detail label="Notes" info="Free-text notes set by an admin.">{d.notes}</Detail>
              <Detail label="Order #" info="Purchase order number, if recorded.">{d.orderNumber}</Detail>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// TopAppsSection: self-fetches the Chrome Management reports (not part of
// the /insights payload, which only covers Directory-API device data) so
// Fleet Insights can show the same app-usage picture as the Reports tab
// without requiring a tab switch.
//
// CountInstalledApps (the report this reads counts from) is a genuinely
// separate aggregation pipeline from the per-device telemetry AppUsageData
// each device's own Apps tab reads - confirmed live on this tenant: it
// returns every app that's actually installed (real names, real IDs) but
// with browserDeviceCount/osUserCount stuck at 0 for all of them, while the
// exact same apps show real non-zero usage on each device's own Apps tab.
// Most likely cause: this count only reflects Chrome Browser Cloud
// Management-enrolled browsers, which is a separate enrollment from the
// ChromeOS Directory-managed devices this connector otherwise reads -
// nothing in this connector's request is wrong, Google's own report is just
// empty for this org unless that separate enrollment exists. Rather than
// show a wall of real-looking app names next to a misleading "0", this
// falls back to counting devices directly from the same per-device
// telemetry the Apps tab already trusts, whenever Google's own counts are
// entirely zero.
// INSTALL_WINDOW_PRESETS drives TopAppsSection's install-activity lookback
// selector. "Today" isn't a fixed hour count (see todayHours() below) - it's
// however many hours have elapsed since local midnight, recomputed each
// time it's selected/re-rendered rather than cached.
const INSTALL_WINDOW_PRESETS = [
  { key: "today", label: "Today" },
  { key: "24h", label: "Last 24 hours", hours: 24 },
  { key: "7d", label: "Last 7 days", hours: 24 * 7 },
  { key: "30d", label: "Last 30 days", hours: 24 * 30 },
];
function todayHours() {
  const now = new Date();
  const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.max(1, Math.ceil((now - midnight) / (60 * 60 * 1000)));
}

function TopAppsSection({ template, devices = [] }) {
  const isHalofort = template === "halofort";
  const [chromeReports, setChromeReports] = useState(null);
  const [error, setError] = useState(null);
  const [fallbackCounts, setFallbackCounts] = useState(null); // appId -> distinct device count, only computed if needed
  const [fallbackLoading, setFallbackLoading] = useState(false);
  // installCounts is a THIRD tier, below the per-device usage fallback -
  // confirmed live that Google's per-device running-duration telemetry
  // (AppUsageData, what fallbackCounts above reads) never reports a single
  // entry of type EXTENSION on this tenant, no matter how much an extension
  // is actually used - only WEB and CHROME_APP entries ever show up, across
  // every real snapshot seen so far. Extensions apparently aren't covered by
  // that report at all. APP_INSTALLED telemetry EVENTS, on the other hand,
  // fire for extensions too (confirmed - see RecentAppInstalls above), so
  // "installed on N devices" is used as the best available real activity
  // signal for exactly the app type the usage-duration fallback can't see.
  const [installCounts, setInstallCounts] = useState(null); // appId -> distinct device count that installed it
  const [installLoading, setInstallLoading] = useState(false);
  const [installWindowKey, setInstallWindowKey] = useState("30d");

  useEffect(() => {
    apiFetch(`${API}/chrome-reports`)
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
      .then(setChromeReports)
      .catch(e => setError(e.message));
  }, []);

  const installedApps = chromeReports?.installedApps || [];
  // "Stuck at zero" specifically - not "no data at all" (that's handled by
  // the existing empty-state below) - a non-empty list where Google itself
  // never reported a single device against any app in it.
  const needsFallback = installedApps.length > 0 && installedApps.every(a => !a.browserDeviceCount);

  useEffect(() => {
    if (!needsFallback || fallbackCounts || fallbackLoading || !devices.length) return;
    setFallbackLoading(true);
    const counts = {};
    const CONCURRENCY = 6;
    let idx = 0;
    const worker = async () => {
      while (idx < devices.length) {
        const dev = devices[idx++];
        try {
          const r = await apiFetch(`${API}/devices/telemetry?id=${dev.id}`);
          if (r.ok) {
            const data = await r.json();
            const seenOnThisDevice = new Set();
            (data.appsUsage || []).forEach(a => {
              if (seenOnThisDevice.has(a.appId)) return; // one device counts once per app, even with multiple usage snapshots
              seenOnThisDevice.add(a.appId);
              counts[a.appId] = (counts[a.appId] || 0) + 1;
            });
          }
        } catch (e) { /* one device failing shouldn't block the rest */ }
      }
    };
    Promise.all(Array.from({ length: Math.min(CONCURRENCY, devices.length) }, worker))
      .then(() => { setFallbackCounts(counts); setFallbackLoading(false); });
  }, [needsFallback, devices, fallbackCounts, fallbackLoading]);

  // Window is admin-adjustable (INSTALL_WINDOW_PRESETS) - defaults to 30
  // days, the same default already used on the Health & activity events
  // section, so "install activity" here means the same thing an admin would
  // find by checking that tab manually unless they narrow it.
  useEffect(() => {
    if (!needsFallback || installLoading) return;
    setInstallLoading(true);
    const preset = INSTALL_WINDOW_PRESETS.find(p => p.key === installWindowKey);
    const hours = preset.hours || todayHours(); // "today" has no fixed hours - computed fresh on each fetch
    apiFetch(`${API}/device-events?hours=${hours}&types=APP_INSTALLED`)
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
      .then(events => {
        const counts = {};
        const seenPerApp = {}; // appId -> Set of deviceIds, so 2 installs on 1 device count once
        (events || []).forEach(e => {
          if (!e.appId) return;
          if (!seenPerApp[e.appId]) seenPerApp[e.appId] = new Set();
          if (seenPerApp[e.appId].has(e.deviceId)) return;
          seenPerApp[e.appId].add(e.deviceId);
          counts[e.appId] = (counts[e.appId] || 0) + 1;
        });
        setInstallCounts(counts);
      })
      .catch(() => setInstallCounts({}))
      .finally(() => setInstallLoading(false));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [needsFallback, installWindowKey]);

  if (error) return (
    <>
      <p className="insight-group-title">Top consumed apps</p>
      <p className="empty-note" style={{color:"var(--critical-text)", marginBottom:16}}>Not authorized yet: {error}</p>
    </>
  );
  if (!chromeReports) return (
    <>
      <p className="insight-group-title">Top consumed apps</p>
      <p className="empty-note" style={{marginBottom:16}}>Loading...</p>
    </>
  );

  // Three tiers, in priority order: Google's own fleet-wide count (richest,
  // but confirmed stuck at 0 on this tenant) -> real per-device usage
  // duration (richer signal, but only ever covers WEB/CHROME_APP, never
  // EXTENSION) -> real install-event activity (covers EXTENSION too, just a
  // coarser "installed on N devices" rather than a usage count). Only when
  // NONE of the three have anything for a given app does its count read 0.
  const bothResolved = fallbackCounts != null && installCounts != null;
  const combinedEntries = bothResolved
    ? installedApps
        .map(a => [a.displayName, (fallbackCounts[a.appId] || installCounts[a.appId] || 0)])
        .filter(([, v]) => v > 0)
    : [];
  const usingCombinedCounts = needsFallback && combinedEntries.length > 0;
  const usingUsageOnly = usingCombinedCounts && installedApps.every(a => !installCounts[a.appId] || fallbackCounts[a.appId] >= installCounts[a.appId]);
  const installedAppsDistribution = usingCombinedCounts
    ? Object.fromEntries(combinedEntries)
    : Object.fromEntries(installedApps.map(a => [a.displayName, a.browserDeviceCount]));

  const RowComponent = isHalofort ? RankedBarList : DistributionCard;
  const stillComputing = needsFallback && !bothResolved;
  const windowLabel = (INSTALL_WINDOW_PRESETS.find(p => p.key === installWindowKey) || {}).label.toLowerCase();

  return (
    <>
      <p className="insight-group-title" style={{display:"flex", alignItems:"center", gap:6, flexWrap:"wrap", justifyContent:"space-between"}}>
        <span style={{display:"flex", alignItems:"center", gap:6}}>
          Top consumed apps
          {needsFallback && !stillComputing && (
            <InfoDot text={usingCombinedCounts
              ? (usingUsageOnly
                ? "Google's fleet-wide installed-apps report returned every app name correctly but with a device count of 0 for all of them - a known gap on some Workspace/Chrome Browser Cloud Management configurations, not something wrong with this portal's own data. Counts below are computed instead from each device's own real usage telemetry (the same data each device's Apps tab already shows) so this isn't just a wall of zeros."
                : `Google's own device counts read 0 for every app, and most of these are browser extensions - confirmed live that Google's per-device usage-duration telemetry never reports entries for extensions at all (only for Chrome Apps/web apps), no matter how much they're actually used. So counts below fall back to real install activity instead: the number of devices that have actually installed each app, from real APP_INSTALLED events ${windowLabel} - a coarser signal than usage time, but a real one. Use the dropdown to narrow or widen that window.`)
              : `These apps are genuinely installed (Google's own report lists them by name), but device counts read 0 fleet-wide - a known gap on some Workspace/Chrome Browser Cloud Management configurations. Neither each device's own usage telemetry nor real install-event activity ${windowLabel} had anything for these specific apps, so no real count is available from any source right now. Try widening the window with the dropdown.`} />
          )}
        </span>
        {needsFallback && (
          <select
            value={installWindowKey}
            onChange={e => { setInstallWindowKey(e.target.value); setInstallCounts(null); }}
            title="How far back to look for real app-install activity, used as a fallback signal when Google's own device counts read 0"
            style={{fontSize:12, padding:"4px 6px"}}
          >
            {INSTALL_WINDOW_PRESETS.map(p => <option key={p.key} value={p.key}>{p.label}</option>)}
          </select>
        )}
      </p>
      <div className="cards-grid" style={{marginBottom:16}}>
        <RowComponent
          title="Top apps &amp; extensions (by device)"
          distribution={installedAppsDistribution}
        />
        <RowComponent
          title="Top Android apps (by user)"
          distribution={Object.fromEntries((chromeReports.androidApps || []).map(a => [a.displayName, a.osUserCount]))}
        />
      </div>
      {stillComputing && (
        <p className="empty-note" style={{marginTop:-10, marginBottom:16}}>Computing real app activity (Google's own report returned zeros)...</p>
      )}
    </>
  );
}

// InsightsSkeleton: shown the first time Fleet insights is opened before the
// initial /insights fetch resolves - a shimmering placeholder shaped like
// the real stat-tile/donut layout, so the tab shows loading feedback
// instead of a blank flash while the first sync/fetch is still running.

    // Shaped like the real Overview once it loads (stat-card row + donut

    // placeholder, no fabricated numbers ever get shown.
    return (

        <div className="halofort-stat-cards">
          {Array.from({ length: 6 }, (_, i) => (
            <div key={i} className="stat-tile" style={{ animationDelay: `${i * 0.04}s` }}>
              <div className="skeleton" style={{ height: 11, width: "55%", marginBottom: 10 }} />
              <div className="skeleton" style={{ height: 22, width: "40%" }} />
            </div>
          ))}
        </div>
        <div className="donut-row">
          {Array.from({ length: 3 }, (_, i) => (
            <div key={i} className="donut-tile" style={{ animationDelay: `${0.24 + i * 0.05}s` }}>
              <div className="skeleton" style={{ width: 52, height: 52, borderRadius: "50%", flexShrink: 0 }} />
              <div style={{ flex: 1 }}>
                <div className="skeleton" style={{ height: 11, width: "70%", marginBottom: 8 }} />
                <div className="skeleton" style={{ height: 11, width: "45%" }} />

  return (

    </div>
  );
}

const CUSTOM_POLICY_SCHEMAS_KEY = "cc_custom_policy_schemas";
const INSIGHTS_DEFAULT_TAB_KEY = "cc_insights_default_tab";
const INSIGHTS_AUTOCYCLE_KEY = "cc_insights_autocycle";
const INSIGHTS_AUTOCYCLE_INTERVAL_KEY = "cc_insights_autocycle_interval_sec";
const CYCLE_INTERVAL_PRESETS = [5, 10, 15, 30];
// Auto-cycle's controls now live in Settings while the actual timer runs
// inside FleetHealthPanel, which stays mounted for the whole session (tab
// switches only toggle display:none, never remount) - so a plain
// localStorage write from Settings wouldn't otherwise be noticed by the
// already-mounted panel. This event bridges the two in the same tab
// (the native `storage` event only fires in *other* tabs/windows).
const INSIGHTS_SETTINGS_EVENT = "cc-insights-settings-changed";
// Shared with SettingsPanel's "Default tab on open" control, which writes
// the same INSIGHTS_DEFAULT_TAB_KEY - kept as one list instead of two so
// the option set can't drift out of sync between the two places.
const INSIGHTS_SECTIONS = [
  { key: "overview", label: "Overview" },
  { key: "directory", label: "Directory" },
  { key: "distributions", label: "Distributions" },
  { key: "orgunits", label: "Org units" },
  { key: "warnings", label: "Warnings & security" },
  { key: "events", label: "Device events" },
];
// Halofort-only: the same six sections above, grouped into three tabs by
// what they actually answer - "how healthy is the fleet's own devices
// right now" (overview stats/donuts + version/model/license distributions,
// both device-centric), "how is the org structured" (directory users/
// groups + org unit breakdown, both directory-centric), and "what needs
// attention" (warning cards + the live event stream). Every other
// template keeps the original six-tab layout untouched - this only
// changes how Halofort groups the exact same underlying content, nothing
// is added, removed, or fabricated.
const HALOFORT_INSIGHTS_GROUPS = [
  { key: "overview", label: "Overview", icon: "nav_insights", includes: ["overview", "distributions"] },
  { key: "fleet", label: "Fleet composition", icon: "nav_directory", includes: ["directory", "orgunits"] },
  { key: "health", label: "Health & activity", icon: "nav_activity", includes: ["warnings", "events"] },
];

// RecentAppInstalls: the "By event type" card above only shows a COUNT of
// APP_INSTALLED events - it can't say which apps those were, since the raw
// telemetry event only carries Google's opaque app/extension ID. This pulls
// just the APP_INSTALLED events out of the same already-fetched event
// stream and resolves each one's ID against the fleet-wide installed-apps
// catalogue (the same lookup each device's own Apps tab and the Reports
// tab's app breakdowns already use), so admins can see real app names -
// self-fetched here since the catalogue isn't part of the events payload.
function RecentAppInstalls({ events }) {
  const [catalog, setCatalog] = useState(null);

  useEffect(() => {
    apiFetch(`${API}/chrome-reports`)
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
      .then(data => {
        const c = {};
        [...(data.installedApps || []), ...(data.androidApps || [])].forEach(a => { c[a.appId] = a; });
        setCatalog(c);
      })
      .catch(() => setCatalog({}));
  }, []);

  const installs = React.useMemo(() => (
    (events || [])
      .filter(e => e.eventType === "APP_INSTALLED")
      .sort((a, b) => new Date(b.reportTime) - new Date(a.reportTime))
  ), [events]);

  if (installs.length === 0) return null;

  return (
    <>
      <p className="insight-group-title" style={{marginTop:20}}>
        Recently installed apps
        <InfoDot text="Every app-install event in this window, resolved to its real app name against the fleet-wide installed-apps report - not just a count of how many install events happened." />
      </p>
      <div className="scroll-list" style={{maxHeight:240}}>
        {installs.slice(0, 50).map(e => {
          const known = catalog?.[e.appId];
          const name = known?.displayName || e.appId || "Unknown app";
          return (
            <div className="aue-row" key={e.id}>
              <span>{name} <span style={{color:"var(--text-muted)"}}>on {e.deviceName || e.deviceId}</span></span>
              <span style={{fontSize:12, color:"var(--text-muted)", whiteSpace:"nowrap"}}>{new Date(e.reportTime).toLocaleString()}</span>
            </div>
          );
        })}
      </div>
    </>
  );
}

function FleetHealthPanel({ insights, devices = [], onViewAll, template }) {
  const isHalofort = template === "halofort";
  const sections = isHalofort ? HALOFORT_INSIGHTS_GROUPS : INSIGHTS_SECTIONS;

  // Default tab persists per-browser so the panel opens on whichever section
  // is most useful to this admin, instead of always resetting to Overview.
  // The control for this now lives in Settings (see SettingsPanel) - read
  // once here at mount time, since that's the only moment it matters.
  // Guarded against a stored value from the *other* template's tab set
  // (e.g. "warnings" saved under the default theme, then switched to
  // Halofort where the valid keys are "overview"/"fleet"/"health").
  const [sub, setSub] = useState(() => {
    const stored = localStorage.getItem(INSIGHTS_DEFAULT_TAB_KEY);
    const valid = isHalofort ? HALOFORT_INSIGHTS_GROUPS : INSIGHTS_SECTIONS;
    return valid.some(s => s.key === stored) ? stored : valid[0].key;
  });

  // Which of the six original section keys are visible right now - for
  // every other template that's just the single active tab; for Halofort
  // it's whichever group of (up to) two original sections the active pill
  // maps to. Every existing `sub === "x"` check below becomes
  // `activeKeys.includes("x")`, so none of the underlying content/data
  // logic changes - only which combination renders at once.
  const activeKeys = isHalofort ? (sections.find(s => s.key === sub)?.includes || []) : [sub];

  // Device events - the Chrome Management Telemetry event stream, but
  // aggregated into fleet-wide graphs (event-type mix, daily trend, top
  // affected devices) instead of the raw per-device list already shown on
  // each device's own Events tab. Fetched lazily, only once this section is
  // opened.
  const [eventsRaw, setEventsRaw] = useState(null);
  const [eventsError, setEventsError] = useState(null);
  const [eventsHours, setEventsHours] = useState(168);

  useEffect(() => {
    if (!activeKeys.includes("events")) return;
    setEventsRaw(null);
    setEventsError(null);
    apiFetch(`${API}/device-events?hours=${eventsHours}`)
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
      .then(setEventsRaw)
      .catch(e => setEventsError(e.message));
  }, [sub, eventsHours]);

  // Aggregate the raw event list into the three chart shapes below - counts
  // by type (distribution), counts by day (trend), counts by device (top
  // affected). Recomputed only when the raw list or window actually changes.
  const eventInsights = React.useMemo(() => {
    if (!eventsRaw) return null;
    const byType = {};
    const byDay = {};
    const byDevice = {};
    const dayCount = Math.max(1, Math.ceil(eventsHours / 24));
    const dayKeys = [];
    const now = new Date();
    for (let i = dayCount - 1; i >= 0; i--) {
      const d = new Date(now); d.setDate(d.getDate() - i);
      const key = d.toISOString().slice(0, 10);
      dayKeys.push(key);
      byDay[key] = 0;
    }
    for (const e of eventsRaw) {
      const typeLabel = EVENT_TYPE_LABELS[e.eventType] || e.eventType;
      byType[typeLabel] = (byType[typeLabel] || 0) + 1;
      const dayKey = new Date(e.reportTime).toISOString().slice(0, 10);
      if (dayKey in byDay) byDay[dayKey] += 1;
      // Keyed by the real device ID (Telemetry's device_id is the same
      // Directory API ID used everywhere else - confirmed, not assumed) so
      // "View all" below can actually filter the Devices table, not just a
      // display name with nothing to match against.
      if (!byDevice[e.deviceId]) byDevice[e.deviceId] = { name: e.deviceName || e.deviceId, count: 0 };
      byDevice[e.deviceId].count += 1;
    }
    const trend = dayKeys.map(k => ({ key: k, label: `${k.slice(5, 7)}/${k.slice(8, 10)}`, count: byDay[k] }));
    // No slice cap here - MetricCard itself already shows only the top 3
    // with a "View all" link for the rest, same as every other warning card.
    const topDevices = Object.entries(byDevice).sort((a, b) => b[1].count - a[1].count)
      .map(([id, v]) => ({ id, name: v.name, value: v.count }));
    return { total: eventsRaw.length, byType, trend, topDevices };
  }, [eventsRaw, eventsHours]);

  // Auto-cycle: a kiosk/TV-dashboard mode that steps through every section on
  // a timer instead of requiring a click - off by default so it never
  // surprises an admin actively reading one section. The on/off toggle and
  // interval now live in Settings (see SettingsPanel) - this panel just
  // reads the current values and re-syncs live via INSIGHTS_SETTINGS_EVENT
  // whenever Settings changes them, since this panel stays mounted for the
  // whole session (tab switches just toggle display:none) rather than
  // remounting to pick up a fresh localStorage read on its own.
  const [autoCycle, setAutoCycle] = useState(() => localStorage.getItem(INSIGHTS_AUTOCYCLE_KEY) === "true");
  const [cycleSec, setCycleSec] = useState(() => Number(localStorage.getItem(INSIGHTS_AUTOCYCLE_INTERVAL_KEY)) || 10);

  useEffect(() => {
    const onSettingsChanged = () => {
      setAutoCycle(localStorage.getItem(INSIGHTS_AUTOCYCLE_KEY) === "true");
      setCycleSec(Number(localStorage.getItem(INSIGHTS_AUTOCYCLE_INTERVAL_KEY)) || 10);
    };
    window.addEventListener(INSIGHTS_SETTINGS_EVENT, onSettingsChanged);
    return () => window.removeEventListener(INSIGHTS_SETTINGS_EVENT, onSettingsChanged);
  }, []);

  useEffect(() => {
    if (!autoCycle) return;
    const t = setInterval(() => {
      setSub(current => {
        const idx = sections.findIndex(s => s.key === current);
        return sections[(idx + 1) % sections.length].key;
      });
    }, Math.max(1, cycleSec) * 1000);
    return () => clearInterval(t);
  }, [autoCycle, cycleSec]);

  // The 14 warning cards, as data instead of 14 hardcoded <MetricCard>
  // blocks - lets Halofort split them into "needs attention" (has items)
  // vs. a compact "all clear" strip without duplicating each card's props.
  // Every other template still renders all 14 in this same original order,
  // unchanged.
  const warningMetrics = [
    {
      title: "Auto-update expiration", items: insights.expiringSoon, emptyText: "No devices expiring soon.",
      info: "Devices approaching Google's Auto Update Expiration (AUE) date - after that date the device stops receiving OS/security updates.",
      renderValue: d => (
        <span className="metric-item-value" style={{display:"flex", alignItems:"center", justifyContent:"flex-end", gap:6}}>
          <span style={{overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", minWidth:0}}>{new Date(d.autoUpdateExpiration).toLocaleDateString()}</span>
          <span className={`badge ${aueBadge(d.daysRemaining)}`} style={{flexShrink:0}}>{d.daysRemaining < 0 ? "expired" : `${d.daysRemaining}d`}</span>
        </span>
      ),
    },
    {
      title: "Pending updates", items: insights.pendingUpdateDevices, emptyText: "No devices with a pending update.",
      info: "Devices with an OS update downloaded and waiting, in progress, or not yet started - the same devices counted as Pending in the Update status donut above.",
      renderValue: d => <span className="badge warning">{d.value}</span>,
    },
    {
      title: "Developer mode", items: insights.devModeDevices, emptyText: "No devices in Developer mode.",
      info: "Devices with the developer hardware switch enabled, bypassing verified boot - a security-relevant signal worth investigating if unexpected.",
      renderValue: () => <span className="badge critical">Dev mode</span>,
    },
    {
      title: "Extended support needed", items: insights.extendedSupportNeeded, emptyText: "All devices opted in or ineligible.",
      info: "Devices eligible for Chrome Extended Updates but not yet opted in - opting in extends the update window past the standard AUE date.",
      renderValue: () => <span className="badge warning">Opt-in needed</span>,
    },
    {
      title: "Low disk space", items: insights.storageWarnings, emptyText: "No devices low on disk space.",
      info: "Devices below the free-disk-space threshold set in Settings &rsaquo; Insight thresholds.",
      renderValue: d => (
        <span className="metric-item-value" style={{display:"flex", alignItems:"center", justifyContent:"flex-end", gap:6}}>
          <span style={{overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", minWidth:0}} title={`${d.freeGb}/${d.totalGb}GB free`}>{d.freeGb}/{d.totalGb}GB</span>
          <span className={`badge ${storageBadge(d.percentFree)}`} style={{flexShrink:0}}>{d.percentFree}%</span>
        </span>
      ),
    },
    {
      title: "Low memory", items: insights.ramWarnings, emptyText: "No devices low on RAM.",
      info: "Devices below the free-RAM threshold set in Settings &rsaquo; Insight thresholds.",
      renderValue: d => (
        <span className="metric-item-value" style={{display:"flex", alignItems:"center", justifyContent:"flex-end", gap:6}}>
          <span style={{overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", minWidth:0}} title={`${d.freeMb}/${d.totalMb}MB free`}>{d.freeMb}/{d.totalMb}MB</span>
          <span className={`badge ${ramBadge(d.percentFree)}`} style={{flexShrink:0}}>{d.percentFree}%</span>
        </span>
      ),
    },
    {
      title: "Orphaned devices", items: insights.orphanedDevices, emptyText: "No devices assigned to suspended users.",
      info: "The assigned user's directory account is suspended, but the device is still active - typically an offboarding step that got missed.",
      renderValue: d => <span className="badge critical" title={d.value}>suspended user</span>,
    },
    {
      title: "Login / sync mismatch", items: insights.loginSyncMismatches, emptyText: "No stale-login mismatches.",
      info: "The device has synced recently but its recorded last-login is much older - usually means it's running unattended (kiosk, shared) rather than by a signed-in user.",
      renderValue: d => <span className="metric-item-value" title={d.value}>{d.value}</span>,
    },
    {
      title: "Shared devices", items: insights.sharedDevices, emptyText: "No heavily-shared devices.",
      info: "Devices with an unusually high number of distinct user logins - a signal they're used as shared/kiosk hardware rather than 1:1 assigned.",
      renderValue: d => <span className="metric-item-value" title={d.value}>{d.value}</span>,
    },
    {
      title: "Hot CPUs", items: insights.hotDevices, emptyText: "No devices running hot.",
      info: "Devices reporting a CPU temperature above the threshold set in Settings &rsaquo; Insight thresholds.",
      renderValue: d => <span className="badge critical">{d.cpuTemp != null ? `${d.cpuTemp}°C` : "-"}</span>,
    },
    {
      title: "Outdated TPM", items: insights.outdatedTpmDevices, emptyText: "No outdated TPM firmware.",
      info: "Devices whose TPM firmware family is older than the version set in Settings &rsaquo; Insight thresholds - relevant for verified-boot and encryption guarantees.",
      renderValue: d => <span className="badge warning">{d.value}</span>,
    },
    {
      title: "Fleet churn (deprovisioned)", items: insights.churnRecords, emptyText: "No deprovisioned devices.",
      info: "Devices deprovisioned recently, with the reason Google recorded for the transition.",
      renderValue: d => <span className="metric-item-value" title={d.deprovisionReason}>{d.orgUnit}</span>,
    },
    {
      title: "Idle today", items: insights.idleDevices, emptyText: "Every online device logged some usage today.",
      info: "Devices that were online today but logged zero usage minutes - powered on but not actively used.",
      renderValue: () => <span className="badge warning">0 min used</span>,
    },
    {
      title: "Tracked location", items: devices.filter(d => d.trackedLocationLat && d.trackedLocationLat !== 0).map(d => ({ id: d.id, name: d.name, value: "Live" })),
      emptyText: "No devices reporting live location yet.",
      info: "Devices currently reporting live GPS location via the ChromeOS Location Tracker extension. Deploy it from a device's Actions tab to start tracking.",
      renderValue: d => <span className="badge active" style={{fontSize:11}}>📍 {d.value}</span>,
    },
    {
      title: "Location not reporting", items: devices.filter(d => !d.trackedLocationLat || d.trackedLocationLat === 0).map(d => ({ id: d.id, name: d.name, value: "" })),
      emptyText: "All devices are reporting location.",
      info: "Devices that do NOT have a live location reported — the extension may not be deployed or may not have pinged yet.",
      renderValue: () => <span className="badge disconnected">No location</span>,
    },
  ];

  return (
    <div className={isHalofort ? "card halofort-section-fade" : "card"} key={sub}>
      <h3 className="card-title">{template === "halofort" ? "Dashboard" : "Fleet insights"}<InfoDot text="Aggregated across all synced devices, refreshed on every sync (auto or manual)." /></h3>

      {isHalofort ? (

// CONNECTION_STATE_LABELS mirrors backend/google.go's decodeConnectionState -
// this per-device telemetry field comes back as Google's raw enum, unlike
// the Devices table's own Connection badge which is pre-decoded server-side.
// CONNECTIVITY_EVENT_META covers every real ConnectivityEvent.Type the
// backend ever writes (see backend/main.go's validIdleStates and
// setDeviceWSState) - "badge" reuses the same active/disconnected/warning
// classes used everywhere else in the app for connectivity state, so this
// timeline reads consistently with the Devices table it complements.
const CONNECTIVITY_EVENT_META = {
  ws_online: { label: "Live connection opened", badge: "active" },
  ws_offline: { label: "Live connection dropped", badge: "disconnected" },
  idle_active: { label: "Device active", badge: "active" },
  idle_idle: { label: "Device idle", badge: "warning" },
  idle_locked: { label: "Screen locked", badge: "warning" },
};

const CONNECTION_STATE_LABELS = {
  ONLINE: "Online",
  CONNECTED: "Connected (no internet)",
  PORTAL: "Captive portal",
  CONNECTING: "Connecting",
  NOT_CONNECTED: "Not connected",
};

const EVENT_TYPE_LABELS = {
  NETWORK_STATE_CHANGE: "Network state change",
  USB_ADDED: "USB connected",
  USB_REMOVED: "USB disconnected",
  NETWORK_HTTPS_LATENCY_CHANGE: "HTTPS latency change",
  WIFI_SIGNAL_STRENGTH_LOW: "WiFi signal low",
  WIFI_SIGNAL_STRENGTH_RECOVERED: "WiFi signal recovered",
  VPN_CONNECTION_STATE_CHANGE: "VPN state change",
  APP_INSTALLED: "App installed",
  APP_UNINSTALLED: "App uninstalled",
  APP_LAUNCHED: "App launched",
  AUDIO_SEVERE_UNDERRUN: "Audio underrun",
};

// DeviceEventsCard: the Chrome Management Telemetry API's actual event
// stream (network changes, USB, app installs, audio/WiFi issues) - a
// different feed from Recent device actions above (portal-issued commands)
// and from the device-detail telemetry snapshots (point-in-time reads).
// This is real push-style history Google reports as things happen.
function DeviceEventsCard() {
  const [events, setEvents] = useState(null);
  const [error, setError] = useState(null);
  const [hours, setHours] = useState(24);

  const load = (h) => {
    setEvents(null);
    setError(null);
    apiFetch(`${API}/device-events?hours=${h}`)
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
      .then(setEvents)
      .catch(e => setError(e.message));
  };

  useEffect(() => { load(hours); }, [hours]);

  return (
    <div className="card">
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8}}>
        <h3 className="card-title" style={{margin:0}}>
          Device events
          <InfoDot text="Chrome Management Telemetry's event stream - network state changes, USB connect/disconnect, app installs, audio/WiFi issues, as Google's servers actually received them. Requires the telemetry scope to be authorized." />
        </h3>
        <select value={hours} onChange={e => setHours(Number(e.target.value))} style={{fontSize:12, padding:"4px 6px"}}>
          <option value={6}>Last 6 hours</option>
          <option value={24}>Last 24 hours</option>
          <option value={72}>Last 3 days</option>
          <option value={168}>Last 7 days</option>
        </select>
      </div>
      {error ? (
        <p className="empty-note" style={{color:"var(--critical-text)", marginTop:12}} title={error}>Not authorized yet: {error}</p>
      ) : !events ? (
        <FunLoader label="Crunching the event stream..." />
      ) : events.length === 0 ? (
        <p className="empty-note" style={{marginTop:12}}>No events reported in this window.</p>
      ) : (
        <div className="scroll-list" style={{marginTop:12}}>
          {events.map(e => (
            <div className="aue-row" key={e.id}>
              <span>
                <span className="badge disconnected" style={{marginRight:8}}>{EVENT_TYPE_LABELS[e.eventType] || e.eventType}</span>
                {e.deviceName || e.deviceId} {e.description ? `– ${e.description}` : ""}
              </span>
              <span style={{display:"flex", alignItems:"center", gap:8}}>
                {e.userEmail && <span style={{fontSize:12, color:"var(--text-faint)"}}>{e.userEmail}</span>}
                <span style={{fontSize:12, color:"var(--text-muted)"}}>{new Date(e.reportTime).toLocaleString()}</span>
              </span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// MobileDevicesPanel: read-only, extends the fleet view beyond ChromeOS to
// phones/tablets under Workspace MDM (admin.directory.device.mobile.readonly,
// a new scope). Live-fetched, not polled - the mobile fleet is viewed
// occasionally like the Reports tab.
function MobileDevicesPanel({ forceExpanded }) {
  const [expanded, setExpanded] = useState(false);
  const [devices, setDevices] = useState(null);
  const [error, setError] = useState(null);
  // forceExpanded: set when the Devices tab's "Mobile" filter is selected -
  // shows (and fetches) this panel without requiring an extra manual
  // "Show" click on top of already having picked the Mobile filter.
  const isExpanded = expanded || forceExpanded;

  // Collapsed by default - the fetch is deferred until first expand instead
  // of firing on every Devices-tab visit, since this list is checked
  // occasionally, not on every load.
  useEffect(() => {
    if (!isExpanded || devices || error) return;
    apiFetch(`${API}/mobile-devices`)
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
      .then(setDevices)
      .catch(e => setError(e.message));
  }, [isExpanded]);

  return (
    <div className="card">
      <div className="metric-card-head">
        <h3 className="card-title" style={{margin:0}}>
          Mobile devices
          <InfoDot text="Phones/tablets under Workspace MDM (admin.directory.device.mobile.readonly) - read-only, separate from ChromeOS device management above." />
          {devices && <span style={{fontWeight:400, color:"var(--text-faint)"}}> ({devices.length})</span>}
        </h3>
        {!forceExpanded && <button onClick={() => setExpanded(e => !e)}>{expanded ? "Hide" : "Show"}</button>}
      </div>
      {!isExpanded ? null : error ? (
        <p className="empty-note" style={{color:"var(--critical-text)", marginTop:12}}>Not authorized yet: {error}</p>
      ) : !devices ? (
        <p className="empty-note" style={{marginTop:12}}>Loading...</p>
      ) : devices.length === 0 ? (
        <p className="empty-note" style={{marginTop:12}}>No mobile devices enrolled.</p>
      ) : (
        <table style={{marginTop:12}}>
          <thead>
            <tr><th>Owner</th><th>Model</th><th>OS</th><th>Type</th><th>Status</th><th>Last sync</th></tr>
          </thead>
          <tbody>
            {devices.map(d => (
              <tr key={d.id}>
                <td>{d.name || "-"}</td>
                <td>{d.model || "-"}</td>
                <td>{d.os || "-"}</td>
                <td>{d.type || "-"}</td>
                <td>{d.status || "-"}</td>
                <td style={{whiteSpace:"nowrap"}}>{d.lastSync ? new Date(d.lastSync).toLocaleString() : "-"}</td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );
}

function alertSeverityBadge(severity) {
  if (severity === "HIGH") return "critical";

function roleScopeBadge(scopeType) {

// fieldLabel: "safeBrowsingProtectionLevel" -> "Safe browsing protection level"
// - purely cosmetic, the real field name (needed to build the exact JSON
// Google expects) is still shown alongside it.
function policyFieldLabel(name) {
  const spaced = name.replace(/([A-Z])/g, " $1").trim();
  return spaced.charAt(0).toUpperCase() + spaced.slice(1);
}

// isBooleanKnownValues: Google's own schema catalog sometimes describes a
// genuinely boolean field as two KnownValueDescriptions with the literal
// string values "true"/"false" (confirmed live - e.g. chromeInternalUrlsBlocked),
// rather than surfacing it as a JSON-typed boolean anywhere else in the
// field description. Treated as a real signal, not a guess: exactly these
// two values, case-insensitively, and nothing else.
function isBooleanKnownValues(knownValues) {
  if (!knownValues || knownValues.length !== 2) return false;
  const lower = knownValues.map(v => String(v).toLowerCase()).sort();
  return lower[0] === "false" && lower[1] === "true";
}

// inferPolicyFieldType: picks a control for one schema field using only
// real signals - Google's own KnownValueDescriptions (enum, or the
// true/false special case above), NestedFieldDescriptions (message/object
// type), and the JS type of either the currently-resolved value or the
// schema's own documented DefaultValue (bool/number/array/object) - never a
// guess from the field's name. Arrays/nested objects fall back to a small
// per-field JSON box rather than a generic list/object builder: this
// connector can't safely assume every array field is a flat list of
// strings (managed bookmarks and forcelist entries are arrays of objects,
// for example).
function inferPolicyFieldType(field, currentValue) {
  if (isBooleanKnownValues(field.knownValues)) return "bool";
  if (field.knownValues && field.knownValues.length > 0) return "enum";
  if (field.hasNestedFields || field.isRepeated) return "complex";
  const sample = currentValue !== undefined ? currentValue : field.defaultValue;
  if (typeof sample === "boolean") return "bool";
  if (typeof sample === "number") return "number";
  if (Array.isArray(sample) || (sample && typeof sample === "object")) return "complex";
  return "text";
}

function policyFieldZeroValue(type) {
  switch (type) {
    case "bool": return false;
    case "number": return 0;
    case "complex": return [];
    case "enum": return "";
    default: return "";
  }
}
