// not the parent schema's resource name - deliberately, after a live 404
// confirmed the schema resource path this connector guessed
// ("chrome.users.apps.WebAppInstallForceList") doesn't actually exist on
// Google's side. The category schemas below (PWA deployments/App
// deployments) are found by keyword search, not a hardcoded exact name, so
// this connector can't assert in advance which schema resource Google will
// resolve to - but whichever one it is, its field name IS something Google's
// own live response reports directly, not a guess. Matching on that means a
// wrong assumption here fails safe (falls through to the generic per-field
// form below) instead of breaking anything.
//
// "extension" is deliberately NOT in this map: confirmed live that no
// schema in this domain's real Chrome Policy API catalog even contains
// "forcelist" as a substring (Browse policies search came back empty), so
// chrome.users.apps.ExtensionInstallForcelist likely isn't exposed through
// this schema surface at all. Extensions instead use InstallExtensionPanel
// below, built on chrome.users.apps.InstallType - the schema this portal's
// own "Deploy Location Tracker" action already writes successfully, so it's
// confirmed real rather than guessed.
const APP_LIST_FIELDS = {
  "webAppInstallForceList": "pwa",
  "arcPolicy": "arc",
};

// AppListEditor: lets an admin add/remove one app at a time instead of
// hand-writing the whole array (or, for ARC, the whole JSON-encoded managed
// Play config string) as raw JSON. Operates on the same valueText/setValueText
// state PolicyEditRow already uses for the whole policy object, so Save/
// Clear/org-unit-picker/confirm stay exactly as they are - this only changes
// how ONE field's value gets built.
//
// Real shapes used here (not guessed):
// - webAppInstallForceList: array of {url, default_launch_container} objects -
//   Chrome's own documented PWA force-install shape.
// - arcPolicy: a JSON-ENCODED STRING (confirmed by this codebase's own field
//   description, backend/google.go) containing a managed Google Play EMM
//   policy - only the well-documented applications[].{packageName,installType}
//   sub-shape is built/edited here; any other keys already in the string
//   (defaultPermissionPolicy, etc.) are read back and preserved untouched,
//   not clobbered.
function AppListEditor({ kind, field, valueText, setValueText }) {
  const parsed = (() => { try { return JSON.parse(valueText || "{}") || {}; } catch (e) { return {}; } })();

  let arcConfig = {};
  if (kind === "arc") {
    try { arcConfig = JSON.parse(parsed[field.name] || "{}") || {}; } catch (e) { /* not valid JSON yet - treat as empty config */ }
  }
  const entries = kind === "arc"
    ? (Array.isArray(arcConfig.applications) ? arcConfig.applications : [])
    : (Array.isArray(parsed[field.name]) ? parsed[field.name] : []);

  const commit = (newEntries) => {
    const obj = { ...parsed };
    if (kind === "arc") {
      obj[field.name] = JSON.stringify({ ...arcConfig, applications: newEntries });
    } else {
      obj[field.name] = newEntries;
    }
    setValueText(JSON.stringify(obj));
  };
  const removeAt = (i) => commit(entries.filter((_, idx) => idx !== i));

  const [newUrl, setNewUrl] = useState("");
  const [newContainer, setNewContainer] = useState("window");
  const [newPkg, setNewPkg] = useState("");
  const [newInstallType, setNewInstallType] = useState("FORCE_INSTALLED");

  const add = () => {
    if (kind === "pwa") {
      if (!newUrl.trim()) return;
      commit([...entries, { url: newUrl.trim(), default_launch_container: newContainer }]);
      setNewUrl("");
    } else if (kind === "arc") {
      if (!newPkg.trim()) return;
      commit([...entries, { packageName: newPkg.trim(), installType: newInstallType }]);
      setNewPkg("");
    }
  };

  const entryLabel = (e) => {
    if (kind === "pwa") return `${e.url}  (${e.default_launch_container || "window"})`;
    return `${e.packageName}  -  ${e.installType}`;
  };

  return (
    <div style={{marginBottom:10}}>
      <div style={{fontSize:12, fontWeight:600, marginBottom:6}}>
        {kind === "pwa" ? "Force-installed PWAs" : "Force-installed Android (ARC) apps"}
      </div>
      {entries.length === 0 ? (
        <p className="empty-note" style={{margin:"0 0 8px"}}>None yet - add one below.</p>
      ) : (
        <div style={{marginBottom:8}}>
          {entries.map((e, i) => (
            <div key={i} className="action-row" style={{marginBottom:4, padding:"6px 8px", background:"var(--hover-bg)", borderRadius:6, flexWrap:"nowrap"}}>
              <code style={{flex:1, fontSize:12, wordBreak:"break-all"}}>{entryLabel(e)}</code>
              <button onClick={() => removeAt(i)} title="Remove" style={{fontSize:11}}>✕</button>
            </div>
          ))}
        </div>
      )}
      <div className="action-row" style={{flexWrap:"wrap"}}>
        {kind === "pwa" && (
          <>
            <input placeholder="https://app.example.com/" value={newUrl} onChange={e => setNewUrl(e.target.value)} style={{flex:"1 1 260px", fontSize:12, padding:"5px 6px"}} />
            <select value={newContainer} onChange={e => setNewContainer(e.target.value)} style={{fontSize:12, padding:"5px 6px"}}>
              <option value="window">Window</option>
              <option value="tab">Tab</option>
            </select>
          </>
        )}
        {kind === "arc" && (
          <>
            <input placeholder="Package name (e.g. com.example.app)" value={newPkg} onChange={e => setNewPkg(e.target.value)} style={{flex:"1 1 260px", fontSize:12, padding:"5px 6px"}} />
            <select value={newInstallType} onChange={e => setNewInstallType(e.target.value)} style={{fontSize:12, padding:"5px 6px"}}>
              <option value="FORCE_INSTALLED">Force installed</option>
              <option value="AVAILABLE">Available (optional)</option>
              <option value="BLOCKED">Blocked</option>
              <option value="REQUIRED_FOR_SETUP">Required for setup</option>
              <option value="KIOSK">Kiosk</option>
            </select>
          </>
        )}
        <button type="button" className="btn-primary" onClick={add} style={{fontSize:12}}>+ Add</button>
      </div>
    </div>
  );
}

// PolicyFieldRow: one labeled, typed control for a single schema field -
// the friendly-form replacement for editing the whole policy as one raw
// JSON blob. `value`/`onChange` operate on just this field; PolicyEditRow
// composes all fields' values back into the one JSON object Google expects.
function PolicyFieldRow({ field, value, onChange }) {
  const type = inferPolicyFieldType(field, value);
  return (
    <div className="action-row" style={{marginBottom:10, alignItems:"flex-start", flexWrap:"nowrap"}}>
      <div style={{minWidth:170, maxWidth:170, flexShrink:0}}>
        <div style={{fontSize:12, fontWeight:600}}>{policyFieldLabel(field.name)}</div>
        <div style={{fontSize:10, color:"var(--text-faint)"}}><code>{field.name}</code></div>
        {field.description && <div style={{fontSize:11, color:"var(--text-faint)", marginTop:2}}>{field.description}</div>}
      </div>
      <div style={{flex:1, minWidth:160}}>
        {type === "enum" && (
          <select value={value ?? ""} onChange={e => onChange(e.target.value)} style={{width:"100%", fontSize:12, padding:"5px 6px"}}>
            <option value="" disabled>Choose a value...</option>
            {field.knownValues.map(v => <option key={v} value={v}>{v}</option>)}
          </select>
        )}
        {type === "bool" && (
          <span style={{display:"flex", gap:6}}>
            <button className={value ? "btn-primary" : ""} onClick={() => onChange(true)}>On</button>
            <button className={!value ? "btn-primary" : ""} onClick={() => onChange(false)}>Off</button>
          </span>
        )}
        {type === "number" && (
          <input type="number" value={value ?? 0} onChange={e => onChange(Number(e.target.value))} style={{width:"100%", fontSize:12, padding:"5px 6px", boxSizing:"border-box"}} />
        )}
        {type === "text" && (
          <input type="text" value={value ?? ""} onChange={e => onChange(e.target.value)} style={{width:"100%", fontSize:12, padding:"5px 6px", boxSizing:"border-box"}} />
        )}
        {type === "complex" && (
          <textarea value={JSON.stringify(value ?? policyFieldZeroValue(type))} onChange={e => { try { onChange(JSON.parse(e.target.value)); } catch (err) { /* mid-edit, not valid JSON yet - leave the field's own text as typed */ } }}
            placeholder="[]" style={{width:"100%", minHeight:44, fontFamily:"monospace", fontSize:11, padding:6, boxSizing:"border-box"}} />
        )}
      </div>
    </div>
  );
}

// InstallExtensionPanel: force-installs one Chrome extension by ID, built on
// chrome.users.apps.InstallType + additionalTargetKeys.app_id ("chrome:<id>")
// - the exact schema/payload shape this portal's own "Deploy Location
// Tracker" device action already writes successfully (see runDeployTracker),
// so it's confirmed real rather than another guessed schema name. Unlike
// AppListEditor's schemas, there's no single list-valued policy to batch
// into and Save later - each extension IS its own real-time write the
// moment "Install" is confirmed, same as that existing action. Deliberately
// NOT gated behind finding an "Extensions" category schema first (that
// keyword search is unreliable - confirmed live it can match an unrelated
// schema, or nothing at all) - this is reachable unconditionally at the top
// of Policy compliance instead.
function InstallExtensionPanel({ orgUnits, isAdmin }) {
  const [orgUnitPath, setOrgUnitPath] = useState("/");
  const [extId, setExtId] = useState("");
  const [confirming, setConfirming] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [installed, setInstalled] = useState([]); // this session only - InstallType has no bulk read-back to show a real persisted list here

  if (!isAdmin) return null;

  const submit = async () => {
    setBusy(true);
    setError(null);
    try {
      const res = await apiFetch(`${API}/policies/set`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          orgUnitPath: orgUnitPath || "/",
          schemaName: "chrome.users.apps.InstallType",
          appId: `chrome:${extId.trim()}`,
          value: { appInstallType: "FORCED" },
        }),
      });
      if (!res.ok) throw new Error(await res.text());
      setInstalled(list => [{ id: extId.trim(), orgUnitPath: orgUnitPath || "/", time: Date.now() }, ...list]);
      setExtId("");
      setConfirming(false);
    } catch (e) {
      setError(e.message || "Failed");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="detail-card" style={{marginBottom:14}}>
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8, marginBottom:6}}>
        <p className="detail-card-title" style={{margin:0}}>Install a Chrome extension</p>
        {/* Chrome Web Store can't be embedded here (chromewebstore.google.com
            sends X-Frame-Options: DENY, confirmed live - the same real
            limitation this portal already hit with admin.google.com
            elsewhere), so search happens in a real tab and the ID gets
            copied back. */}
        <a href="https://chromewebstore.google.com/" target="_blank" rel="noreferrer" style={{fontSize:11.5}}>Search Chrome Web Store &rarr;</a>
      </div>
      <p className="empty-note" style={{margin:"0 0 10px"}}>
        Find the extension there, copy the 32-character ID from its URL (chromewebstore.google.com/detail/&lt;name&gt;/<b>&lt;id&gt;</b>), and paste it below. This force-installs it on every device/user in the org unit you pick, effective next check-in - the same real write as this portal's own "Deploy Location Tracker" action, just for any extension instead of one fixed one.
      </p>
      <div className="action-row" style={{marginBottom:8}}>
        <label style={{fontSize:12, color:"var(--text-muted)"}}>Org unit</label>
        <select value={orgUnitPath} onChange={e => setOrgUnitPath(e.target.value)} style={{fontSize:12, padding:"4px 6px"}}>
          <option value="/">/ (root)</option>
          {(orgUnits || []).filter(ou => ou.path !== "/").map(ou => (
            <option key={ou.path} value={ou.path}>{ou.path}</option>
          ))}
        </select>
      </div>
      <div className="action-row" style={{flexWrap:"wrap"}}>
        <input placeholder="Extension ID (32 lowercase letters)" value={extId} onChange={e => setExtId(e.target.value)}
          disabled={confirming} style={{flex:"1 1 300px", fontSize:12, padding:"5px 6px"}} />
        {confirming ? (
          <>
            <span className="empty-note" style={{color:"var(--critical-text)"}}>Force-install on {orgUnitPath}?</span>
            <button disabled={busy} className="btn-danger" onClick={submit}>{busy ? "Installing..." : "Yes, install"}</button>
            <button disabled={busy} onClick={() => setConfirming(false)}>Cancel</button>
          </>
        ) : (
          <ActionButton icon="enable" disabled={!extId.trim()} onClick={() => setConfirming(true)}>Install</ActionButton>
        )}
      </div>
      {error && <p className="empty-note" style={{color:"var(--critical-text)", marginTop:8}}>{error}</p>}
      {installed.length > 0 && (
        <div style={{marginTop:10}}>
          <div style={{fontSize:11, color:"var(--text-faint)", marginBottom:4}}>Installed this session (Google doesn't expose a bulk read-back for this, so this list is local only):</div>
          {installed.map((e, i) => (
            <div key={i} style={{fontSize:12, marginBottom:2}}><code>{e.id}</code> on {e.orgUnitPath}</div>
          ))}
        </div>
      )}
    </div>
  );
}

function PolicyEditRow({ schema, resolved, isAdmin, orgUnits, onChanged, fields, description, category, onAddToCompliance, isInCompliance, onRemoveFromCompliance }) {
  const [editing, setEditing] = useState(false);
  const [orgUnitPath, setOrgUnitPath] = useState("/");
  const [valueText, setValueText] = useState("");
  const [confirming, setConfirming] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [done, setDone] = useState(null); // "set" | "clear" | null
  const [showGuide, setShowGuide] = useState(false);
  const [forceRaw, setForceRaw] = useState(false);
  const guide = POLICY_GUIDES[category] || POLICY_GUIDES[schema.displayName];

  const startEditing = (prefill) => {
    let initial = prefill != null ? prefill : (resolved?.value || "");
    // When real field metadata is known, prefill EVERY field (not just
    // whichever ones happen to already be set) so the composed object
    // always carries the schema's complete field set - some real schemas
    // reject a write that only names a subset of their fields (see the
    // policyUpdateMask comment in backend/google.go), so building from a
    // complete object here avoids that footgun by construction.
    if (prefill == null && fields && fields.length > 0) {
      let existing = {};
      try { existing = JSON.parse(resolved?.value || "{}") || {}; } catch (e) { /* unset or not JSON - start blank */ }
      const obj = {};
      fields.forEach(f => {
        if (existing[f.name] !== undefined) obj[f.name] = existing[f.name];
        else if (f.defaultValue !== undefined) obj[f.name] = f.defaultValue;
        else obj[f.name] = policyFieldZeroValue(inferPolicyFieldType(f, undefined));
      });
      initial = JSON.stringify(obj);
    }
    setValueText(initial);
    setError(null);
    setDone(null);
    setEditing(true);
    setShowGuide(false);
    setForceRaw(false);
  };

  // simpleBoolField: when the current value is exactly one boolean field -
  // by far the most common curated-schema shape (guestModeEnabled,
  // devicePowerwashAllowed, audioCaptureAllowed, videoCaptureAllowed, ...) -
  // show a toggle instead of raw JSON. Anything else (enums, arrays, nested
  // objects, multi-field schemas like Blocked URLs) falls back to the JSON
  // textarea: guessing a generic form control for every possible Chrome
  // policy shape without knowing its real proto type risks building
  // something that looks right but silently sends the wrong structure.
  let simpleBoolField = null, simpleBoolValue = null;
  if (!forceRaw) {
    try {
      const parsed = JSON.parse(valueText);
      const keys = Object.keys(parsed);
      if (keys.length === 1 && typeof parsed[keys[0]] === "boolean") {
        simpleBoolField = keys[0];
        simpleBoolValue = parsed[keys[0]];
      }
    } catch (e) { /* not simple JSON yet (e.g. blank, or mid-edit) - stays in raw mode */ }
  }

  const submit = async (kind) => {
    setBusy(true);
    setError(null);
    try {
      if (kind === "set") {
        let parsed;
        try { parsed = JSON.parse(valueText); } catch (e) { throw new Error("Value must be valid JSON, e.g. " + '{"fieldName": true}'); }
        const res = await apiFetch(`${API}/policies/set`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ orgUnitPath, schemaName: schema.schema, value: parsed }),
        });
        if (!res.ok) throw new Error(await res.text());
      } else {
        const res = await apiFetch(`${API}/policies/clear`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ orgUnitPath, schemaName: schema.schema }),
        });
        if (!res.ok) throw new Error(await res.text());
      }
      setDone(kind);
      setConfirming(false);
      if (onChanged) onChanged();
    } catch (e) {
      setError(e.message || "Failed");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="detail-card" style={{marginBottom:8}}>
      <div className="aue-row" style={{border:"none", padding:0}}>
        <span>{schema.displayName}<span style={{marginLeft:6, fontSize:11, color:"var(--text-faint)"}}>{schema.schema}</span></span>
        <span style={{display:"flex", alignItems:"center", gap:8}}>
          <code style={{fontSize:11}}>{resolved?.value || "(not explicitly set - inherited default)"}</code>
          {isAdmin && !editing && <ActionButton icon="edit" onClick={() => startEditing()} title="Edit or clear this policy on an org unit" />}
          {guide && !editing && (
            <ActionButton icon="help" onClick={() => setShowGuide(s => !s)} title="How to use this policy, with a real example" />
          )}
          {/* Browse policies -> Policy compliance: a purely local (this
              browser only, via localStorage) addition, not a real domain
              change - lets a found schema show up as a real resolved row/
              tile without needing a backend concept of saved schema lists. */}
          {onAddToCompliance && !isInCompliance && (
            <button onClick={onAddToCompliance} style={{fontSize:11, padding:"4px 8px"}} title="Add to Policy compliance - shows this schema's resolved value there (this browser only)">+ Add</button>
          )}
          {onAddToCompliance && isInCompliance && (
            <span style={{fontSize:11, color:"var(--active-text)"}}>&#10003; Added</span>
          )}
          {onRemoveFromCompliance && (
            <ActionButton icon="disable" onClick={onRemoveFromCompliance} title="Remove this schema from Policy compliance (this browser only)" />
          )}
        </span>
      </div>
      {description && <p className="empty-note" style={{margin:"6px 0 0"}}>{description}</p>}

      {showGuide && guide && !editing && (
        <div className="card-footnote" style={{margin:"8px 0 0", padding:8, background:"var(--hover-bg)", borderRadius:6}}>
          <p style={{margin:0}}>{guide.text}</p>
          {guide.example && (
            <p style={{margin:"6px 0 0"}}><code>{guide.example}</code></p>
          )}
          {guide.note && <p style={{margin:"6px 0 0", color:"var(--text-faint)"}}>{guide.note}</p>}
          {isAdmin && guide.example && (
            <button style={{marginTop:8}} onClick={() => startEditing(guide.example)}>Use this example</button>
          )}
        </div>
      )}

      {editing && (
        <div style={{marginTop:10, paddingTop:10, borderTop:"1px solid var(--border)"}}>
          <div className="action-row" style={{marginBottom:8}}>
            <label style={{fontSize:12, color:"var(--text-muted)"}}>Org unit</label>
            <select value={orgUnitPath} onChange={e => setOrgUnitPath(e.target.value)} style={{fontSize:12, padding:"4px 6px"}}>
              <option value="/">/ (root)</option>
              {(orgUnits || []).filter(ou => ou.path !== "/").map(ou => (
                <option key={ou.path} value={ou.path}>{ou.path}</option>
              ))}
            </select>
          </div>
          {fields && fields.length === 1 && APP_LIST_FIELDS[fields[0].name] && !forceRaw ? (
            <div style={{marginBottom:4}}>
              <AppListEditor kind={APP_LIST_FIELDS[fields[0].name]} field={fields[0]} valueText={valueText} setValueText={setValueText} />
              <button style={{fontSize:11}} onClick={() => setForceRaw(true)} title="Switch to editing the raw JSON value directly">Edit as raw JSON</button>
            </div>
          ) : fields && fields.length > 0 && !forceRaw ? (
            <div style={{marginBottom:4}}>
              {fields.map(f => {
                let current;
                try { current = JSON.parse(valueText || "{}")[f.name]; } catch (e) { current = undefined; }
                return (
                  <PolicyFieldRow key={f.name} field={f} value={current} onChange={v => {
                    let obj = {};
                    try { obj = JSON.parse(valueText || "{}") || {}; } catch (e) { /* was blank/invalid - start from this field alone */ }
                    obj[f.name] = v;
                    setValueText(JSON.stringify(obj));
                  }} />
                );
              })}
              <button style={{fontSize:11}} onClick={() => setForceRaw(true)} title="Switch to editing the raw JSON value directly">Edit as raw JSON</button>
            </div>
          ) : simpleBoolField ? (
            <div className="action-row" style={{marginBottom:6}}>
              <label style={{fontSize:12, color:"var(--text-muted)"}}><code>{simpleBoolField}</code></label>
              <button className={simpleBoolValue ? "btn-primary" : ""} onClick={() => setValueText(JSON.stringify({ [simpleBoolField]: true }))}>On</button>
              <button className={!simpleBoolValue ? "btn-primary" : ""} onClick={() => setValueText(JSON.stringify({ [simpleBoolField]: false }))}>Off</button>
              <button style={{fontSize:11}} onClick={() => setForceRaw(true)} title="Switch to editing the raw JSON value directly">Edit as raw JSON</button>
            </div>
          ) : (
            <>
              <textarea value={valueText} onChange={e => setValueText(e.target.value)}
                placeholder={'{"fieldName": true}'}
                style={{width:"100%", minHeight:60, fontFamily:"monospace", fontSize:12, padding:6, boxSizing:"border-box"}} />
              {fields && fields.length > 0 && (
                <button style={{fontSize:11, marginTop:6}} onClick={() => setForceRaw(false)} title="Switch back to the guided per-field form">Back to guided form</button>
              )}
            </>
          )}
          <p className="card-footnote" style={{margin:"6px 0"}}>
            {fields && fields.length === 1 && APP_LIST_FIELDS[fields[0].name] && !forceRaw
              ? "Add or remove one app at a time - each becomes an entry in the same list Google's Chrome Policy API expects underneath."
              : fields && fields.length > 0 && !forceRaw
              ? "Each field above writes into the same JSON object Google's Chrome Policy API expects - shown as a dropdown, toggle, or text box depending on that field's real type."
              : simpleBoolField
              ? "This schema resolves to a single true/false field, so it's shown as a toggle - the write underneath is the exact same JSON object either way."
              : "A JSON object - its key(s) must match the field name(s) Google's own resolved value uses for this schema (see the code above, when present; some schemas have more than one field, e.g. Blocked URLs' urlBlocklist + chromeInternalUrlsBlocked - include every field you want set)."}
            {" "}This is a REAL write: it changes what's enforced on every device/user in the org unit you picked, effective next check-in.
          </p>

          {error && <p className="empty-note" style={{color:"var(--critical-text)"}}>{error}</p>}
          {done && <p className="empty-note" style={{color:"var(--active-text)"}}>{done === "set" ? "Policy updated." : "Policy cleared - now inheriting from parent."}</p>}

          {confirming ? (
            <div className="action-row">
              <span className="empty-note" style={{color:"var(--critical-text)", flexBasis:"100%"}}>
                This changes a real, enforced policy on {orgUnitPath} right now. Confirm?
              </span>
              <button disabled={busy} className="btn-danger" onClick={() => submit("set")}>Yes, apply</button>
              <button disabled={busy} onClick={() => setConfirming(false)}>Cancel</button>
            </div>
          ) : (
            <div className="action-row">
              <ActionButton icon="enable" disabled={busy || !valueText.trim()} onClick={() => setConfirming(true)}>Save</ActionButton>
              <ActionButton icon="disable" disabled={busy} className="btn-danger" title="Remove the override on this org unit so it inherits from its parent" onClick={() => submit("clear")}>Clear (inherit)</ActionButton>
              <button disabled={busy} onClick={() => setEditing(false)}>Close</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function SecurityPanel({ isAdmin, template }) {
  const isHalofort = template === "halofort";
  const [subtab, setSubtab] = useState("alerts");
  // Halofort's Policy compliance tile grid - which category is drilled
  // into, or null for the tile grid itself. Irrelevant for other templates.
  const [policyCategory, setPolicyCategory] = useState(null);
  const [alerts, setAlerts] = useState(null);
  const [alertsError, setAlertsError] = useState(null);
  const [auditLog, setAuditLog] = useState(null);
  const [auditError, setAuditError] = useState(null);
  const [policies, setPolicies] = useState(null);
  const [policiesError, setPoliciesError] = useState(null);
  // Schemas "added" from Browse policies into Policy compliance - a purely
  // local (this browser's localStorage) list, not a real domain change.
  // Lets a found schema show up as a real resolved row/tile in an existing
  // category (or a brand-new one) without a backend concept of saved
  // per-customer schema lists.
  const [customPolicySchemas, setCustomPolicySchemas] = useState(() => {
    try { return JSON.parse(localStorage.getItem(CUSTOM_POLICY_SCHEMAS_KEY)) || []; } catch { return []; }
  });
  const [customPolicyValues, setCustomPolicyValues] = useState({}); // schemaName -> resolved PolicyValue

  const addCustomPolicySchema = (entry) => {
    setCustomPolicySchemas(list => {
      if (list.some(s => s.schemaName === entry.schemaName)) return list;
      const next = [...list, entry];
      localStorage.setItem(CUSTOM_POLICY_SCHEMAS_KEY, JSON.stringify(next));
      return next;
    });
  };
  const removeCustomPolicySchema = (schemaName) => {
    setCustomPolicySchemas(list => {
      const next = list.filter(s => s.schemaName !== schemaName);
      localStorage.setItem(CUSTOM_POLICY_SCHEMAS_KEY, JSON.stringify(next));
      return next;
    });
    setCustomPolicyValues(v => { const n = { ...v }; delete n[schemaName]; return n; });
  };

  // Resolve any custom schema that doesn't have a cached value yet -
  // whenever the list grows (a new "+ Add" click, or the persisted list
  // loading on mount).
  useEffect(() => {
    const missing = customPolicySchemas.filter(s => !(s.schemaName in customPolicyValues));
    if (missing.length === 0) return;
    missing.forEach(s => {
      apiFetch(`${API}/policies/resolve?schema=${encodeURIComponent(s.schemaName)}&displayName=${encodeURIComponent(s.displayName)}&category=${encodeURIComponent(s.category)}`)
        .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
        .then(v => setCustomPolicyValues(cur => ({ ...cur, [s.schemaName]: v })))
        .catch(() => setCustomPolicyValues(cur => ({ ...cur, [s.schemaName]: { ...s, value: "" } })));
    });
  }, [customPolicySchemas]);

  // The merged list every Policy compliance view (tile grid + flat list)
  // renders from - curated results plus whatever's been added from Browse,
  // each shown with its own real resolved value (or blank/"resolving" until
  // that fetch above finishes).
  const allPolicies = React.useMemo(() => {
    const custom = customPolicySchemas.map(s => customPolicyValues[s.schemaName] || { ...s, value: "" });
    return [...(policies || []), ...custom];
  }, [policies, customPolicySchemas, customPolicyValues]);
  const [roles, setRoles] = useState(null);
  const [rolesError, setRolesError] = useState(null);
  const [orgUnits, setOrgUnits] = useState(null);
  const [browseQuery, setBrowseQuery] = useState("");
  const [browseResults, setBrowseResults] = useState(null);
  const [browseError, setBrowseError] = useState(null);
  const [browseLoading, setBrowseLoading] = useState(false);
  const [alertBusy, setAlertBusy] = useState({}); // alertId -> action currently running
  const [alertFeedbackGiven, setAlertFeedbackGiven] = useState({}); // alertId -> feedbackType submitted
  const [undoBanner, setUndoBanner] = useState(null); // {id, type} of the alert just deleted, or null

  const reloadAlerts = () => apiFetch(`${API}/security-alerts`)
    .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
    .then(setAlerts).catch(e => setAlertsError(e.message));

  // runAlertAction hits the Alert Center API's real write surface -
  // delete/undelete/feedback are the only real actions available (there's
  // no public API to set an alert's Status/Assignee despite those fields
  // existing in Google's schema). Delete is real and live on Google's side
  // (it disappears from Admin console's own Alert Center too, not just this
  // list), so a delete shows an Undo banner backed by the real Undelete
  // call rather than just a local hide.
  const runAlertAction = async (alert, action, feedbackType) => {
    setAlertBusy(b => ({ ...b, [alert.id]: action }));
    try {
      const res = await apiFetch(`${API}/security-alerts/action`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ alertId: alert.id, action, feedbackType }),
      });
      if (!res.ok) throw new Error(await res.text());
      if (action === "delete") {
        setUndoBanner({ id: alert.id, type: alert.type });
        reloadAlerts();
      } else if (action === "undelete") {
        setUndoBanner(null);
        reloadAlerts();
      } else if (action === "feedback") {
        setAlertFeedbackGiven(f => ({ ...f, [alert.id]: feedbackType }));
      }
    } catch (e) {
      setAlertsError(e.message || "Failed");
    } finally {
      setAlertBusy(b => { const n = { ...b }; delete n[alert.id]; return n; });
    }
  };

  // runBrowseSearch hits the Chrome Policy API's real schema catalog - how
  // app/network/kiosk/print management (and anything else Google exposes as
  // a policy) are reached here, instead of four separate hardcoded
  // integrations. A blank query returns Google's first page of schemas
  // as-is, so "Search" with nothing typed still shows something real.
  const runBrowseSearch = () => {
    setBrowseLoading(true);
    setBrowseError(null);
    apiFetch(`${API}/policies/search?q=${encodeURIComponent(browseQuery)}`)
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
      .then(r => setBrowseResults(r || []))
      .catch(e => setBrowseError(e.message))
      .finally(() => setBrowseLoading(false));
  };

  const reloadPolicies = () => apiFetch(`${API}/policies`)
    .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
    .then(setPolicies).catch(e => setPoliciesError(e.message));

  useEffect(() => {
    apiFetch(`${API}/security-alerts`)
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
      .then(setAlerts).catch(e => setAlertsError(e.message));
    apiFetch(`${API}/audit-log`)
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
      .then(setAuditLog).catch(e => setAuditError(e.message));
    reloadPolicies();
    apiFetch(`${API}/admin-roles`)
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); })
      .then(setRoles).catch(e => setRolesError(e.message));
    // Org units for the policy editor's target picker - same directory
    // data the Directory tab shows, fetched here too since a policy edit
    // needs the OU list regardless of whether that tab's ever been opened.
    apiFetch(`${API}/directory`)
      .then(r => r.json()).then(d => setOrgUnits(d.orgUnits || []))
      .catch(() => setOrgUnits([]));
  }, []);

  const subtabs = [
    { key: "alerts", label: "Alerts", count: alerts?.length },
    { key: "audit", label: "Audit log", count: auditLog ? auditLog.adminActivity.length + auditLog.loginActivity.length : undefined },
    { key: "policies", label: "Policy compliance", count: policies ? allPolicies.length : undefined },
    { key: "browse", label: "Browse policies" },
    { key: "roles", label: "Admin roles", count: roles?.length },
  ];

  return (
    <>
      <div className="subtab-bar">
        {subtabs.map(s => (
          <button key={s.key} className={`subtab-button ${subtab === s.key ? "active" : ""}`} onClick={() => setSubtab(s.key)}>
            {s.label}{s.count != null && <span className="subtab-count">({s.count})</span>}
          </button>
        ))}
      </div>

      {subtab === "alerts" && (
        <div className="card">
          <h3 className="card-title">Security alerts<InfoDot text="Alerts raised by Google's Security Investigation Tool/Alert Center - not generated by this portal." /></h3>
          {alertsError ? (
            <p className="empty-note" style={{color:"var(--critical-text)", maxHeight:90, overflowY:"auto"}} title={alertsError}>Not authorized yet: {alertsError}</p>
          ) : !alerts ? (
            <p className="empty-note">Loading...</p>
          ) : alerts.length === 0 ? (
            <p className="empty-note">No security alerts.</p>
          ) : (
            <div className="scroll-list">
              <DonutWithLegend
                title="By severity"
                segments={[
                  { label: "High", value: alerts.filter(a => a.severity === "HIGH").length, color: "var(--critical-text)" },
                  { label: "Medium", value: alerts.filter(a => a.severity === "MEDIUM").length, color: "var(--pending-text)" },
                  { label: "Low / other", value: alerts.filter(a => a.severity !== "HIGH" && a.severity !== "MEDIUM").length, color: "#a8a6a0" },
                ]}
              />
              <div style={{marginTop:14, paddingTop:10, borderTop:"1px solid var(--border)"}} />
              {undoBanner && (
                <div className="empty-note" style={{display:"flex", alignItems:"center", justifyContent:"space-between", background:"var(--hover-bg)", borderRadius:6, padding:8, marginBottom:8}}>
                  <span>Deleted "{undoBanner.type}" - this is a real, live delete on Google's side (Admin console's Alert Center too).</span>
                  <button onClick={() => runAlertAction({ id: undoBanner.id, type: undoBanner.type }, "undelete")}>Undo</button>
                </div>
              )}
              {alerts.map(a => (
                <div className="aue-row" key={a.id} style={{flexWrap:"nowrap", alignItems:"center"}}>
                  <span style={{flex:1, minWidth:0, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{a.type} &bull; {a.source}</span>
                  <span style={{display:"flex", alignItems:"center", gap:8, flexShrink:0}}>
                    <span style={{fontSize:12, color:"var(--text-muted)", whiteSpace:"nowrap"}}>{a.createTime ? new Date(a.createTime).toLocaleDateString() : "-"}</span>
                    <span className={`badge ${alertSeverityBadge(a.severity)}`}>{a.severity || "unknown"}</span>
                    {isAdmin && (
                      <span style={{display:"flex", alignItems:"center", gap:5, flexShrink:0}}>
                        {alertFeedbackGiven[a.id] ? (
                          <span style={{fontSize:11, color:"var(--text-faint)", whiteSpace:"nowrap"}}>Feedback: {alertFeedbackGiven[a.id]}</span>
                        ) : (
                          <>
                            <span style={{fontSize:11, color:"var(--text-faint)", whiteSpace:"nowrap"}}>Useful?</span>
                            <button disabled={!!alertBusy[a.id]} title="Submit feedback to Google: this alert was very useful" onClick={() => runAlertAction(a, "feedback", "VERY_USEFUL")} style={{padding:"2px 8px", fontSize:12}}>Yes</button>
                            <button disabled={!!alertBusy[a.id]} title="Submit feedback to Google: this alert was not useful" onClick={() => runAlertAction(a, "feedback", "NOT_USEFUL")} style={{padding:"2px 8px", fontSize:12}}>No</button>
                          </>
                        )}
                        <ActionButton icon="wipe" disabled={!!alertBusy[a.id]} className="btn-danger" style={{padding:"2px 8px"}}
                          title={alertBusy[a.id] === "delete" ? "Deleting..." : "Delete this alert on Google's side (recoverable via Undo)"} onClick={() => runAlertAction(a, "delete")} />
                      </span>
                    )}
                  </span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {subtab === "audit" && (
        <div className="card">
          <h3 className="card-title">Audit log<InfoDot text="Google's own admin/login activity reports (reports.audit.readonly) - a record of what happened in the Admin console and directory, not this portal's Recent device actions." /></h3>
          {auditError ? (
            <p className="empty-note" style={{color:"var(--critical-text)", maxHeight:90, overflowY:"auto"}} title={auditError}>Not authorized yet: {auditError}</p>
          ) : !auditLog ? (
            <p className="empty-note">Loading...</p>
          ) : (
            <div className="scroll-list">
              <p className="insight-group-title">Admin activity</p>
              {auditLog.adminActivity.length === 0 ? <p className="empty-note">No recent admin activity.</p> : auditLog.adminActivity.map((e, i) => (
                <div className="aue-row" key={i}>
                  <span>{e.actorEmail} &bull; {e.eventName}</span>
                  <span style={{fontSize:12, color:"var(--text-muted)"}}>{e.time ? new Date(e.time).toLocaleString() : "-"}</span>
                </div>
              ))}
              <p className="insight-group-title">Login activity</p>
              {auditLog.loginActivity.length === 0 ? <p className="empty-note">No recent login activity.</p> : auditLog.loginActivity.map((e, i) => (
                <div className="aue-row" key={i}>
                  <span>{e.actorEmail} &bull; {e.eventName}</span>
                  <span style={{fontSize:12, color:"var(--text-muted)"}}>{e.time ? new Date(e.time).toLocaleString() : "-"}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {subtab === "policies" && (
        <div className="card">
          <h3 className="card-title">Policy compliance</h3>
          <p className="empty-note" style={{marginBottom:12}}>
            Actual enforced values for a curated set of security-relevant policies, resolved against the root org unit.
            {isAdmin && " Admins can edit or clear any of these below - this writes a real, enforced policy change on the org unit you pick, the same as an edit in Admin console, effective on the next device/user check-in."}
          </p>
          <InstallExtensionPanel orgUnits={orgUnits} isAdmin={isAdmin} />
          {policiesError ? (
            <p className="empty-note" style={{color:"var(--critical-text)", maxHeight:90, overflowY:"auto"}} title={policiesError}>Not authorized yet: {policiesError}</p>
          ) : !policies ? (
            <p className="empty-note">Loading...</p>
          ) : allPolicies.length === 0 ? (
            <p className="empty-note">No policy schemas found for this customer.</p>
          ) : isHalofort ? (
            (() => {
              const groups = groupBy(allPolicies, p => p.category || "Security");
              if (policyCategory) {
                const rows = (groups.find(([c]) => c === policyCategory) || [null, []])[1];
                return (
                  <>
                    <button onClick={() => setPolicyCategory(null)}
                      style={{display:"flex", alignItems:"center", gap:8, background:"none", border:"none", cursor:"pointer", fontSize:14, fontWeight:600, padding:"4px 0", marginBottom:14, color:"var(--text)"}}>
                      &larr; {policyCategory}
                    </button>
                    <div className="scroll-list">
                      {rows.map(p => (
                        <PolicyEditRow key={p.schemaName} schema={{ schema: p.schemaName, displayName: p.displayName }}
                          resolved={p} isAdmin={isAdmin} orgUnits={orgUnits} onChanged={reloadPolicies} category={policyCategory} fields={p.fields}
                          onRemoveFromCompliance={customPolicySchemas.some(s => s.schemaName === p.schemaName) ? () => removeCustomPolicySchema(p.schemaName) : undefined} />
                      ))}
                    </div>
                  </>
                );
              }
              // Tile grid: one tile per real category the backend actually
              // returned (see POLICY_CATEGORY_ICONS) plus any custom ones
              // added from Browse policies, each showing how many of its
              // policies have a real explicitly-set value vs. how many are
              // still on inherited defaults - real counts, not fabricated
              // status.
              return (
                <div className="halofort-policy-tiles">
                  {groups.map(([category, rows]) => {
                    const configuredCount = rows.filter(p => p.value).length;
                    return (
                      <button key={category} onClick={() => setPolicyCategory(category)} className="metric-card"
                        style={{textAlign:"center", cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:8, padding:"22px 14px", width:"100%"}}>
                        <span style={{width:36, height:36, borderRadius:8, background:"var(--syncing-bg)", color:"var(--primary)", display:"flex", alignItems:"center", justifyContent:"center"}}>
                          <ActionIcon name={POLICY_CATEGORY_ICONS[category] || "nav_settings"} />
                        </span>
                        <span style={{fontSize:13, fontWeight:600, color:"var(--text)"}}>{category}</span>
                        <span style={{fontSize:11, color: configuredCount > 0 ? "var(--active-text)" : "var(--text-faint)", display:"flex", alignItems:"center", gap:4}}>
                          <ActionIcon name="help" />
                          {configuredCount > 0 ? `Configured (${configuredCount})` : "Not configured"}
                        </span>
                      </button>
                    );
                  })}
                </div>
              );
            })()
          ) : (
            <div className="scroll-list">
              {groupBy(allPolicies, p => p.category || "Security").map(([category, rows]) => (
                <React.Fragment key={category}>
                  <p className="insight-group-title">{category}</p>
                  {rows.map(p => (
                    <PolicyEditRow key={p.schemaName} schema={{ schema: p.schemaName, displayName: p.displayName }}
                      resolved={p} isAdmin={isAdmin} orgUnits={orgUnits} onChanged={reloadPolicies} category={category} fields={p.fields}
                      onRemoveFromCompliance={customPolicySchemas.some(s => s.schemaName === p.schemaName) ? () => removeCustomPolicySchema(p.schemaName) : undefined} />
                  ))}
                </React.Fragment>
              ))}
            </div>
          )}
        </div>
      )}

      {subtab === "browse" && (
        <div className="card">
          <h3 className="card-title">
            Browse policies
            <InfoDot text="Searches the Chrome Policy API's real schema catalog - the same one Admin console's own policy editor uses. This is how app/extension management, managed networks, kiosk config, and print management are reached: they're all just policy schemas, found here by keyword instead of guessed as separate hardcoded integrations." />
          </h3>
          <p className="empty-note" style={{marginBottom:12}}>
            Search by keyword - try "extension", "network", "kiosk", or "print" to find the schemas for app/extension management, managed networks, kiosk setup, or printers.
          </p>
          <div className="action-row" style={{marginBottom:12}}>
            <input value={browseQuery} onChange={e => setBrowseQuery(e.target.value)} onKeyDown={e => e.key === "Enter" && runBrowseSearch()}
              placeholder="extension, network, kiosk, print..." style={{flex:1, minWidth:200, fontSize:13, padding:"6px 8px"}} />
            <button className="btn-primary" disabled={browseLoading} onClick={runBrowseSearch}>{browseLoading ? "Searching..." : "Search"}</button>
          </div>
          {browseError ? (
            <p className="empty-note" style={{color:"var(--critical-text)"}}>{browseError}</p>
          ) : !browseResults ? (
            <p className="empty-note">Search above to find a real policy schema by keyword.</p>
          ) : browseResults.length === 0 ? (
            <p className="empty-note">No schemas matched "{browseQuery}".</p>
          ) : (
            <div className="scroll-list">
              {browseResults.map(s => {
                const displayName = s.category ? `${s.category}: ${s.schemaName.split(".").pop()}` : s.schemaName;
                const alreadyShown = allPolicies.some(p => p.schemaName === s.schemaName);
                return (
                  <PolicyEditRow key={s.schemaName} isAdmin={isAdmin} orgUnits={orgUnits}
                    schema={{ schema: s.schemaName, displayName }}
                    description={s.description} fields={s.fields} resolved={undefined}
                    isInCompliance={alreadyShown}
                    onAddToCompliance={() => addCustomPolicySchema({ schemaName: s.schemaName, displayName, category: s.category || "Other" })} />
                );
              })}
            </div>
          )}
        </div>
      )}

      {subtab === "roles" && (
        <div className="card">
          <h3 className="card-title">Admin roles</h3>
          <p className="empty-note" style={{marginBottom:12}}>Who holds which Google Admin role - Google Workspace's own admin roles, not this portal's login roles (see Settings).</p>
          {rolesError ? (
            <p className="empty-note" style={{color:"var(--critical-text)", maxHeight:90, overflowY:"auto"}} title={rolesError}>Not authorized yet: {rolesError}</p>
          ) : !roles ? (
            <p className="empty-note">Loading...</p>
          ) : roles.length === 0 ? (
            <p className="empty-note">No role assignments found.</p>
          ) : (
            <div className="scroll-list">
              {roles.map((r, i) => (
                <div className="aue-row" key={i}>
                  <span>{r.assigneeEmail} <span style={{fontSize:11, color:"var(--text-faint)"}}>({r.assigneeType.toLowerCase()})</span></span>
                  <span style={{display:"flex", alignItems:"center", gap:8}}>
                    <span style={{fontSize:12, color:"var(--text-muted)"}}>{r.roleName}</span>
                    {r.isSuperAdminRole && <span className="badge critical">super admin</span>}
                    <span className={`badge ${roleScopeBadge(r.scopeType)}`}>{r.scopeType === "ORG_UNIT" ? r.orgUnitPath || "org unit" : "customer-wide"}</span>
                  </span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </>
  );
}

function ReportIcon({ type }) {

  if (type === "laptop") return <svg {...common} role="img" aria-label="devices"><rect x="4" y="4" width="16" height="11" rx="1" /><path d="M2 19h20" /></svg>;
  if (type === "insights") return <svg {...common} role="img" aria-label="insights"><path d="M3 12l4-4 4 4 6-6 4 4" /></svg>;
  return <svg {...common} role="img" aria-label="locked"><rect x="5" y="10" width="14" height="9" rx="1.5" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg>;
}

// ReportDataCard: the shell for a report backed by a live Google API call
// that might not be authorized yet - shows loading, an auth-needed message
// with the raw error (so it's obvious what to fix), or the data itself.
function ReportDataCard({ title, icon, loading, error, items, renderItem, emptyText, exportFilename }) {
  const shown = items ? items.slice(0, 3) : [];
  return (
    <div className="report-card">
      <div className="report-card-head"><h4>{title}</h4><ReportIcon type={icon} /></div>
      {error ? (
        <p className="report-card-desc" style={{color:"var(--critical-text)", maxHeight:90, overflowY:"auto"}} title={error}>Not authorized yet: {error}</p>
      ) : loading ? (
        <p className="report-card-desc">Loading...</p>
      ) : shown.length === 0 ? (
        <p className="report-card-desc">{emptyText}</p>
      ) : (
        <div style={{flex:1}}>
          {shown.map(renderItem)}
          {items.length > shown.length && <p className="empty-note" style={{marginTop:6}}>+{items.length - shown.length} more</p>}
        </div>
      )}
      {exportFilename && items?.length > 0 && (
        <div className="report-card-foot"><ExportButton rows={items} filename={exportFilename} /></div>
      )}
    </div>
  );
}

// Reports tab. The first three cards are built entirely from data already
// pulled via the Directory API - no new Google access needed. The next
// four call the separate Chrome Management API (chrome.management.reports.readonly)
// - a new scope that needs to be added to domain-wide delegation in Admin
// console before these will return data instead of an auth error. Legacy
// Technology Report has no public API at all, so it stays locked.
// toCSV/downloadCSV: plain client-side export, no backend round-trip -
// every report on this tab is already fetched into the browser's own
// state, so there's no new data to request, just a different serialization
// of what's already here. Values are quoted and internal quotes doubled
// per RFC 4180, so commas/quotes in device names or app titles don't
// corrupt the column structure.
function toCSV(rows) {
  if (!rows || rows.length === 0) return "";
  const headers = Object.keys(rows[0]);
  const escape = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [headers.map(escape).join(",")];
  rows.forEach(row => lines.push(headers.map(h => escape(row[h])).join(",")));
  return lines.join("\r\n");
}
function downloadCSV(filename, rows) {
  const csv = toCSV(rows);
  if (!csv) return;
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function ExportButton({ label, rows, filename }) {
  return (
    <button disabled={!rows || rows.length === 0} title={rows && rows.length > 0 ? "" : "No data to export"}
      style={{fontSize:12, padding:"4px 10px"}} onClick={() => downloadCSV(filename, rows)}>
      {label || "Export CSV"}
    </button>
  );
}

// AppDeviceUsageSection: the Reports tab's "Top apps" card only shows
// fleet-wide aggregate counts (CountInstalledApps) - no way to see which
// specific devices used a given app or for how long. There's no fleet-wide
// API for that (confirmed earlier this session that the closest thing,
// FindInstalledAppDevices, uses a different device-ID namespace and had to
// be removed as unusable). The real fix is what each device's own Apps tab
// already does correctly - GetDeviceTelemetry's per-device AppUsageData -
// just fetched for every device and pivoted by app instead of by device.
// On-demand (not auto-fetched) since it's genuinely one HTTP call per
// device, run with bounded concurrency the same way ListPolicies is.
function AppDeviceUsageSection({ devices, chromeReports }) {
  const [rows, setRows] = useState(null); // null = never loaded
  const [progress, setProgress] = useState({ done: 0, total: 0 });
  const [search, setSearch] = useState("");
  const loadingRef = React.useRef(false);

  const appCatalog = React.useMemo(() => {
    const catalog = {};
    [...(chromeReports?.installedApps || []), ...(chromeReports?.androidApps || [])].forEach(a => { catalog[a.appId] = a; });
    return catalog;
  }, [chromeReports]);

  const load = async () => {
    if (loadingRef.current || !devices?.length) return;
    loadingRef.current = true;
    setRows(null);
    setProgress({ done: 0, total: devices.length });
    const CONCURRENCY = 6;
    const out = [];
    let idx = 0;
    const worker = async () => {
      while (idx < devices.length) {
        const dev = devices[idx++];
        try {
          const r = await apiFetch(`${API}/devices/telemetry?id=${dev.id}`);
          if (r.ok) {
            const data = await r.json();
            (data.appsUsage || []).forEach(a => {
              const known = appCatalog[a.appId];
              out.push({
                appName: known?.displayName || a.appId,
                deviceName: dev.name,
                orgUnit: dev.orgUnit || "",
                appType: known ? catalogAppTypeLabel(known.appType) : appTypeLabel(a.appType),
                durationSeconds: a.runningDurationSeconds || 0,
              });
            });
          }
        } catch (e) { /* one device failing shouldn't block the rest */ }
        setProgress(p => ({ ...p, done: p.done + 1 }));
      }
    };
    await Promise.all(Array.from({ length: Math.min(CONCURRENCY, devices.length) }, worker));
    loadingRef.current = false;
    setRows(out);
  };

  const filtered = (rows || []).filter(r => !search || r.appName.toLowerCase().includes(search.toLowerCase()));
  const grouped = React.useMemo(() => {
    const m = {};
    filtered.forEach(r => { (m[r.appName] || (m[r.appName] = [])).push(r); });
    return Object.entries(m).sort((a, b) => b[1].length - a[1].length);
  }, [filtered]);

  // Usage as a friendly "1h 30m" string (same formatDuration the on-screen
  // list already uses) rather than a raw minutes count, so anyone reading
  // the CSV in Excel/Sheets doesn't have to mentally divide by 60 for
  // anything over an hour. The exact seconds are also included as a plain
  // number in its own column, for whoever actually wants to sort/filter by
  // duration in a spreadsheet instead of just reading it.
  const exportRows = filtered.map(r => ({
    App: r.appName, Device: r.deviceName, "Org unit": r.orgUnit, Type: r.appType || "",
    Usage: formatDuration(r.durationSeconds), "Usage (seconds)": r.durationSeconds,
  }));

  const isLoading = rows === null && progress.total > 0;

  return (
    <>
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8, marginTop:26}}>
        <p className="insight-group-title" style={{margin:0}}>
          App usage by device
          <InfoDot text="Per-device app usage pivoted by app - built by fetching each device's own telemetry (one call per device), since there's no fleet-wide API that returns this. Subject to the same retention window as each device's own Apps tab." />
        </p>
        <div style={{display:"flex", gap:8, alignItems:"center"}}>
          {rows && rows.length > 0 && (
            <input placeholder="Filter by app..." value={search} onChange={e => setSearch(e.target.value)} style={{fontSize:12, padding:"4px 8px"}} />
          )}
          <ExportButton rows={exportRows} filename="app-usage-by-device.csv" />
          <button onClick={load} disabled={isLoading} style={{fontSize:12, padding:"4px 10px"}}>
            {isLoading ? `Loading ${progress.done}/${progress.total}...` : rows ? "Refresh" : "Load per-device usage"}
          </button>
        </div>
      </div>
      {rows === null && !isLoading && (
        <p className="empty-note" style={{marginTop:8}}>Not loaded yet - fetches every device's own telemetry, so it's on-demand rather than automatic.</p>
      )}
      {isLoading && <div style={{marginTop:8}}><FunLoader compact label={`Fetching device ${progress.done}/${progress.total}...`} /></div>}
      {rows && rows.length === 0 && <p className="empty-note" style={{marginTop:8}}>No app usage reported across the fleet in this window.</p>}
      {rows && rows.length > 0 && (
        <div className="scroll-list" style={{marginTop:8}}>
          {grouped.map(([appName, entries]) => (
            <details key={appName} style={{marginBottom:4}}>
              <summary style={{cursor:"pointer", fontSize:13, padding:"6px 0"}}>
                {appName} <span style={{color:"var(--text-faint)", fontSize:12}}>({entries.length} device{entries.length === 1 ? "" : "s"})</span>
              </summary>
              <div style={{paddingLeft:16}}>
                {entries.map((e, i) => (
                  <div className="aue-row" key={i}>
                    <span>{e.deviceName}{e.orgUnit ? ` · ${e.orgUnit}` : ""}</span>
                    <span style={{fontSize:12, color:"var(--text-muted)"}}>{formatDuration(e.durationSeconds)}</span>
                  </div>
                ))}
              </div>
            </details>
          ))}
        </div>
      )}
    </>
  );
}

function ReportsPanel({ insights, devices, setTab }) {
  const [chromeReports, setChromeReports] = useState(null);
  const [reportsLoading, setReportsLoading] = useState(true);
  const [reportsError, setReportsError] = useState(null);

  useEffect(() => {
    apiFetch(`${API}/chrome-reports`)
      .then(async r => {
        if (!r.ok) throw new Error(await r.text());
        return r.json();
      })
      .then(data => { setChromeReports(data); setReportsLoading(false); })
      .catch(e => { setReportsError(e.message); setReportsLoading(false); });
  }, []);

  if (!insights) return null;

  const topOsVersions = Object.entries(insights.osVersions).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const needsAttention = insights.expiringSoon.length + insights.storageWarnings.length + insights.ramWarnings.length
    + insights.hotDevices.length + insights.outdatedTpmDevices.length + insights.pendingUpdateDevices.length
    + insights.devModeDevices.length + insights.extendedSupportNeeded.length;

  const exportAll = () => {
    if (devices?.length) downloadCSV("devices.csv", devices);
    if (chromeReports?.printers?.length) downloadCSV("printers-report.csv", chromeReports.printers);
    if (chromeReports?.crashEvents?.length) downloadCSV("crash-report.csv", chromeReports.crashEvents);
    if (chromeReports?.installedApps?.length) downloadCSV("apps-extensions-report.csv", chromeReports.installedApps);
    if (chromeReports?.androidApps?.length) downloadCSV("android-apps-report.csv", chromeReports.androidApps);

  return (
    <div className="card">
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8}}>
        <h3 className="card-title" style={{margin:0}}>Reports</h3>
        <button onClick={exportAll} style={{fontSize:12, padding:"5px 10px"}}>Export all (CSV)</button>
      </div>
      <p className="empty-note" style={{margin:"10px 0 16px"}}>
        The first three cards use data already synced via the Directory API - covering devices. The next four call Google's separate
        Chrome Management API (chrome.management.reports.readonly) - covering Chrome browser/app usage; add that scope to domain-wide delegation in
        Admin console to unlock them. Legacy Technology Report has no public API and stays unavailable. Every card with data can export it as CSV individually, or use "Export all" above for everything at once.
      </p>
      <div className="report-grid">
        <div className="report-card">
          <div className="report-card-head"><h4>Chrome Versions Report</h4><ReportIcon type="chart" /></div>
          <p className="report-card-desc">
            Browser/OS versions active across your fleet.
            {topOsVersions.length > 0 && ` Top: ${topOsVersions.map(([v, c]) => `${v} (${c})`).join(", ")}.`}
          </p>
          <div className="report-card-foot"><button onClick={() => setTab("insights")}>View distributions</button></div>
        </div>

        <div className="report-card">
          <div className="report-card-head"><h4>Devices Report</h4><ReportIcon type="laptop" /></div>
          <p className="report-card-desc">{insights.activeDevices} active, {insights.offlineDevices} offline, {insights.devModeDevices.length} in Developer mode.</p>
          <div className="report-card-foot" style={{display:"flex", gap:8}}>
            <button onClick={() => setTab("devices")}>View devices</button>
            <ExportButton rows={devices} filename="devices.csv" />
          </div>
        </div>

        <div className="report-card">
          <div className="report-card-head"><h4>Chrome Insights Report</h4><ReportIcon type="insights" /></div>
          <p className="report-card-desc">AUE warnings, devices needing attention, and fleet hardware health &mdash; <strong>{needsAttention}</strong> device-level items currently flagged.</p>
          <div className="report-card-foot"><button onClick={() => setTab("insights")}>View warnings</button></div>
        </div>

        <ReportDataCard
          title="Printers Report" icon="chart" loading={reportsLoading} error={reportsError}
          items={chromeReports?.printers} emptyText="No print activity in the last 30 days."
          renderItem={p => (
            <div className="metric-item" key={p.printer}>
              <span className="metric-item-name" title={p.printer}>{p.printer}</span>
              <span className="metric-item-value">{p.jobCount} jobs</span>
            </div>
          )}
          exportFilename="printers-report.csv"
        />

        <ReportDataCard
          title="Chrome Crash Report" icon="insights" loading={reportsLoading} error={reportsError}
          items={chromeReports?.crashEvents} emptyText="No crashes in the last 30 days."
          renderItem={(c, i) => (
            <div className="metric-item" key={i}>
              <span className="metric-item-name" title={c.browserVersion}>{c.browserVersion} &bull; {c.date}</span>
              <span className="metric-item-value">{c.count} crashes</span>
            </div>

          exportFilename="crash-report.csv"

        <div className="report-card locked">
          <div className="report-card-head"><h4>Legacy Technology Report</h4><ReportIcon type="lock" /></div>
          <p className="report-card-desc">Usage of deprecated Chrome web platform features.</p>
          <div className="report-card-foot"><span className="lock-note">No public Google API for this report</span></div>
        </div>
      </div>

      {chromeReports && (chromeReports.installedApps?.length > 0 || chromeReports.androidApps?.length > 0) && (
        <>
          <p className="insight-group-title">App insights</p>
          <div className="cards-grid">
            <DistributionCard
              title="Top apps &amp; extensions (by device)"
              distribution={Object.fromEntries((chromeReports.installedApps || []).map(a => [a.displayName, a.browserDeviceCount]))}
              exportRows={chromeReports.installedApps} exportFilename="apps-extensions-report.csv"
            />
            <DistributionCard
              title="Top Android apps (by user)"
              distribution={Object.fromEntries((chromeReports.androidApps || []).map(a => [a.displayName, a.osUserCount]))}
